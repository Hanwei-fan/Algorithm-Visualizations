<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排序算法演示 // CYBER</title>
<style>
  :root {
    --bg: #07060f;
    --panel: rgba(18, 15, 38, 0.72);
    --border: #2a2350;
    --text: #e6e1ff;
    --muted: #7d76a8;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --yellow: #ffd400;
    --green: #00ff9c;
    --grid: rgba(0, 240, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    line-height: 1.55;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.14), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(0,240,255,0.14), transparent 45%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  header h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px rgba(0,240,255,.5), 3px 0 var(--magenta);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .back {
    display: inline-block; margin: 14px 30px 0; padding: 6px 16px;
    border: 1px solid var(--border); border-radius: 4px; text-decoration: none;
    color: var(--cyan); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .back:hover { border-color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  .tabs { display: flex; gap: 10px; padding: 14px 30px 4px; flex-wrap: wrap; }
  .tab {
    padding: 9px 18px; border: 1px solid var(--border); border-radius: 4px;
    background: rgba(0,240,255,0.03); color: var(--cyan); font-size: 14px;
    letter-spacing: 1px; cursor: pointer;
    font-family: "SF Mono", Menlo, monospace;
    transition: all .18s; clip-path: polygon(0 0, 100% 0, 100% 70%, 94% 100%, 0 100%);
  }
  .tab:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.35) inset; }
  .tab.active {
    background: var(--cyan); color: #05060f; border-color: var(--cyan);
    box-shadow: 0 0 18px rgba(0,240,255,.6); font-weight: 700;
  }
  .subtabs { display: flex; align-items: center; gap: 10px; padding: 10px 30px 0; flex-wrap: wrap; }
  .sublabel { font-size: 12px; color: var(--muted); letter-spacing: 1px; font-family: "SF Mono", Menlo, monospace; }
  .subtab {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(160,107,255,0.06); color: #c9b3ff; font-size: 13px;
    cursor: pointer; font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .subtab:hover { border-color: #a06bff; box-shadow: 0 0 10px rgba(160,107,255,.35); }
  .subtab.active { background: #a06bff; color: #05060f; border-color: #a06bff; font-weight: 700; box-shadow: 0 0 12px rgba(160,107,255,.5); }
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; padding: 18px 30px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; background: rgba(5,4,15,0.8); color: var(--text);
    font-family: "SF Mono", Menlo, monospace; width: 240px;
  }
  .field input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  .speed { display: flex; flex-direction: column; gap: 5px; }
  .speed label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .speed input { width: 130px; accent-color: var(--magenta); }
  .btn {
    padding: 10px 20px; border: 1px solid var(--magenta); border-radius: 4px;
    background: rgba(255,43,214,0.12); color: var(--magenta); font-size: 14px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .btn:hover:not(:disabled) { background: var(--magenta); color: #05060f; box-shadow: 0 0 16px rgba(255,43,214,.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.secondary { border-color: var(--border); color: var(--muted); background: rgba(255,255,255,0.02); }
  .btn.secondary:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(0,240,255,.05), 0 8px 40px rgba(0,0,0,.5);
  }
  /* 柱状图 */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 300px; padding-top: 20px; margin-bottom: 26px; }
  .bar {
    flex: 1; border-radius: 4px 4px 0 0; position: relative;
    background: linear-gradient(180deg, rgba(0,240,255,0.55), rgba(0,240,255,0.12));
    border: 1px solid var(--border); border-bottom: none;
    display: flex; align-items: flex-start; justify-content: center;
    transition: background .15s, box-shadow .15s, transform .15s;
    min-width: 6px;
  }
  .bar .v {
    font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--text);
    margin-top: -18px; font-weight: 700;
  }
  .bar.compare { background: linear-gradient(180deg, var(--yellow), rgba(255,212,0,.3)); border-color: var(--yellow); box-shadow: 0 0 14px rgba(255,212,0,.6); transform: translateY(-4px); }
  .bar.swap { background: linear-gradient(180deg, var(--magenta), rgba(255,43,214,.3)); border-color: var(--magenta); box-shadow: 0 0 16px rgba(255,43,214,.7); }
  .bar.pivot { background: linear-gradient(180deg, #a06bff, rgba(160,107,255,.3)); border-color: #a06bff; box-shadow: 0 0 14px rgba(160,107,255,.6); }
  .bar.sorted { background: linear-gradient(180deg, var(--green), rgba(0,255,156,.25)); border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,156,.4); }
  /* 归并：主图里左/右段分色 */
  .bar.segL { background: linear-gradient(180deg, rgba(0,240,255,.6), rgba(0,240,255,.15)); border-color: var(--cyan); }
  .bar.segR { background: linear-gradient(180deg, rgba(160,107,255,.6), rgba(160,107,255,.15)); border-color: #a06bff; }
  /* 辅助数组区 */
  .auxwrap { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .auxlabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-family: "SF Mono", Menlo, monospace; }
  .aux { display: flex; gap: 5px; flex-wrap: wrap; }
  .acell {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .acell .box {
    min-width: 36px; height: 40px; padding: 0 6px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; border: 1px solid var(--border);
    transition: all .15s;
  }
  .acell.L .box { background: rgba(0,240,255,.12); border-color: var(--cyan); color: var(--cyan); }
  .acell.R .box { background: rgba(160,107,255,.14); border-color: #a06bff; color: #c9b3ff; }
  .acell.empty .box { border-style: dashed; border-color: var(--border); background: transparent; }
  .acell.used .box { opacity: .35; }
  .acell.cur .box { box-shadow: 0 0 16px var(--yellow); transform: translateY(-4px); background: var(--yellow); border-color: var(--yellow); color: #120e00; }
  .acell .ix { font-size: 10px; color: var(--muted); }
  .bar.hole {
    background: transparent; border: 2px dashed var(--magenta);
    box-shadow: none; opacity: .7;
  }
  .bar.hole .v { visibility: hidden; }
  .bars { position: relative; }
  .range-frame {
    position: absolute; top: 0; bottom: 0; z-index: 3; pointer-events: none;
    border: 2px solid var(--cyan); border-radius: 8px;
    box-shadow: 0 0 14px rgba(0,240,255,.4), 0 0 14px rgba(0,240,255,.25) inset;
    transition: left .18s, width .18s;
  }
  .ijptr {
    position: absolute; bottom: -20px; transform: translateX(-50%); z-index: 4;
    font-family: "SF Mono", Menlo, monospace; font-size: 13px; font-weight: 700;
    pointer-events: none; letter-spacing: .5px;
  }
  .ijptr.i { color: var(--cyan); text-shadow: 0 0 8px rgba(0,240,255,.7); }
  .ijptr.j { color: #a06bff; text-shadow: 0 0 8px rgba(160,107,255,.7); }
  .ijptr.ij { color: var(--yellow); text-shadow: 0 0 8px rgba(255,212,0,.7); }
  .range-frame .rlabel {
    position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
    font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: var(--cyan);
    letter-spacing: 1px; white-space: nowrap; text-shadow: 0 0 8px rgba(0,240,255,.6);
  }
  .held {
    position: absolute; top: -6px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: "SF Mono", Menlo, monospace; transition: left .18s;
    pointer-events: none; z-index: 5;
  }
  .held .keybar {
    width: 30px; border-radius: 4px;
    background: linear-gradient(180deg, var(--magenta), rgba(255,43,214,.35));
    border: 1px solid var(--magenta); box-shadow: 0 0 16px rgba(255,43,214,.7);
    display: flex; align-items: flex-start; justify-content: center;
  }
  .held .keybar span { font-size: 11px; font-weight: 700; color: #fff; margin-top: 2px; }
  .held .tip { font-size: 10px; color: var(--magenta); letter-spacing: 1px; }
  .tlegend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .tlegend span { display: inline-flex; align-items: center; gap: 6px; }
  .tlegend .dot { width: 12px; height: 12px; border-radius: 3px; }
  /* 右栏 */
  .pseudocode {
    background: rgba(3,2,12,0.85); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: #8fb8c9; margin: 0 0 16px;
    overflow-x: auto;
  }
  .pseudocode .line {
    padding: 2px 8px; border-radius: 3px;
    white-space: pre-wrap; word-break: break-word;
  }
  .pseudocode .line.active {
    background: linear-gradient(90deg, rgba(255,43,214,.9), rgba(0,240,255,.6));
    color: #fff; box-shadow: 0 0 14px rgba(255,43,214,.5);
  }
  .stats { display: flex; gap: 24px; font-size: 14px; align-items: baseline; margin-bottom: 12px; }
  .stats b { font-size: 22px; color: var(--yellow); font-family: "SF Mono", Menlo, monospace; text-shadow: 0 0 12px rgba(255,212,0,.6); }
  .meta { font-size: 12.5px; color: var(--muted); font-family: "SF Mono", Menlo, monospace; margin-bottom: 12px; }
  .meta b { color: var(--cyan); }
  .status { margin-top: 4px; font-size: 15px; min-height: 22px; color: var(--text); font-family: "SF Mono", Menlo, monospace; }
  .note { padding: 6px 30px 30px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
</style>
<script>
/* 防 FOUC：body 绘制前先按已存主题设好关键 CSS 变量，避免浅色主题刷新时闪一下深色。theme.js 之后再补全。 */
(function () {
  try {
    var V = {
      cyber: { "--bg": "#07060f", "--grid": "rgba(0,240,255,0.06)", "--text": "#e6e1ff", "--panel": "rgba(18,15,38,0.72)", "--border": "#2a2350", "--muted": "#7d76a8" },
      ocean: { "--bg": "#0e1524", "--grid": "rgba(120,170,220,0.05)", "--text": "#e8eef7", "--panel": "rgba(22,32,52,0.82)", "--border": "#2b3b57", "--muted": "#8fa2bd" },
      sepia: { "--bg": "#f3ecde", "--grid": "rgba(150,130,95,0.06)", "--text": "#3a332a", "--panel": "rgba(255,251,242,0.86)", "--border": "#d8c9ad", "--muted": "#8a7f6c" },
      light: { "--bg": "#f7f9fc", "--grid": "rgba(80,120,170,0.05)", "--text": "#1f2733", "--panel": "rgba(255,255,255,0.9)", "--border": "#d5dde8", "--muted": "#6b7688" }
    };
    var t = localStorage.getItem("algoviz-theme") || "cyber";
    if (!V[t]) t = "cyber";
    var d = document.documentElement, v = V[t];
    for (var k in v) d.style.setProperty(k, v[k]);
    d.style.setProperty("color-scheme", (t === "sepia" || t === "light") ? "light" : "dark");
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1>排序算法演示</h1>
  <p id="subtitle"></p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="tabs">
  <button class="tab active" data-algo="bubble">冒泡排序</button>
  <button class="tab" data-algo="selection">选择排序</button>
  <button class="tab" data-algo="insertion">插入排序</button>
  <button class="tab" data-algo="quick">快速排序</button>
  <button class="tab" data-algo="merge">归并排序</button>
</div>

<div class="subtabs" id="mergeSub" style="display:none">
  <span class="sublabel">实现方式：</span>
  <button class="subtab active" data-merge="mergeTD">自顶向下（递归）</button>
  <button class="subtab" data-merge="mergeBU">自底向上（迭代）</button>
</div>

<div class="controls">
  <div class="field">
    <label for="dataInput">数据（逗号分隔，留空则随机）</label>
    <input id="dataInput" type="text" placeholder="如 5, 2, 9, 1, 7">
  </div>
  <div class="speed">
    <label for="speedInput">速度</label>
    <input id="speedInput" type="range" min="60" max="900" value="450" step="30">
  </div>
  <button class="btn" id="playBtn">开始排序</button>
  <button class="btn secondary" id="stepBtn">单步</button>
  <button class="btn secondary" id="resetBtn">重置</button>
  <button class="btn secondary" id="randBtn">随机生成</button>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<main>
  <section class="card">
    <div class="bars" id="bars"></div>
    <div class="auxwrap" id="auxwrap" style="display:none">
      <div class="auxlabel">辅助数组（存放合并的有序结果，最后还原回原数组）</div>
      <div class="aux" id="aux"></div>
    </div>
    <div class="tlegend">
      <span><i class="dot" style="background:#ffd400"></i>正在比较</span>
      <span><i class="dot" style="background:#ff2bd6"></i>交换/移动</span>
      <span><i class="dot" style="background:#a06bff"></i>基准 (pivot)</span>
      <span><i class="dot" style="background:#00ff9c"></i>已就位</span>
      <span><i class="dot" style="background:#00f0ff"></i>归并·左段 / 快排指针 i</span>
      <span><i class="dot" style="background:#a06bff"></i>归并·右段 / 快排指针 j</span>
    </div>
  </section>
  <section class="card">
    <div class="stats">
      比较：<b id="cmpCount">0</b>
      <span>交换/移动：<b id="swapCount">0</b></span>
    </div>
    <div class="meta" id="meta"></div>
    <div class="pseudocode" id="code"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note" id="note"></div>

<script>
const $ = id => document.getElementById(id);

const CFG = {
  bubble: {
    subtitle: "冒泡排序：相邻元素两两比较，逆序则交换，每趟把最大值“冒”到末尾。",
    meta: "时间复杂度 平均/最坏 <b>O(n²)</b>，最好 <b>O(n)</b>（已有序）· 空间 <b>O(1)</b> · <b>稳定</b>",
    note: "每一趟从左到右比较相邻元素，大的往后交换。一趟结束后末尾元素已就位，下一趟范围缩小 1。",
    code: [
      "for i = 0 to n-1:",
      "    for j = 0 to n-2-i:",
      "        if a[j] > a[j+1]:",
      "            swap(a[j], a[j+1])",
    ],
  },
  selection: {
    subtitle: "选择排序：每趟从未排序区间选出最小值，放到已排序区间末尾。",
    meta: "时间复杂度 <b>O(n²)</b>（各种情况） · 空间 <b>O(1)</b> · <b>不稳定</b> · 交换次数少（≤ n-1）",
    note: "每趟在未排序部分扫描找最小元素的下标，再与未排序部分的第一个元素交换。",
    code: [
      "for i = 0 to n-1:",
      "    min = i",
      "    for j = i+1 to n-1:",
      "        if a[j] < a[min]: min = j",
      "    swap(a[i], a[min])",
    ],
  },
  insertion: {
    subtitle: "插入排序：把每个元素插入到前面已排序序列的正确位置，像整理扑克牌。",
    meta: "时间复杂度 平均/最坏 <b>O(n²)</b>，最好 <b>O(n)</b> · 空间 <b>O(1)</b> · <b>稳定</b> · 近乎有序时很快",
    note: "取当前元素为待插入值，与前面已排序元素从右往左比较，较大者依次后移，找到位置后插入。",
    code: [
      "for i = 1 to n-1:",
      "    key = a[i]; j = i-1",
      "    while j >= 0 and a[j] > key:",
      "        a[j+1] = a[j]; j--",
      "    a[j+1] = key",
    ],
  },
  quick: {
    subtitle: "快速排序：首元素为基准，对撞双指针一右一左扫描并交换，最后基准归位。",
    meta: "时间复杂度 平均 <b>O(n log n)</b>，最坏 <b>O(n²)</b> · 空间 <b>O(log n)</b> · <b>不稳定</b>",
    note: "取区间首元素为基准 pivot。i 从左、j 从右对撞：先让 j 从后向前找第一个 < 基准的元素，再让 i 从前向后找第一个 > 基准的元素，交换二者。重复直到 i 与 j 相遇，把基准交换到相遇位置——此时左侧都 ≤ 基准、右侧都 ≥ 基准，再递归两侧。",
    code: [
      "quicksort(lo, hi):",
      "    if lo >= hi: return",
      "    pivot = a[lo]; i = lo; j = hi",
      "    while i < j:",
      "        while i<j and a[j]>=pivot: j--  // 右→左找小",
      "        while i<j and a[i]<=pivot: i++  // 左→右找大",
      "        if i<j: swap(a[i], a[j])",
      "    swap(a[lo], a[i])  // 基准归位",
      "    quicksort(lo,i-1); quicksort(i+1,hi)",
    ],
  },
  mergeTD: {
    subtitle: "归并排序·自顶向下（递归）：把区间对半拆到最小，再回溯时两两有序合并。",
    meta: "时间复杂度 <b>O(n log n)</b>（各种情况） · 空间 <b>O(n)</b> · <b>稳定</b> · 递归实现",
    note: "递归地把区间对半拆分（先拆左半、再拆右半），直到长度为 1；然后在回溯时把两个有序子区间合并成一个有序区间（借助辅助数组），逐层向上合并。",
    code: [
      "mergesort(lo, hi):",
      "    if lo >= hi: return",
      "    mid = (lo+hi)/2",
      "    mergesort(lo, mid)      // 递归左半",
      "    mergesort(mid+1, hi)    // 递归右半",
      "    merge(lo, mid, hi)      // 合并两个有序段",
    ],
  },
  mergeBU: {
    subtitle: "归并排序·自底向上（二路归并）：不用递归，按子段长度 1,2,4,8… 逐层两两合并。",
    meta: "时间复杂度 <b>O(n log n)</b>（各种情况） · 空间 <b>O(n)</b> · <b>稳定</b> · 迭代实现，无递归栈",
    note: "把每个元素看作长度为 1 的有序段。第一轮两两合并成长度 2 的有序段，第二轮合并成长度 4……子段长度 width 每轮翻倍，直到覆盖整个数组。末尾不足一对的段直接保留。",
    code: [
      "for width = 1; width < n; width *= 2:",
      "    for lo = 0; lo < n; lo += 2*width:",
      "        mid = lo + width - 1",
      "        hi  = min(lo + 2*width - 1, n-1)",
      "        if mid < hi:",
      "            merge(lo, mid, hi)  // 合并相邻两段",
    ],
  },
};

let algo = "bubble";
let arr = [];
let steps = [], idx = 0, timer = null;

// 每一步快照：{arr, compare[], swap[], pivot, sorted[], range, line, desc, cmp, swp}
function makeGen() {
  const out = [];
  let cmp = 0, swp = 0;
  const push = (a, o) => out.push(Object.assign({
    arr: [...a], compare: [], swap: [], pivot: -1, sorted: [], range: null,
    line: -1, desc: "", cmp, swp,
  }, o));
  return { out, push, incCmp: () => cmp++, incSwp: () => swp++, get cmp() { return cmp; }, get swp() { return swp; } };
}

function genBubble(a) {
  const g = makeGen(); a = [...a]; const n = a.length; const sorted = [];
  g.push(a, { line: 0, desc: "开始冒泡排序。" });
  for (let i = 0; i < n; i++) {
    const rng = [0, n - 1 - i];   // 本趟待排序区间
    for (let j = 0; j < n - 1 - i; j++) {
      g.incCmp();
      g.push(a, { compare: [j, j + 1], sorted: [...sorted], range: rng, line: 2, desc: `比较 a[${j}]=${a[j]} 与 a[${j+1}]=${a[j+1]}` });
      if (a[j] > a[j + 1]) {
        [a[j], a[j + 1]] = [a[j + 1], a[j]]; g.incSwp();
        g.push(a, { swap: [j, j + 1], sorted: [...sorted], range: rng, line: 3, desc: `逆序，交换 a[${j}] 与 a[${j+1}]` });
      }
    }
    sorted.unshift(n - 1 - i);
    g.push(a, { sorted: [...sorted], line: 1, desc: `第 ${i+1} 趟结束，a[${n-1-i}] 已就位。` });
  }
  g.push(a, { sorted: a.map((_, k) => k), desc: "排序完成！" });
  return g.out;
}

function genSelection(a) {
  const g = makeGen(); a = [...a]; const n = a.length; const sorted = [];
  g.push(a, { line: 0, desc: "开始选择排序。" });
  for (let i = 0; i < n; i++) {
    let min = i;
    g.push(a, { sorted: [...sorted], range: [i, n - 1], pivot: min, line: 1, desc: `第 ${i+1} 趟：假设最小值是 a[${i}]=${a[i]}` });
    for (let j = i + 1; j < n; j++) {
      g.incCmp();
      g.push(a, { compare: [j, min], sorted: [...sorted], pivot: min, range: [i, n - 1], line: 3, desc: `比较 a[${j}]=${a[j]} 与当前最小 a[${min}]=${a[min]}` });
      if (a[j] < a[min]) { min = j; g.push(a, { pivot: min, sorted: [...sorted], range: [i, n - 1], line: 3, desc: `更新最小值下标为 ${min}` }); }
    }
    if (min !== i) { [a[i], a[min]] = [a[min], a[i]]; g.incSwp(); g.push(a, { swap: [i, min], sorted: [...sorted], line: 4, desc: `把最小值交换到位置 ${i}` }); }
    sorted.push(i);
    g.push(a, { sorted: [...sorted], line: 0, desc: `a[${i}] 已就位。` });
  }
  g.push(a, { sorted: a.map((_, k) => k), desc: "排序完成！" });
  return g.out;
}

function genInsertion(a) {
  const g = makeGen(); a = [...a]; const n = a.length;
  g.push(a, { sorted: [0], line: 0, desc: "开始插入排序，a[0] 视为已排序（绿色）。" });
  for (let i = 1; i < n; i++) {
    const key = a[i]; let j = i - 1;
    const rng = [0, i];   // 本轮处理区间：已排序前缀 + 待插入元素
    // 抽出 key：位置 i 空出（虚线槽），key 悬浮在上方
    g.push(a, { hole: i, held: key, sorted: rangeArr(0, i - 1), range: rng, line: 1,
      desc: `抽出 a[${i}] = ${key} 作为待插入值 key，位置 ${i} 空出。` });
    while (j >= 0 && a[j] > key) {
      g.incCmp();
      g.push(a, { compare: [j], hole: j + 1, held: key, sorted: rangeArr(0, i - 1), range: rng, line: 2,
        desc: `比较 a[${j}] = ${a[j]} 与 key = ${key}：${a[j]} > ${key}，需右移。` });
      a[j + 1] = a[j]; g.incSwp();
      g.push(a, { swap: [j + 1], hole: j, held: key, sorted: rangeArr(0, i - 1), range: rng, line: 3,
        desc: `a[${j}] 右移填入位置 ${j+1}，空位左移到 ${j}。` });
      j--;
    }
    if (j >= 0) { g.incCmp(); g.push(a, { compare: [j], hole: j + 1, held: key, sorted: rangeArr(0, i - 1), range: rng, line: 2,
      desc: `比较 a[${j}] = ${a[j]} 与 key = ${key}：${a[j]} ≤ ${key}，停止右移。` }); }
    a[j + 1] = key;
    g.push(a, { swap: [j + 1], hole: -1, held: null, sorted: rangeArr(0, i), range: rng, line: 4,
      desc: `把 key = ${key} 放入空位 ${j+1}，前 ${i+1} 个已有序。` });
  }
  g.push(a, { sorted: a.map((_, k) => k), hole: -1, held: null, desc: "排序完成！" });
  return g.out;
  function rangeArr(l, r) { const t = []; for (let k = l; k <= r; k++) t.push(k); return t; }
}

function genQuick(a) {
  const g = makeGen(); a = [...a]; const done = new Set();
  g.push(a, { line: 0, desc: "开始快速排序（首元素为基准，对撞指针分区）。" });
  (function qs(lo, hi) {
    if (lo > hi) return;
    if (lo === hi) { done.add(lo); g.push(a, { sorted: [...done], range: [lo, hi], line: 1, desc: `区间 [${lo},${hi}] 只有一个元素，已就位。` }); return; }
    const pivot = a[lo];   // 首元素为基准
    let i = lo, j = hi;
    g.push(a, { pivot: lo, range: [lo, hi], sorted: [...done], line: 2,
      desc: `选基准 pivot = a[${lo}] = ${pivot}。i=${i} 从左、j=${j} 从右对撞扫描。` });
    while (i < j) {
      // 从右向左找第一个 < 基准的元素
      while (i < j && a[j] >= pivot) {
        g.incCmp();
        g.push(a, { compare: [j], pivot: lo, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 4,
          desc: `j 左移：a[${j}]=${a[j]} ≥ ${pivot}，继续向前找更小的。` });
        j--;
      }
      if (i < j) {
        g.incCmp();
        g.push(a, { compare: [j], pivot: lo, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 4,
          desc: `j 停下：a[${j}]=${a[j]} < ${pivot}，找到一个应在左侧的元素。` });
      }
      // 从左向右找第一个 > 基准的元素
      while (i < j && a[i] <= pivot) {
        g.incCmp();
        g.push(a, { compare: [i], pivot: lo, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 5,
          desc: `i 右移：a[${i}]=${a[i]} ≤ ${pivot}，继续向后找更大的。` });
        i++;
      }
      if (i < j) {
        g.incCmp();
        g.push(a, { compare: [i], pivot: lo, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 5,
          desc: `i 停下：a[${i}]=${a[i]} > ${pivot}，找到一个应在右侧的元素。` });
      }
      if (i < j) {
        [a[i], a[j]] = [a[j], a[i]]; g.incSwp();
        g.push(a, { swap: [i, j], pivot: lo, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 6,
          desc: `交换 a[${i}] 与 a[${j}]，让小的到左、大的到右。` });
      }
    }
    // i == j：基准归位到相遇点
    if (lo !== i) { [a[lo], a[i]] = [a[i], a[lo]]; g.incSwp(); }
    done.add(i);
    g.push(a, { swap: (lo !== i ? [lo, i] : [i]), pivot: -1, ptrI: i, ptrJ: j, range: [lo, hi], sorted: [...done], line: 7,
      desc: `i、j 在位置 ${i} 相遇，把基准 ${pivot} 交换到此处归位。左侧都 ≤ 它、右侧都 ≥ 它。` });
    qs(lo, i - 1); qs(i + 1, hi);
  })(0, a.length - 1);
  g.push(a, { sorted: a.map((_, k) => k), desc: "排序完成！" });
  return g.out;
}

// 合并 [lo,mid] 与 [mid+1,hi]，line5 = 合并伪代码行
// 辅助数组 aux 存放本次合并「从小到大」的结果，最后整体还原回原数组。
// merge 字段：{ lo, mid, hi, i, j, aux:[{v,from}], phase, ci, cj, restoreIdx }
function mergeSteps(g, a, tmp, lo, mid, hi, mergeLine) {
  let i = lo, j = mid + 1;
  const aux = [];   // 合并输出（有序结果），元素记来源段
  const mk = (extra) => Object.assign({ lo, mid, hi, i, j, aux: aux.map(o => ({ ...o })) }, extra);
  g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "start" }),
    desc: `准备合并左段 [${lo},${mid}] 与右段 [${mid+1},${hi}]，辅助数组存放从小到大的结果。` });
  while (i <= mid && j <= hi) {
    g.incCmp();
    g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "compare", ci: i, cj: j }),
      desc: `比较 左段 a[${i}]=${a[i]} 与 右段 a[${j}]=${a[j]}` });
    let from;
    if (a[i] <= a[j]) { aux.push({ v: a[i], from: "L" }); from = "L"; i++; }
    else { aux.push({ v: a[j], from: "R" }); from = "R"; j++; }
    g.incSwp();
    g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "pick", picked: from }),
      desc: `较小者（${from === "L" ? "左" : "右"}段 ${aux[aux.length-1].v}）放入辅助数组第 ${aux.length} 位。` });
  }
  while (i <= mid) { aux.push({ v: a[i], from: "L" }); i++; g.incSwp();
    g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "pick", picked: "L" }),
      desc: `右段已空，左段剩余 ${aux[aux.length-1].v} 依次放入辅助数组。` }); }
  while (j <= hi) { aux.push({ v: a[j], from: "R" }); j++; g.incSwp();
    g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "pick", picked: "R" }),
      desc: `左段已空，右段剩余 ${aux[aux.length-1].v} 依次放入辅助数组。` }); }
  // 还原：把辅助数组（有序结果）拷回原数组
  for (let t = 0; t < aux.length; t++) {
    a[lo + t] = aux[t].v; g.incSwp();
    g.push(a, { swap: [lo + t], range: [lo, hi], line: mergeLine, merge: mk({ phase: "restore", restoreIdx: t }),
      desc: `还原：把辅助数组第 ${t+1} 个结果 ${aux[t].v} 写回原数组 a[${lo+t}]。` });
  }
  g.push(a, { range: [lo, hi], line: mergeLine, merge: mk({ phase: "done", restoreIdx: aux.length }),
    desc: `区间 [${lo},${hi}] 合并完成，辅助数组结果已全部还原。` });
}

// 自顶向下（递归）
function genMergeTD(a) {
  const g = makeGen(); a = [...a]; const tmp = [...a];
  g.push(a, { line: 0, desc: "开始归并排序（自顶向下·递归拆分）。" });
  (function ms(lo, hi) {
    if (lo >= hi) return;
    const mid = (lo + hi) >> 1;
    g.push(a, { range: [lo, hi], line: 2, desc: `拆分区间 [${lo},${hi}]，中点 ${mid}` });
    ms(lo, mid); ms(mid + 1, hi);
    mergeSteps(g, a, tmp, lo, mid, hi, 5);
  })(0, a.length - 1);
  g.push(a, { sorted: a.map((_, k) => k), desc: "排序完成！" });
  return g.out;
}

// 自底向上（二路归并，迭代）
function genMergeBU(a) {
  const g = makeGen(); a = [...a]; const tmp = [...a]; const n = a.length;
  g.push(a, { line: 0, desc: "开始归并排序（自底向上·迭代）。每个元素是长度 1 的有序段。" });
  for (let width = 1; width < n; width *= 2) {
    g.push(a, { line: 0, desc: `本轮子段长度 width = ${width}，两两合并成长度 ${width * 2} 的有序段。` });
    for (let lo = 0; lo < n; lo += 2 * width) {
      const mid = lo + width - 1;
      const hi = Math.min(lo + 2 * width - 1, n - 1);
      if (mid < hi) {
        mergeSteps(g, a, tmp, lo, mid, hi, 5);
      } else {
        // 末尾不足一对，直接保留
        g.push(a, { range: [lo, hi], line: 3, desc: `区间 [${lo},${hi}] 右侧无配对段，本轮保留不动。` });
      }
    }
  }
  g.push(a, { sorted: a.map((_, k) => k), desc: "排序完成！" });
  return g.out;
}

const GEN = { bubble: genBubble, selection: genSelection, insertion: genInsertion, quick: genQuick, mergeTD: genMergeTD, mergeBU: genMergeBU };

// ---------- 渲染 ----------
function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderCode(lines) {
  $("code").innerHTML = lines.map((l, i) => `<div class="line" data-line="${i}">${escHtml(l)}</div>`).join("");
}
function setLine(line) {
  $("code").querySelectorAll(".line").forEach(l => l.classList.remove("active"));
  const t = $("code").querySelector(`[data-line="${line}"]`); if (t) t.classList.add("active");
}

function draw(k) {
  const s = steps[k];
  const maxV = Math.max(...s.arr, 1);
  const cset = new Set(s.compare), sw = new Set(s.swap), sorted = new Set(s.sorted);
  const hole = (s.hole != null) ? s.hole : -1;
  const mg = s.merge || null;
  const bars = $("bars");
  bars.innerHTML = s.arr.map((v, i) => {
    let cls = "bar";
    if (i === hole) {
      cls += " hole";
      return `<div class="${cls}" style="height:${20 + (v / maxV) * 260}px"><span class="v">${v}</span></div>`;
    }
    if (sorted.has(i)) cls += " sorted";
    if (mg && i >= mg.lo && i <= mg.hi) {
      // 还原阶段：已写回的位置正常显示，未写回的仍属左/右段
      if (mg.phase === "restore" || mg.phase === "done") {
        if (i < mg.lo + (mg.restoreIdx || 0)) { /* 已还原，普通色 */ }
        else cls += (i <= mg.mid) ? " segL" : " segR";
      } else {
        // 收集阶段：尚未取用的元素按左/右段分色（i/j 之前的已取走）
        const taken = (i <= mg.mid) ? (i < mg.i) : (i < mg.j);
        if (!taken) cls += (i <= mg.mid) ? " segL" : " segR";
      }
    }
    if (i === s.pivot) cls += " pivot";
    if (cset.has(i)) cls += " compare";
    // 收集阶段高亮正在比较的原数组元素
    if (mg && mg.phase === "compare" && (i === mg.ci || i === mg.cj)) cls += " compare";
    if (sw.has(i)) cls += " swap";
    const h = 20 + (v / maxV) * 260;
    return `<div class="${cls}" style="height:${h}px"><span class="v">${v}</span></div>`;
  }).join("");

  // 辅助数组可视化：存放合并的有序结果
  const auxwrap = $("auxwrap");
  if (mg && mg.aux) {
    auxwrap.style.display = "block";
    const total = mg.hi - mg.lo + 1;
    const cells = [];
    for (let r = 0; r < total; r++) {
      const o = mg.aux[r];
      if (o) {
        let cls = "acell " + (o.from === "L" ? "L" : "R");
        // 刚放入的（收集阶段最后一个）高亮
        if ((mg.phase === "pick") && r === mg.aux.length - 1) cls += " cur";
        // 还原阶段：正在写回的那个高亮
        if (mg.phase === "restore" && r === mg.restoreIdx) cls += " cur";
        if ((mg.phase === "restore" && r < mg.restoreIdx) || mg.phase === "done") cls += " used";
        cells.push(`<div class="${cls}"><div class="box">${o.v}</div><div class="ix">${r + 1}</div></div>`);
      } else {
        cells.push(`<div class="acell empty"><div class="box"></div><div class="ix">${r + 1}</div></div>`);
      }
    }
    $("aux").innerHTML = cells.join("");
  } else {
    auxwrap.style.display = "none";
  }

  // 悬浮的待插入 key：定位在当前空位正上方
  if (s.held != null && hole >= 0) {
    const n = s.arr.length;
    const leftPct = (hole + 0.5) / n * 100;
    const kh = 20 + (s.held / maxV) * 260;
    const held = document.createElement("div");
    held.className = "held";
    held.style.left = leftPct + "%";
    held.innerHTML = `<div class="tip">key</div><div class="keybar" style="height:${kh}px"><span>${s.held}</span></div>`;
    bars.appendChild(held);
  }

  // 当前处理区间的高亮外边框
  if (s.range) {
    const [lo, hi] = s.range;
    const barEls = bars.querySelectorAll(".bar");
    const first = barEls[lo], last = barEls[hi];
    if (first && last) {
      const pad = 5;
      const left = first.offsetLeft - pad;
      const right = last.offsetLeft + last.offsetWidth + pad;
      const frame = document.createElement("div");
      frame.className = "range-frame";
      frame.style.left = left + "px";
      frame.style.width = (right - left) + "px";
      frame.innerHTML = `<span class="rlabel">处理区间 [${lo}, ${hi}]</span>`;
      bars.appendChild(frame);
    }
  }

  // 快排对撞指针 i / j 标记（在对应柱子下方）
  if (s.ptrI != null || s.ptrJ != null) {
    const barEls = bars.querySelectorAll(".bar");
    const addPtr = (idx, txt, kind) => {
      const el = barEls[idx];
      if (!el) return;
      const p = document.createElement("div");
      p.className = "ijptr " + kind;
      p.textContent = txt;
      p.style.left = (el.offsetLeft + el.offsetWidth / 2) + "px";
      bars.appendChild(p);
    };
    if (s.ptrI === s.ptrJ) addPtr(s.ptrI, "i,j", "ij");
    else { if (s.ptrI != null) addPtr(s.ptrI, "i", "i"); if (s.ptrJ != null) addPtr(s.ptrJ, "j", "j"); }
  }

  setLine(s.line);
  $("cmpCount").textContent = s.cmp;
  $("swapCount").textContent = s.swp;
  $("status").textContent = s.desc;
}

function parseData(str) {
  return str.split(/[,，\s]+/).map(x => parseInt(x, 10)).filter(x => !isNaN(x) && x >= 0);
}
function randomData() {
  const n = 8 + Math.floor(Math.random() * 5);   // 8~12 个
  return Array.from({ length: n }, () => 5 + Math.floor(Math.random() * 95));
}

function prepare() {
  const cfg = CFG[algo];
  $("subtitle").textContent = cfg.subtitle;
  $("meta").innerHTML = cfg.meta;
  $("note").textContent = cfg.note;
  renderCode(cfg.code);
  const input = parseData($("dataInput").value);
  arr = input.length >= 2 ? input.slice(0, 16) : (arr.length ? arr : randomData());
  steps = GEN[algo](arr);
  idx = 0;
  draw(0);
}
function stepOnce() {
  if (idx < steps.length - 1) { idx++; draw(idx); return true; }
  return false;
}
function play() {
  stop();
  const spd = parseInt($("speedInput").value, 10);
  timer = setInterval(() => { if (!stepOnce()) stop(); }, 960 - spd);
}
function stop() { if (timer) { clearInterval(timer); timer = null; } }

let mergeMode = "mergeTD";   // 归并的默认实现：自顶向下

// tabId 是主标签的 data-algo（bubble/…/quick/merge）
function applyAlgo(tabId) {
  stop();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.algo === tabId));
  if (tabId === "merge") {
    $("mergeSub").style.display = "flex";
    algo = mergeMode;   // 实际算法由子选项决定
    document.querySelectorAll(".subtab").forEach(s => s.classList.toggle("active", s.dataset.merge === mergeMode));
  } else {
    $("mergeSub").style.display = "none";
    algo = tabId;
  }
  prepare();
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => applyAlgo(t.dataset.algo));
document.querySelectorAll(".subtab").forEach(s => s.onclick = () => {
  mergeMode = s.dataset.merge;
  applyAlgo("merge");
});
$("playBtn").onclick = () => { if (idx >= steps.length - 1 || idx === 0) prepare(); play(); };
$("stepBtn").onclick = () => { stop(); stepOnce(); };
$("resetBtn").onclick = () => { stop(); prepare(); };
$("randBtn").onclick = () => { stop(); $("dataInput").value = ""; arr = randomData(); steps = GEN[algo](arr); idx = 0; draw(0); };

arr = randomData();
applyAlgo("bubble");
</script>

<script>
CppView.register({
  bubble: { title: "冒泡排序 (Bubble Sort) — C++", code:
`// 功能：冒泡排序。相邻元素两两比较，逆序则交换，每趟把最大值“冒”到末尾，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
using namespace std;

int main() {
    int n;
    cin >> n;
    int a[1005];
    for (int i = 0; i < n; i++) cin >> a[i];

    for (int i = 0; i < n; i++) {                 // 共 n 趟
        for (int j = 0; j < n - 1 - i; j++) {     // 每趟比较相邻元素
            if (a[j] > a[j + 1]) {                // 逆序则交换
                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;
            }
        }
        // 一趟结束后，末尾 a[n-1-i] 已就位
    }

    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
  selection: { title: "选择排序 (Selection Sort) — C++", code:
`// 功能：选择排序。每趟从未排序区间选出最小值，放到已排序区间末尾，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
using namespace std;

int main() {
    int n;
    cin >> n;
    int a[1005];
    for (int i = 0; i < n; i++) cin >> a[i];

    for (int i = 0; i < n; i++) {
        int min = i;                          // 假设当前最小是 a[i]
        for (int j = i + 1; j < n; j++)       // 在未排序部分找更小的
            if (a[j] < a[min]) min = j;        // 更新最小值下标
        if (min != i) {                       // 把最小值交换到位置 i
            int t = a[i]; a[i] = a[min]; a[min] = t;
        }
    }

    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
  insertion: { title: "插入排序 (Insertion Sort) — C++", code:
`// 功能：插入排序。把每个元素插入到前面已排序序列的正确位置，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
using namespace std;

int main() {
    int n;
    cin >> n;
    int a[1005];
    for (int i = 0; i < n; i++) cin >> a[i];

    for (int i = 1; i < n; i++) {             // a[0] 视为已排序
        int key = a[i];                       // 取出待插入值
        int j = i - 1;
        while (j >= 0 && a[j] > key) {         // 比 key 大的元素依次后移
            a[j + 1] = a[j];
            j--;
        }
        a[j + 1] = key;                        // 找到位置，插入 key
    }

    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
  quick: { title: "快速排序 (Quick Sort) — C++", code:
`// 功能：快速排序。取区间首元素为基准(pivot)，用对撞双指针分区后递归两侧，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
using namespace std;

int a[1005];

void quicksort(int lo, int hi) {
    if (lo >= hi) return;                      // 区间只有 0 或 1 个元素
    int pivot = a[lo];                         // 首元素为基准
    int i = lo, j = hi;
    while (i < j) {
        while (i < j && a[j] >= pivot) j--;    // 右→左找第一个 < 基准的
        while (i < j && a[i] <= pivot) i++;    // 左→右找第一个 > 基准的
        if (i < j) { int t = a[i]; a[i] = a[j]; a[j] = t; }  // 交换
    }
    int t = a[lo]; a[lo] = a[i]; a[i] = t;      // 基准归位到相遇点 i
    quicksort(lo, i - 1);                       // 递归左侧
    quicksort(i + 1, hi);                       // 递归右侧
}

int main() {
    int n;
    cin >> n;
    for (int i = 0; i < n; i++) cin >> a[i];
    quicksort(0, n - 1);
    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
  mergeTD: { title: "归并排序·自顶向下(递归) — C++", code:
`// 功能：归并排序（自顶向下·递归）。把区间对半拆到最小，再回溯时两两有序合并，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
using namespace std;

int a[1005], tmp[1005];   // tmp 为辅助数组

// 合并两个有序段 [lo,mid] 与 [mid+1,hi]
void merge(int lo, int mid, int hi) {
    int i = lo, j = mid + 1, k = lo;
    while (i <= mid && j <= hi)                // 每次取较小者放入辅助数组
        tmp[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];
    while (i <= mid) tmp[k++] = a[i++];        // 左段剩余
    while (j <= hi)  tmp[k++] = a[j++];        // 右段剩余
    for (int t = lo; t <= hi; t++) a[t] = tmp[t];  // 还原回原数组
}

void mergesort(int lo, int hi) {
    if (lo >= hi) return;
    int mid = (lo + hi) / 2;
    mergesort(lo, mid);                        // 递归左半
    mergesort(mid + 1, hi);                    // 递归右半
    merge(lo, mid, hi);                        // 合并两个有序段
}

int main() {
    int n;
    cin >> n;
    for (int i = 0; i < n; i++) cin >> a[i];
    mergesort(0, n - 1);
    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
  mergeBU: { title: "归并排序·自底向上(迭代) — C++", code:
`// 功能：归并排序（自底向上·迭代）。按子段长度 1,2,4,8… 逐层两两合并，无递归，升序排序。
// 输入：第一行 n（元素个数）；第二行 n 个整数。
// 输出：一行，排序后的 n 个整数（升序，空格分隔）。
#include <iostream>
#include <algorithm>
using namespace std;

int a[1005], tmp[1005];   // tmp 为辅助数组

// 合并两个有序段 [lo,mid] 与 [mid+1,hi]
void merge(int lo, int mid, int hi) {
    int i = lo, j = mid + 1, k = lo;
    while (i <= mid && j <= hi)
        tmp[k++] = (a[i] <= a[j]) ? a[i++] : a[j++];
    while (i <= mid) tmp[k++] = a[i++];
    while (j <= hi)  tmp[k++] = a[j++];
    for (int t = lo; t <= hi; t++) a[t] = tmp[t];
}

int main() {
    int n;
    cin >> n;
    for (int i = 0; i < n; i++) cin >> a[i];

    // 子段长度 width 每轮翻倍：1,2,4,8...
    for (int width = 1; width < n; width *= 2) {
        for (int lo = 0; lo < n; lo += 2 * width) {
            int mid = lo + width - 1;
            int hi = min(lo + 2 * width - 1, n - 1);
            if (mid < hi) merge(lo, mid, hi);  // 合并相邻两段
        }
    }

    for (int i = 0; i < n; i++) cout << a[i] << " \\n"[i == n - 1];
    return 0;
}` },
