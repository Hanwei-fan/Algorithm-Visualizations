<script>
const $ = id => document.getElementById(id);
let op = "add", view = "math", steps = [], idx = 0, timer = null, running = false;
function setStatus(t) { $("status").innerHTML = t; }
function norm(s) { s = (s || "").replace(/\D/g, "").replace(/^0+(?=\d)/, ""); return s || "0"; }
function digitAt(str, pos) { const L = str.length; return pos < L ? +str[L - 1 - pos] : 0; }
function cmpNum(a, b) { a = norm(a); b = norm(b); if (a.length !== b.length) return a.length - b.length; return a < b ? -1 : a > b ? 1 : 0; }

// 行构建：str 右对齐到 W 列（列 j 从左到右，place pos = W-1-j）
function rowDigits(tag, str, W, baseCls, posCls) {
  posCls = posCls || {}; const L = str.length, off = W - L, cells = [];
  for (let j = 0; j < W; j++) {
    const pos = W - 1 - j;
    if (j < off) cells.push(null);
    else { let cls = "cell " + (baseCls || ""); if (posCls[pos]) cls += " " + posCls[pos]; cells.push({ ch: str[j - off], cls }); }
  }
  return { tag, cells };
}
// 稀疏行：map = { pos: {ch, cls} }
function rowSparse(tag, W, map, baseCls) {
  const cells = [];
  for (let j = 0; j < W; j++) { const pos = W - 1 - j, m = map[pos]; cells.push(m ? { ch: m.ch, cls: "cell " + (baseCls || "") + (m.cls ? " " + m.cls : "") } : null); }
  return { tag, cells };
}
const LINE = { line: true }, SUBLINE = { sub: true };

// ======== 加法 ========
function genAddSteps(a, b) {
  a = norm(a); b = norm(b);
  const W = Math.max(a.length, b.length) + 1;
  const list = [], res = new Array(W).fill(null), carries = {};
  let carry = 0;
  const opRow = () => rowSparse("+", W, { [W - 1 - 0]: null }, "");   // 占位不用
  const build = (curPos, desc, doneDigit, done) => {
    const rows = [];
    // 进位行
    const cmap = {}; for (const p in carries) if (carries[p]) cmap[p] = { ch: "" + carries[p], cls: "carry" };
    rows.push(rowSparse("进位", W, cmap, "carry"));
    rows.push(rowDigits("a", a, W, "digit", curPos != null ? { [curPos]: "cur" } : {}));
    rows.push(rowDigits("b", "+ " + b, W, "digit", curPos != null ? { [curPos]: "cur" } : {}));
    rows.push(LINE);
    const posCls = {}; for (let p = 0; p < W; p++) if (res[p] != null) posCls[p] = (p === doneDigit ? "resnew" : "res");
    const rstr = res.map(d => d == null ? " " : d).join("").replace(/ /g, "");
    // 直接用稀疏结果行避免空格错位
    const rmap = {}; for (let p = 0; p < W; p++) if (res[p] != null) rmap[p] = { ch: "" + res[p], cls: p === doneDigit ? "resnew" : "res" };
    rows.push(rowSparse("和", W, rmap, "digit"));
    list.push({ rows, desc, done: !!done });
  };
  build(0, `从最低位（个位）开始：把 a、b 对齐，逐列相加，满 10 向前进位。`, null, false);
  for (let pos = 0; pos < W; pos++) {
    const da = digitAt(a, pos), db = digitAt(b, pos), cin = carry;
    const s = da + db + cin, d = s % 10; carry = Math.floor(s / 10);
    res[pos] = d; if (carry) carries[pos + 1] = carry;
    build(pos, `第 ${pos + 1} 列：${da} + ${db}${cin ? " + 进位 " + cin : ""} = <span class="hl">${s}</span> → 本位写 <span class="hl">${d}</span>${carry ? "，向前进位 <span class='hl'>" + carry + "</span>" : "，无进位"}。`, pos, false);
  }
  const resStr = norm(res.map(d => d == null ? 0 : d).reverse().join(""));
  build(null, `完成！各列相加并处理进位后，得 a + b = <span class="hl">${resStr}</span>。`, null, true);
  return { list, resStr };
}

// ======== 减法（a - b，保证 a≥b；外层负号处理） ========
function genSubSteps(a, b, neg) {
  a = norm(a); b = norm(b);
  const W = a.length;
  const list = [], res = new Array(W).fill(null), borrows = {};
  let borrow = 0;
  const build = (curPos, desc, doneDigit, done) => {
    const rows = [];
    const bmap = {}; for (const p in borrows) if (borrows[p]) bmap[p] = { ch: "−1", cls: "borrow" };
    rows.push(rowSparse("借位", W, bmap, "borrow"));
    rows.push(rowDigits("a", a, W, "digit", curPos != null ? { [curPos]: "cur" } : {}));
    rows.push(rowDigits("b", "- " + b, W, "digit", curPos != null ? { [curPos]: "cur" } : {}));
    rows.push(LINE);
    const rmap = {}; for (let p = 0; p < W; p++) if (res[p] != null) rmap[p] = { ch: "" + res[p], cls: p === doneDigit ? "resnew" : "res" };
    rows.push(rowSparse("差", W, rmap, "digit"));
    list.push({ rows, desc, done: !!done });
  };
  build(0, `${neg ? "因 a < b，先算 b − a，结果取负。" : ""}从个位起逐列相减，不够减就向前一位借 1（本位 +10）。`, null, false);
  for (let pos = 0; pos < W; pos++) {
    const da = digitAt(a, pos), db = digitAt(b, pos), bin = borrow;
    let d = da - db - bin; let bo = 0;
    if (d < 0) { d += 10; bo = 1; borrows[pos + 1] = 1; }
    res[pos] = d; borrow = bo;
    build(pos, `第 ${pos + 1} 列：${da}${bin ? " − 借位 1" : ""} − ${db} = <span class="hl">${da - bin - db}</span>${bo ? "，不够减，向前借 1 → 本位 " + (da - bin + 10) + " − " + db + " = <span class='hl'>" + d + "</span>" : "，本位写 <span class='hl'>" + d + "</span>"}。`, pos, false);
  }
  const resStr = (neg && norm(res.slice().reverse().join("")) !== "0" ? "−" : "") + norm(res.map(d => d == null ? 0 : d).reverse().join(""));
  build(null, `完成！a − b = <span class="hl">${resStr}</span>。`, null, true);
  return { list, resStr };
}

// ======== 乘法（竖式部分积） ========
function mulByDigit(a, d) {  // a(字符串) × 单个数字 d → 字符串
  if (d === 0) return "0";
  let carry = 0, out = [];
  for (let i = 0; i < a.length; i++) { const p = digitAt(a, i) * d + carry; out.push(p % 10); carry = Math.floor(p / 10); }
  while (carry) { out.push(carry % 10); carry = Math.floor(carry / 10); }
  return norm(out.reverse().join(""));
}
function genMulSteps(a, b) {
  a = norm(a); b = norm(b);
  const W = a.length + b.length;
  const list = [];
  // 部分积（shifted 字符串）
  const partials = [];   // {str, shift, bDigit, bPos}
  for (let pos = 0; pos < b.length; pos++) { const bd = digitAt(b, pos); partials.push({ raw: mulByDigit(a, bd), shift: pos, bd, pos }); }
  const shownPartials = [];
  const build = (rows, desc, done) => list.push({ rows, desc, done: !!done, wide: true });
  const headRows = (curBPos, resMap) => {
    const rows = [];
    rows.push(rowDigits("a", a, W, "digit", {}));
    rows.push(rowDigits("b", "× " + b, W, "digit", curBPos != null ? { [curBPos]: "cur" } : {}));
    rows.push(LINE);
    shownPartials.forEach((sp, i) => {
      const shifted = sp.raw === "0" ? "0" : sp.raw + "0".repeat(sp.shift);
      const pc = (i === shownPartials.length - 1 && sp.justNew) ? "resnew" : "res";
      rows.push(rowDigits("×" + sp.bd, shifted, W, "digit", {}, ));
      rows[rows.length - 1].cells.forEach(c => { if (c) c.cls = c.cls.replace("digit", pc === "resnew" ? "resnew" : "res"); });
    });
    if (resMap) { rows.push(SUBLINE); rows.push(rowSparse("积", W, resMap, "digit")); }
    return rows;
  };
  build(headRows(null, null), `竖式乘法：用 b 的每一位（从个位起）去乘整个 a，得到一行"部分积"（第 k 位要左移 k 位），最后把所有部分积错位相加。`, false);
  // 阶段①：逐位生成部分积
  for (let pos = 0; pos < b.length; pos++) {
    shownPartials.forEach(sp => sp.justNew = false);
    shownPartials.push(Object.assign({}, partials[pos], { justNew: true }));
    const sp = partials[pos];
    const shiftDesc = sp.shift ? `，再左移 ${sp.shift} 位（末尾补 ${sp.shift} 个 0）` : "";
    build(headRows(pos, null), `b 的第 ${pos + 1} 位是 <span class="hl">${sp.bd}</span>：${sp.bd} × ${a} = <span class="hl">${sp.raw}</span>${shiftDesc}。`, false);
  }
  // 阶段②：错位相加（直接算总和，逐列展示）
  // 计算最终积
  let prod = new Array(W).fill(0);
  partials.forEach(sp => { const s = sp.raw; for (let i = 0; i < s.length; i++) prod[i + sp.shift] += digitAt(s, i); });
  let carry = 0; const resArr = [];
  const resMap = {};
  shownPartials.forEach(sp => sp.justNew = false);
  build(headRows(null, {}), `所有部分积已就位，下面把它们<b>错位相加</b>（同加法，逐列求和处理进位）。`, false);
  for (let p = 0; p < W; p++) {
    const colSum = prod[p] + carry; const d = colSum % 10; carry = Math.floor(colSum / 10);
    resArr[p] = d; resMap[p] = { ch: "" + d, cls: "resnew" };
    // 之前列固定为 res
    const fixed = {}; for (const k in resMap) fixed[k] = { ch: resMap[k].ch, cls: +k === p ? "resnew" : "res" };
    build(headRows(null, fixed), `第 ${p + 1} 列部分积求和 = ${prod[p]}${carry || (colSum >= 10) ? "（+进位后 " + colSum + "）" : ""} → 本位 <span class="hl">${d}</span>${carry ? "，进位 " + carry : ""}。`, false);
  }
  const resStr = norm(resArr.map((d, i) => d).reverse().join(""));
  const finalMap = {}; for (let p = 0; p < resArr.length; p++) finalMap[p] = { ch: "" + resArr[p], cls: "res" };
  build(headRows(null, finalMap), `完成！a × b = <span class="hl">${resStr}</span>。`, true);
  return { list, resStr };
}

// ======== 除法（长除法 · 试商） ========
function genDivSteps(a, b) {
  a = norm(a); b = norm(b);
  const W = a.length;
  const list = [];
  const qres = new Array(W).fill(null);   // 商，按被除数列对齐
  let cur = 0, firstSig = false;
  const build = (curCol, desc, curNum, q, rem, done) => {
    const rows = [];
    // 商行（对齐被除数）
    const qmap = {}; for (let p = 0; p < W; p++) if (qres[p] != null) qmap[p] = { ch: "" + qres[p], cls: (p === (W - 1 - curCol) && q != null) ? "resnew" : "quot" };
    rows.push(rowSparse("商", W, qmap, "digit"));
    rows.push(LINE);
    rows.push(rowDigits("被除数", a, W, "digit", curCol != null ? { [W - 1 - curCol]: "cur" } : {}));
    list.push({ rows, desc, done: !!done, divInfo: { curNum, q, rem } });
  };
  build(null, `长除法：从被除数最高位开始，逐位"落下"组成当前数；每步试商——当前数里最多能放几个 b（0~9），商写在上方，减去 商×b 得余数，再落下一位。除数 b = <span class="hl">${b}</span>。`, null, null, 0, false);
  for (let col = 0; col < W; col++) {
    const bringDown = +a[col];
    const before = cur;
    cur = cur * 10 + bringDown;
    const q = Math.floor(cur / (+b || 1)), rem = cur - q * (+b);
    // 商对齐：第 col 个被除数位 → 商位置 W-1-col。
    // 前导 0 不写（长除法惯例留空）；但最后一列即使为 0 也要写，保证商本身为 0 时能显示。
    if (q > 0 || firstSig || col === W - 1) { qres[W - 1 - col] = q; firstSig = true; }
    build(col, `落下第 ${col + 1} 位 "${bringDown}"，当前数 = <span class="hl">${cur}</span>。试商：${cur} ÷ ${b} = <span class="hl">${q}</span> …… 余 <span class="hl">${rem}</span>（因为 ${q}×${b} = ${q * (+b)}，${cur} − ${q * (+b)} = ${rem}）。`, cur, q, rem, false);
    cur = rem;
  }
  // 去前导0得商
  let qstr = ""; for (let p = W - 1; p >= 0; p--) qstr += (qres[p] == null ? 0 : qres[p]);
  qstr = norm(qstr);
  const resStr = qstr, remStr = "" + cur;
  build(null, `完成！商 = <span class="hl">${qstr}</span>，余数 = <span class="hl">${cur}</span>。即 ${a} = ${qstr} × ${b} + ${cur}。`, cur, null, cur, true);
  return { list, resStr, remStr };
}

// ============================================================
// 编程视角：数字逆序存进数组（index 0 = 个位/最低位），
// 左→右 = index 0,1,2,…；加减标注 carry / borrow 的值。
// ============================================================
function toArr(s) { s = norm(s); const a = []; for (let i = s.length - 1; i >= 0; i--) a.push(+s[i]); return a; } // a[0]=个位
// index 标注行（列 i = 数组下标 i，从左到右）
function rowIdx(W) { const cells = []; for (let i = 0; i < W; i++) cells.push({ ch: "" + i, cls: "cell small" }); return { tag: "下标", cells }; }
// 逆序数组行：arr[i] 显示在第 i 列（左=低位）
function rowArrL(tag, arr, W, curIdx, baseCls, posCls) {
  posCls = posCls || {}; const cells = [];
  for (let i = 0; i < W; i++) {
    if (i >= arr.length || arr[i] == null) { cells.push(null); continue; }
    let cls = "cell " + (baseCls || ""); if (i === curIdx) cls += " cur"; if (posCls[i]) cls += " " + posCls[i];
    cells.push({ ch: "" + arr[i], cls });
  }
  return { tag, cells };
}

// ======== 编程·加法 ========
function genAddProg(a, b) {
  const A = toArr(a), B = toArr(b), W = Math.max(A.length, B.length) + 1;
  const list = [], res = new Array(W).fill(null), carryRow = new Array(W).fill(null);
  let carry = 0;
  const build = (i, desc, doneIdx, carryVal) => {
    const rows = [rowIdx(W)];
    rows.push(rowArrL("a[]", A, W, i, "digit"));
    rows.push(rowArrL("b[]", B, W, i, "digit"));
    rows.push(rowArrL("carry", carryRow, W, i, "carry"));
    rows.push(LINE);
    const posCls = {}; for (let k = 0; k < W; k++) if (res[k] != null) posCls[k] = (k === doneIdx ? "resnew" : "res");
    rows.push(rowArrL("res[]", res, W, -1, "digit", posCls));
    list.push({ rows, desc, done: doneIdx === -2, carryVal });
  };
  build(-1, `编程实现：把 a、b <b>逆序</b>存进数组，<code>a[0]</code> 是个位。从下标 0 开始逐位相加，<code>carry</code> 记进位。`, null, 0);
  for (let i = 0; i < W; i++) {
    const ai = A[i] || 0, bi = B[i] || 0, cin = carry;
    const s = ai + bi + cin; res[i] = s % 10; carry = Math.floor(s / 10);
    carryRow[i] = cin;                 // 本位用到的进位（进入值）
    if (i + 1 < W) carryRow[i + 1] = carry;   // 产生的进位（给下一位）
    build(i, `i=${i}：<code>s = a[${i}] + b[${i}] + carry = ${ai} + ${bi} + ${cin} = <span class="hl">${s}</span></code>；<code>res[${i}] = s%10 = <span class="hl">${res[i]}</span></code>，<code>carry = s/10 = <span class="hl">${carry}</span></code>。`, i, s >= 10 || carry ? carry : 0);
    carryVal = carry;
  }
  const resStr = norm(res.map(d => d == null ? 0 : d).slice().reverse().join(""));
  build(-1, `循环结束，carry=${carry}。把 res[] <b>逆序</b>读出（去前导 0）即得 a+b = <span class="hl">${resStr}</span>。`, -2, carry);
  list[list.length - 1].done = true;
  return { list, resStr };
}

// ======== 编程·减法 ========
function genSubProg(a, b, neg) {
  const A = toArr(a), B = toArr(b), W = A.length;
  const list = [], res = new Array(W).fill(null), borrowRow = new Array(W).fill(null);
  let borrow = 0;
  const build = (i, desc, doneIdx, done) => {
    const rows = [rowIdx(W)];
    rows.push(rowArrL("a[]", A, W, i, "digit"));
    rows.push(rowArrL("b[]", B, W, i, "digit"));
    rows.push(rowArrL("borrow", borrowRow, W, i, "borrow"));
    rows.push(LINE);
    const posCls = {}; for (let k = 0; k < W; k++) if (res[k] != null) posCls[k] = (k === doneIdx ? "resnew" : "res");
    rows.push(rowArrL("res[]", res, W, -1, "digit", posCls));
    list.push({ rows, desc, done: !!done });
  };
  build(-1, `编程实现：${neg ? "因 a&lt;b，先算 b−a 再加负号。" : ""}逆序存数组，<code>a[0]</code> 个位。逐位相减，<code>borrow</code> 记借位。`, null, false);
  for (let i = 0; i < W; i++) {
    const ai = A[i] || 0, bi = B[i] || 0, bin = borrow;
    let d = ai - bi - bin; borrowRow[i] = bin;
    if (d < 0) { d += 10; borrow = 1; if (i + 1 < W) borrowRow[i + 1] = 1; } else borrow = 0;
    res[i] = d;
    build(i, `i=${i}：<code>d = a[${i}] − b[${i}] − borrow = ${ai} − ${bi} − ${bin} = <span class="hl">${ai - bi - bin}</span></code>${ai - bi - bin < 0 ? `，&lt;0 → <code>d+=10=<span class="hl">${d}</span>，borrow=1</code>` : `，<code>res[${i}]=<span class="hl">${d}</span>，borrow=0</code>`}。`, i, false);
  }
  const resStr = (neg && norm(res.slice().reverse().join("")) !== "0" ? "−" : "") + norm(res.map(d => d == null ? 0 : d).slice().reverse().join(""));
  build(-1, `循环结束。res[] 逆序读出（去前导 0）得 a−b = <span class="hl">${resStr}</span>。`, -1, true);
  return { list, resStr };
}

// ======== 编程·乘法（res[i+j] 累加，再统一进位） ========
function genMulProg(a, b) {
  const A = toArr(a), B = toArr(b), n = A.length, m = B.length, W = n + m;
  const list = [], res = new Array(W).fill(0);
  const rowsHead = (ci, cj, hotK, hotCls) => {
    const rows = [rowIdx(W)];
    rows.push(rowArrL("a[]", A, W, ci, "digit"));
    rows.push(rowArrL("b[]", B, W, cj, "digit"));
    rows.push(LINE);
    const posCls = {}; for (let k = 0; k < W; k++) if (hotK === k) posCls[k] = hotCls || "resnew";
    // res 可能 >9（未进位），用字符串显示
    const resRow = { tag: "res[]", cells: res.map((v, k) => ({ ch: "" + v, cls: "cell digit" + (posCls[k] ? " " + posCls[k] : "") })) };
    rows.push(resRow);
    return rows;
  };
  list.push({ rows: rowsHead(-1, -1, -1), desc: `编程实现：a、b 逆序存数组。第①阶段：双重循环把 <code>a[i]·b[j]</code> 累加到 <code>res[i+j]</code>（此时 res 各位可能 &gt;9，先不进位）。`, done: false });
  for (let j = 0; j < m; j++) {
    for (let i = 0; i < n; i++) {
      const add = A[i] * B[j]; res[i + j] += add;
      list.push({ rows: rowsHead(i, j, i + j), desc: `i=${i}, j=${j}：<code>res[${i + j}] += a[${i}]·b[${j}] = ${A[i]}·${B[j]} = <span class="hl">${add}</span></code> → res[${i + j}] = <span class="hl">${res[i + j]}</span>。`, done: false });
    }
  }
  // 第②阶段：统一进位
  let carry = 0;
  list.push({ rows: rowsHead(-1, -1, -1), desc: `第②阶段：从低位起<b>统一进位</b> —— <code>res[k+1] += res[k]/10; res[k] %= 10</code>。`, done: false, carryVal: 0 });
  for (let k = 0; k < W; k++) {
    const before = res[k] + carry; res[k] = before % 10; carry = Math.floor(before / 10);
    const rows = [rowIdx(W)];
    rows.push(rowArrL("a[]", A, W, -1, "digit"));
    rows.push(rowArrL("b[]", B, W, -1, "digit"));
    rows.push(LINE);
    const resRow = { tag: "res[]", cells: res.map((v, kk) => ({ ch: "" + v, cls: "cell digit" + (kk === k ? " resnew" : (kk < k ? " res" : "")) })) };
    rows.push(resRow);
    list.push({ rows, desc: `k=${k}：<code>res[${k}] = ${before}%10 = <span class="hl">${res[k]}</span></code>，进位 <code>${before}/10 = <span class="hl">${carry}</span></code> 加到 res[${k + 1 < W ? k + 1 : "—"}]。`, done: false, carryVal: carry });
  }
  const resStr = norm(res.map(d => d).slice().reverse().join(""));
  const rows = [rowIdx(W), rowArrL("a[]", A, W, -1, "digit"), rowArrL("b[]", B, W, -1, "digit"), LINE,
    { tag: "res[]", cells: res.map(v => ({ ch: "" + v, cls: "cell digit res" })) }];
  list.push({ rows, desc: `进位完成。res[] 逆序读出（去前导 0）得 a×b = <span class="hl">${resStr}</span>。`, done: true });
  return { list, resStr };
}

// ======== 编程·除法（数组高位→低位，cur 累进） ========
function genDivProg(a, b) {
  a = norm(a); const A = toArr(a), n = A.length, B = +b;
  const list = [], q = new Array(n).fill(null);
  let cur = 0;
  const build = (i, desc, qi, curVal, remVal, done) => {
    const rows = [rowIdx(n)];
    rows.push(rowArrL("a[]", A, n, i, "digit"));
    const posCls = {}; for (let k = 0; k < n; k++) if (q[k] != null) posCls[k] = (k === qi ? "resnew" : "quot");
    rows.push(rowArrL("q[]", q, n, -1, "digit", posCls));
    list.push({ rows, desc, done: !!done, divInfo: { curNum: curVal, q: qi != null && qi >= 0 ? q[qi] : null, rem: remVal } });
  };
  build(-1, `编程实现：a 逆序存数组（a[0] 个位）。除法从<b>高位下标</b>往低走：<code>cur = cur·10 + a[i]; q[i] = cur/b; cur %= b</code>。`, null, 0, 0, false);
  for (let i = n - 1; i >= 0; i--) {
    cur = cur * 10 + A[i];
    const qi = Math.floor(cur / B), rem = cur - qi * B;
    q[i] = qi;
    build(i, `i=${i}：<code>cur = cur·10 + a[${i}] = <span class="hl">${cur}</span></code>；<code>q[${i}] = cur/b = <span class="hl">${qi}</span></code>，<code>cur = cur%b = <span class="hl">${rem}</span></code>。`, i, cur, rem, false);
    cur = rem;
  }
  let qstr = ""; for (let k = n - 1; k >= 0; k--) qstr += (q[k] == null ? 0 : q[k]); qstr = norm(qstr);
  build(-1, `循环结束。q[] 逆序读出（去前导 0）得商 = <span class="hl">${qstr}</span>，余数 cur = <span class="hl">${cur}</span>。`, null, cur, cur, true);
  return { list, resStr: qstr, remStr: "" + cur };
}

// ======== 渲染 ========
let gridW = 1;
function draw(k) {
  const s = steps[k];
  const rows = s.rows;
  // 计算列数
  let W = 1; rows.forEach(r => { if (r.cells) W = Math.max(W, r.cells.length); });
  gridW = W;
  const g = $("grid");
  g.style.gridTemplateColumns = `56px repeat(${W}, 38px)`;
  let html = "";
  rows.forEach(r => {
    if (r.line) { html += `<div class="gline"></div>`; return; }
    if (r.sub) { html += `<div class="gsub"></div>`; return; }
    html += `<div class="rowtag">${r.tag || ""}</div>`;
    r.cells.forEach(c => { html += c ? `<div class="${c.cls}">${c.ch}</div>` : `<div class="cell"></div>`; });
  });
  g.innerHTML = html;
  setStatus(s.desc);
  // 额外变量信息
  if (s.divInfo && s.divInfo.q != null) {
    $("stats").innerHTML = `cur = <b>${s.divInfo.curNum}</b>　试商 q = <b>${s.divInfo.q}</b>　余 cur = <b>${s.divInfo.rem}</b>`;
  } else if (s.divInfo) {
    $("stats").innerHTML = `余数 cur = <b>${s.divInfo.rem}</b>`;
  } else if (s.carryVal != null) {
    $("stats").innerHTML = `变量 carry = <b>${s.carryVal}</b>`;
  } else {
    $("stats").innerHTML = "";
  }
  // 结果
  if (s.done) $("resultBig").innerHTML = resultLine();
  else $("resultBig").innerHTML = "";
}
let lastResult = { resStr: "", remStr: "" };
function resultLine() {
  const A = $("aInput").value, B = $("bInput").value;
  if (op === "add") return `${norm(A)} + ${norm(B)} = <b>${lastResult.resStr}</b>`;
  if (op === "sub") return `${norm(A)} − ${norm(B)} = <b>${lastResult.resStr}</b>`;
  if (op === "mul") return `${norm(A)} × ${norm(B)} = <b>${lastResult.resStr}</b>`;
  return `${norm(A)} ÷ ${norm(B)} = <b>${lastResult.resStr}</b> 余 <b>${lastResult.remStr}</b>`;
}

// ======== 引擎 ========
function stepOnce() { if (!running) return; if (idx < steps.length - 1) { idx++; draw(idx); } if (idx >= steps.length - 1) endRun(); }
function endRun() { running = false; stopTimer(); $("stepBtn").disabled = true; $("playBtn").disabled = true; }
function playAll() { stopTimer(); const spd = 1420 - parseInt($("speedInput").value, 10); timer = setInterval(() => { if (idx < steps.length - 1) { idx++; draw(idx); } else endRun(); }, spd); }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

const FORMULA = {
  add: `carry = 0<br>for i = 0 … 最高位:<br>&nbsp;&nbsp;s = a[i] + b[i] + carry<br>&nbsp;&nbsp;res[i] = s % 10; carry = s / 10`,
  sub: `borrow = 0<br>for i = 0 … 最高位:<br>&nbsp;&nbsp;d = a[i] − b[i] − borrow<br>&nbsp;&nbsp;if d &lt; 0: d += 10; borrow = 1<br>&nbsp;&nbsp;else: borrow = 0<br>&nbsp;&nbsp;res[i] = d　<span style="color:var(--muted)">// a&lt;b 则换算加负号</span>`,
  mul: `for j = 0 … len(b):　<span style="color:var(--muted)">// 部分积</span><br>&nbsp;&nbsp;for i = 0 … len(a):<br>&nbsp;&nbsp;&nbsp;&nbsp;res[i+j] += a[i]·b[j]<br>统一处理进位：res[k+1] += res[k]/10; res[k] %= 10`,
  div: `cur = 0<br>for i = 高位 … 低位:<br>&nbsp;&nbsp;cur = cur·10 + a[i]<br>&nbsp;&nbsp;q[i] = cur / b　<span style="color:var(--muted)">// 试商 0~9</span><br>&nbsp;&nbsp;cur = cur % b　<span style="color:var(--muted)">// 余数带下一位</span>`,
};
const LABELS = {
  add: ["被加数 a", "加数 b"], sub: ["被减数 a", "减数 b"],
  mul: ["被乘数 a", "乘数 b"], div: ["被除数 a", "除数 b"],
};

function prepare() {
  stopTimer();
  let A = norm($("aInput").value), B = norm($("bInput").value);
  $("aInput").value = A; $("bInput").value = B;
  let out;
  const prog = view === "prog";
  if (op === "add") out = prog ? genAddProg(A, B) : genAddSteps(A, B);
  else if (op === "sub") {
    const c = cmpNum(A, B), neg = c < 0;
    const [x, y] = neg ? [B, A] : [A, B];
    out = prog ? genSubProg(x, y, neg) : genSubSteps(x, y, neg);
  } else if (op === "mul") out = prog ? genMulProg(A, B) : genMulSteps(A, B);
  else { if (B === "0") { setStatus("⚠ 除数不能为 0。"); $("grid").innerHTML = ""; return; } out = prog ? genDivProg(A, B) : genDivSteps(A, B); }
  steps = out.list;
  lastResult = { resStr: out.resStr, remStr: out.remStr || "" };
  idx = 0; running = true;
  $("stepBtn").disabled = false; $("playBtn").disabled = false;
  $("formula").innerHTML = FORMULA[op];
  draw(0);
}

  const exProg = { add: ["857", "964"], sub: ["1000", "1"], mul: ["23", "45"], div: ["1000", "7"] };
  const ex = (view === "prog" ? exProg : exMath)[o];
  $("aInput").value = ex[0]; $("bInput").value = ex[1];
  prepare();
}

CppView.register({
  bignum_add: { title: "高精度加法 — C++", code:
`// 功能：两个大整数(字符串)相加，逐位模拟竖式，处理进位。
#include <iostream>
#include <string>
#include <algorithm>
using namespace std;

string add(string a, string b) {
    string res;
    int i = a.size() - 1, j = b.size() - 1, carry = 0;
    while (i >= 0 || j >= 0 || carry) {
        int s = carry;
        if (i >= 0) s += a[i--] - '0';
        if (j >= 0) s += b[j--] - '0';
        res += char(s % 10 + '0');   // 本位
        carry = s / 10;              // 进位
    }
    reverse(res.begin(), res.end());
    return res;
}
int main() { string a, b; cin >> a >> b; cout << add(a, b) << endl; }`

  bignum_sub: { title: "高精度减法 — C++", code:
`// 功能：两个大整数相减，逐位借位。若 a < b，先算 b-a 再加负号。
#include <iostream>
#include <string>
#include <algorithm>
using namespace std;

bool less_(const string& a, const string& b) {          // a < b ?
    if (a.size() != b.size()) return a.size() < b.size();
    return a < b;
}
string sub(string a, string b) {                        // 需保证 a >= b
    string res;
    int i = a.size() - 1, j = b.size() - 1, borrow = 0;
    while (i >= 0) {
        int d = (a[i--] - '0') - borrow - (j >= 0 ? b[j--] - '0' : 0);
        if (d < 0) { d += 10; borrow = 1; } else borrow = 0;
        res += char(d + '0');
    }
    while (res.size() > 1 && res.back() == '0') res.pop_back();   // 去前导0
    reverse(res.begin(), res.end());
    return res;
}
int main() {
    string a, b; cin >> a >> b;
    if (less_(a, b)) cout << "-" << sub(b, a) << endl;   // a<b 加负号
    else cout << sub(a, b) << endl;
}`

  bignum_mul: { title: "高精度乘法 — C++", code:
`// 功能：两个大整数相乘。res[i+j] 累加 a[i]*b[j]，最后统一处理进位。
#include <iostream>
#include <string>
#include <vector>
#include <algorithm>
using namespace std;

string mul(string a, string b) {
    int n = a.size(), m = b.size();
    vector<int> res(n + m, 0);
    for (int i = 0; i < n; i++)
        for (int j = 0; j < m; j++)
            res[i + j] += (a[n-1-i] - '0') * (b[m-1-j] - '0');  // 错位累加
    int carry = 0;
    for (int k = 0; k < n + m; k++) {                            // 统一进位
        res[k] += carry; carry = res[k] / 10; res[k] %= 10;
    }
    string s;
    for (int k = n + m - 1; k >= 0; k--) s += char(res[k] + '0');
    int p = 0; while (p + 1 < (int)s.size() && s[p] == '0') p++; // 去前导0
    return s.substr(p);
}
int main() { string a, b; cin >> a >> b; cout << mul(a, b) << endl; }`

`// 功能：大整数 a 除以大整数 b，长除法试商，输出商与余数。
// 逐位落下被除数，维护当前余数段 cur；每位试商 0~9（此处 b 也是大数，
// 用高精度比较/减法；若 b 在 long long 内可直接用整数试商更简单）。
#include <iostream>
#include <string>
#include <algorithm>
using namespace std;

// 简化版：b 在 long long 范围内时的长除法
int main() {
    string a; long long b; cin >> a >> b;
    string q; long long cur = 0;
    for (char c : a) {
        cur = cur * 10 + (c - '0');   // 落下一位
        q += char(cur / b + '0');     // 试商
        cur %= b;                     // 余数带入下一位
    }
    int p = 0; while (p + 1 < (int)q.size() && q[p] == '0') p++;  // 去前导0
    cout << q.substr(p) << " ... " << cur << endl;                // 商 ... 余数
}`
