<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树演示 // CYBER</title>
<style>
  :root {
    --bg: #07060f;
    --panel: rgba(18, 15, 38, 0.72);
    --border: #2a2350;
    --text: #e6e1ff;
    --muted: #7d76a8;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --yellow: #ffd400;
    --green: #00ff9c;
    --grid: rgba(0, 240, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    line-height: 1.55;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.14), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(0,240,255,0.14), transparent 45%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  header h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px rgba(0,240,255,.5), 3px 0 var(--magenta);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .back {
    display: inline-block; margin: 14px 30px 0; padding: 6px 16px;
    border: 1px solid var(--border); border-radius: 4px; text-decoration: none;
    color: var(--cyan); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .back:hover { border-color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 30px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; background: rgba(5,4,15,0.8); color: var(--text);
    font-family: "SF Mono", Menlo, monospace; width: 90px;
  }
  .field input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  .speed { display: flex; flex-direction: column; gap: 5px; }
  .speed label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .speed input { width: 120px; accent-color: var(--magenta); }
  .btn {
    padding: 9px 16px; border: 1px solid var(--magenta); border-radius: 4px;
    background: rgba(255,43,214,0.12); color: var(--magenta); font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--magenta); color: #05060f; box-shadow: 0 0 16px rgba(255,43,214,.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.cy { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,.08); }
  .btn.cy:hover:not(:disabled) { background: var(--cyan); color: #05060f; box-shadow: 0 0 16px rgba(0,240,255,.6); }
  .btn.ghost { border-color: var(--border); color: var(--muted); background: rgba(255,255,255,0.02); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(0,240,255,.05), 0 8px 40px rgba(0,0,0,.5);
  }
  svg { width: 100%; height: auto; display: block; }
  .edge { stroke: #4a4478; stroke-width: 2; transition: all .2s; }
  .bnode circle { fill: rgba(0,240,255,0.06); stroke: var(--border); stroke-width: 2; transition: all .2s; }
  .bnode text { fill: var(--text); font-family: "SF Mono", Menlo, monospace; font-size: 15px; font-weight: 700; }
  .bnode.path circle { fill: rgba(255,212,0,0.18); stroke: var(--yellow); filter: drop-shadow(0 0 8px rgba(255,212,0,.5)); }
  .bnode.cur circle { fill: var(--magenta); stroke: var(--magenta); filter: drop-shadow(0 0 12px rgba(255,43,214,.8)); }
  .bnode.cur text { fill: #fff; }
  .bnode.found circle { fill: rgba(0,255,156,0.25); stroke: var(--green); filter: drop-shadow(0 0 12px rgba(0,255,156,.8)); }
  .bnode.succ circle { fill: rgba(160,107,255,0.25); stroke: #a06bff; filter: drop-shadow(0 0 10px rgba(160,107,255,.7)); }
  .bnode.newn circle { fill: var(--green); stroke: var(--green); filter: drop-shadow(0 0 14px rgba(0,255,156,.8)); }
  .bnode.newn text { fill: #05201a; }
  /* 右栏 */
  .plabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; }
  .seqlabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 8px; }
  .sequence { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
  .chip {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--green); border-radius: 6px; background: rgba(0,255,156,0.12);
    color: var(--green); font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 14px;
    box-shadow: 0 0 8px rgba(0,255,156,.3);
  }
  .stats { display: flex; gap: 24px; font-size: 14px; align-items: baseline; margin-bottom: 6px; }
  .stats b { font-size: 20px; color: var(--yellow); font-family: "SF Mono", Menlo, monospace; text-shadow: 0 0 12px rgba(255,212,0,.6); }
  .status { margin-top: 10px; font-size: 15px; min-height: 22px; color: var(--text); font-family: "SF Mono", Menlo, monospace; }
  .tlegend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .tlegend span { display: inline-flex; align-items: center; gap: 6px; }
  .tlegend .dot { width: 12px; height: 12px; border-radius: 50%; }
  .note { padding: 6px 30px 30px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .note code { color: var(--cyan); }
</style>
</head>
<body>
<header>
  <h1>二叉搜索树 (BST) 演示</h1>
  <p>左子树都比根小、右子树都比根大。插入/查找从根出发按大小走；中序遍历得升序序列。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="controls">
  <div class="field">
    <label for="valInput">数值</label>
    <input id="valInput" type="number" placeholder="值">
  </div>
  <button class="btn cy" id="insertBtn">插入</button>
  <button class="btn cy" id="findBtn">查找</button>
  <button class="btn" id="deleteBtn">删除</button>
  <button class="btn ghost" id="inorderBtn">中序遍历</button>
  <button class="btn ghost" id="randBtn">随机生成</button>
  <button class="btn ghost" id="clearBtn">清空</button>
  <div class="speed">
    <label for="speedInput">速度</label>
    <input id="speedInput" type="range" min="150" max="1200" value="600" step="50">
  </div>
</div>

<main>
  <section class="card">
    <svg id="tree" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tlegend">
      <span><i class="dot" style="background:#ffd400"></i>已走过的比较路径</span>
      <span><i class="dot" style="background:#ff2bd6"></i>当前比较节点</span>
      <span><i class="dot" style="background:#00ff9c"></i>命中/新插入</span>
      <span><i class="dot" style="background:#a06bff"></i>后继(删除用)</span>
    </div>
  </section>
  <section class="card">
    <div class="stats">
      节点数：<b id="sizeCount">0</b>
      <span>树高：<b id="heightCount">0</b></span>
    </div>
    <div class="seqlabel">中序遍历（升序）</div>
    <div class="sequence" id="sequence"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note">
  删除有三种情况：<code>叶子</code>直接删；<code>只有一个孩子</code>用孩子顶替；<code>有两个孩子</code>用右子树最小值（中序后继）替换后，再删那个后继。
</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const speed = () => 1300 - parseInt($("speedInput").value, 10);

// 树结点
let root = null;   // {val, left, right, x, y, id}
let nextId = 1;
let busy = false;

function makeNode(val) { return { val, left: null, right: null, x: 0, y: 0, id: nextId++ }; }

// ---- 布局：中序遍历分配 x（列号），深度分配 y ----
function layout() {
  const W = 680, H = 420;
  let order = 0;
  const nodes = [];
  (function assign(nd, depth) {
    if (!nd) return;
    assign(nd.left, depth + 1);
    nd._col = order++;
    nd._depth = depth;
    nodes.push(nd);
    assign(nd.right, depth + 1);
  })(root, 0);
  const n = nodes.length;
  let maxDepth = 0; nodes.forEach(nd => maxDepth = Math.max(maxDepth, nd._depth));
  nodes.forEach(nd => {
    nd.x = n <= 1 ? W / 2 : 40 + (W - 80) * nd._col / (n - 1);
    nd.y = 40 + (maxDepth === 0 ? 0 : (H - 90) * nd._depth / Math.max(maxDepth, 3));
  });
  return { nodes, maxDepth };
}

function treeSize(nd) { return nd ? 1 + treeSize(nd.left) + treeSize(nd.right) : 0; }
function treeHeight(nd) { return nd ? 1 + Math.max(treeHeight(nd.left), treeHeight(nd.right)) : 0; }

// ---- 渲染 ----
// marks: id -> class
function render(marks = {}) {
  const svg = $("tree");
  const { nodes } = layout();
  let edges = "", circles = "";
  nodes.forEach(nd => {
    ["left", "right"].forEach(side => {
      const c = nd[side];
      if (c) edges += `<line class="edge" x1="${nd.x}" y1="${nd.y}" x2="${c.x}" y2="${c.y}"/>`;
    });
  });
  nodes.forEach(nd => {
    const cls = "bnode" + (marks[nd.id] ? " " + marks[nd.id] : "");
    circles += `<g class="${cls}"><circle cx="${nd.x}" cy="${nd.y}" r="20"/><text x="${nd.x}" y="${nd.y+5}" text-anchor="middle">${nd.val}</text></g>`;
  });
  svg.innerHTML = edges + circles;
  $("sizeCount").textContent = treeSize(root);
  $("heightCount").textContent = treeHeight(root);
}

function setStatus(t) { $("status").textContent = t; }
function lock(v) { busy = v; document.querySelectorAll(".btn").forEach(b => b.disabled = v); }

// ---- 插入（带路径动画）----
async function insert(val, animate = true) {
  if (root === null) {
    root = makeNode(val);
    if (animate) { render({ [root.id]: "newn" }); setStatus(`插入 ${val} 作为根节点。`); await sleep(speed()); render(); }
    return;
  }
  let cur = root, path = [];
  while (true) {
    path.push(cur.id);
    if (animate) { const mk = {}; path.forEach(id => mk[id] = "path"); mk[cur.id] = "cur"; render(mk); setStatus(`比较 ${val} 与 ${cur.val}：${val < cur.val ? "更小，向左" : val > cur.val ? "更大，向右" : "已存在"}`); await sleep(speed()); }
    if (val === cur.val) { setStatus(`${val} 已存在，BST 不插入重复值。`); if (animate) { await sleep(speed()); render(); } return; }
    if (val < cur.val) {
      if (cur.left === null) { cur.left = makeNode(val); break; }
      cur = cur.left;
    } else {
      if (cur.right === null) { cur.right = makeNode(val); break; }
      cur = cur.right;
    }
  }
  if (animate) {
    const newNode = (val < cur.val ? cur.left : cur.right);
    const mk = {}; path.forEach(id => mk[id] = "path"); mk[newNode.id] = "newn";
    render(mk); setStatus(`插入 ${val} 作为 ${cur.val} 的${val < cur.val ? "左" : "右"}孩子。`);
    await sleep(speed()); render();
  }
}

// ---- 查找 ----
async function find(val) {
  let cur = root, path = [];
  while (cur) {
    path.push(cur.id);
    const mk = {}; path.forEach(id => mk[id] = "path"); mk[cur.id] = "cur";
    render(mk); setStatus(`比较 ${val} 与 ${cur.val}` + (val === cur.val ? " → 命中！" : val < cur.val ? "：更小，向左找" : "：更大，向右找"));
    await sleep(speed());
    if (val === cur.val) { mk[cur.id] = "found"; render(mk); setStatus(`✓ 找到 ${val}。`); return; }
    cur = val < cur.val ? cur.left : cur.right;
  }
  render(); setStatus(`✗ 未找到 ${val}。`);
}

// ---- 删除（三种情况）----
async function remove(val) {
  // 先定位
  let cur = root, parent = null, path = [];
  while (cur && cur.val !== val) {
    path.push(cur.id);
    const mk = {}; path.forEach(id => mk[id] = "path"); mk[cur.id] = "cur";
    render(mk); setStatus(`查找待删节点 ${val}：比较 ${cur.val}`); await sleep(speed());
    parent = cur; cur = val < cur.val ? cur.left : cur.right;
  }
  if (!cur) { render(); setStatus(`✗ ${val} 不存在，无法删除。`); return; }
  const mk = {}; path.forEach(id => mk[id] = "path"); mk[cur.id] = "cur";
  render(mk); setStatus(`找到待删节点 ${val}。`); await sleep(speed());

  // 情况 3：两个孩子 → 找右子树最小值（中序后继）
  if (cur.left && cur.right) {
    let succParent = cur, succ = cur.right;
    while (succ.left) { succParent = succ; succ = succ.left; }
    const mk2 = { [cur.id]: "cur", [succ.id]: "succ" };
    render(mk2); setStatus(`节点 ${val} 有两个孩子：用右子树最小值（中序后继）${succ.val} 替换它。`); await sleep(speed() * 1.2);
    cur.val = succ.val;   // 值替换
    render({ [cur.id]: "found", [succ.id]: "succ" }); setStatus(`把 ${succ.val} 复制到待删位置，接下来删除原后继 ${succ.val}。`); await sleep(speed() * 1.2);
    // 删除 succ（succ 至多有右孩子）
    if (succParent.left === succ) succParent.left = succ.right; else succParent.right = succ.right;
    render(); setStatus(`删除完成。`); return;
  }
  // 情况 1/2：至多一个孩子
  const child = cur.left || cur.right;
  if (!parent) { root = child; }
  else if (parent.left === cur) parent.left = child;
  else parent.right = child;
  render();
  setStatus(child ? `节点 ${val} 只有一个孩子，用孩子 ${child.val} 顶替。` : `节点 ${val} 是叶子，直接删除。`);
}

// ---- 中序遍历 ----
async function inorder() {
  const seq = [];
  const order = [];
  (function go(nd) { if (!nd) return; go(nd.left); order.push(nd); go(nd.right); })(root);
  $("sequence").innerHTML = "";
  for (const nd of order) {
    render({ [nd.id]: "cur" });
    seq.push(nd.val);
    $("sequence").innerHTML = seq.map(v => `<div class="chip">${v}</div>`).join("");
    setStatus(`中序访问 ${nd.val}`);
    await sleep(speed() * 0.8);
  }
  render();
  setStatus(`中序遍历完成，得到升序序列：${seq.join(" ")}`);
}

// ---- 控制 ----
function readVal() { const v = parseInt($("valInput").value, 10); if (isNaN(v)) { setStatus("请输入一个整数值。"); return null; } return v; }
async function guard(fn) { if (busy) return; lock(true); try { await fn(); } finally { lock(false); } }

$("insertBtn").onclick = () => { const v = readVal(); if (v === null) return; guard(() => insert(v)); $("valInput").value = ""; };
$("findBtn").onclick = () => { const v = readVal(); if (v === null) return; guard(() => find(v)); };
$("deleteBtn").onclick = () => { const v = readVal(); if (v === null) return; guard(() => remove(v)); $("valInput").value = ""; };
$("inorderBtn").onclick = () => guard(inorder);
$("clearBtn").onclick = () => { if (busy) return; root = null; $("sequence").innerHTML = ""; render(); setStatus("已清空。"); };
$("randBtn").onclick = () => guard(async () => {
  root = null; $("sequence").innerHTML = "";
  const n = 6 + Math.floor(Math.random() * 4);
  const vals = new Set();
  while (vals.size < n) vals.add(1 + Math.floor(Math.random() * 99));
  for (const v of vals) await insert(v, false);
  render(); setStatus(`随机生成了含 ${vals.size} 个节点的 BST。`);
});
$("valInput").addEventListener("keydown", e => { if (e.key === "Enter") $("insertBtn").click(); });

render();
setStatus("空树。输入数值后点“插入”，或点“随机生成”。");
</script>
</body>
</html>
