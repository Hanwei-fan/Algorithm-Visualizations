<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树演示 // CYBER</title>
<style>
  :root {
    --bg: #07060f;
    --panel: rgba(18, 15, 38, 0.72);
    --border: #2a2350;
    --text: #e6e1ff;
    --muted: #7d76a8;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --yellow: #ffd400;
    --green: #00ff9c;
    --grid: rgba(0, 240, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    line-height: 1.55;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.14), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(0,240,255,0.14), transparent 45%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  header h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px rgba(0,240,255,.5), 3px 0 var(--magenta);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .back {
    display: inline-block; margin: 14px 30px 0; padding: 6px 16px;
    border: 1px solid var(--border); border-radius: 4px; text-decoration: none;
    color: var(--cyan); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .back:hover { border-color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 30px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; background: rgba(5,4,15,0.8); color: var(--text);
    font-family: "SF Mono", Menlo, monospace; width: 90px;
  }
  .field input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  .speed { display: flex; flex-direction: column; gap: 5px; }
  .speed label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .speed input { width: 120px; accent-color: var(--magenta); }
  .btn {
    padding: 9px 16px; border: 1px solid var(--magenta); border-radius: 4px;
    background: rgba(255,43,214,0.12); color: var(--magenta); font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--magenta); color: #05060f; box-shadow: 0 0 16px rgba(255,43,214,.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.cy { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,.08); }
  .btn.cy:hover:not(:disabled) { background: var(--cyan); color: #05060f; box-shadow: 0 0 16px rgba(0,240,255,.6); }
  .btn.ghost { border-color: var(--border); color: var(--muted); background: rgba(255,255,255,0.02); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 0 1px rgba(0,240,255,.05), 0 8px 40px rgba(0,0,0,.5);
  }
  svg { width: 100%; height: auto; display: block; }
  .edge { stroke: #4a4478; stroke-width: 2; transition: all .2s; }
  .edge.down { stroke: var(--magenta); stroke-width: 3; filter: drop-shadow(0 0 6px rgba(255,43,214,.7)); }
  .edge.up { stroke: #ff7a45; stroke-width: 3; filter: drop-shadow(0 0 6px rgba(255,122,69,.7)); }
  .bnode circle { fill: rgba(0,240,255,0.06); stroke: var(--border); stroke-width: 2; transition: all .2s; }
  .bnode text { fill: var(--text); font-family: "SF Mono", Menlo, monospace; font-size: 15px; font-weight: 700; }
  .bnode.path circle { fill: rgba(255,212,0,0.18); stroke: var(--yellow); filter: drop-shadow(0 0 8px rgba(255,212,0,.5)); }
  .bnode.cur circle { fill: var(--magenta); stroke: var(--magenta); filter: drop-shadow(0 0 12px rgba(255,43,214,.8)); }
  .bnode.cur text { fill: #fff; }
  .bnode.found circle { fill: rgba(0,255,156,0.25); stroke: var(--green); filter: drop-shadow(0 0 12px rgba(0,255,156,.8)); }
  .bnode.succ circle { fill: rgba(160,107,255,0.25); stroke: #a06bff; filter: drop-shadow(0 0 10px rgba(160,107,255,.7)); }
  .bnode.newn circle { fill: var(--green); stroke: var(--green); filter: drop-shadow(0 0 14px rgba(0,255,156,.8)); }
  .bnode.newn text { fill: #05201a; }
  /* 遍历三态：与树遍历一致 —— 进入(active/品红)、访问(visit/黄)、回溯(back/橙)、已访问(done/绿) */
  .bnode.active circle { fill: var(--magenta); stroke: var(--magenta); filter: drop-shadow(0 0 12px rgba(255,43,214,.8)); }
  .bnode.active text { fill: #fff; }
  .bnode.visit circle { fill: var(--yellow); stroke: var(--yellow); filter: drop-shadow(0 0 10px rgba(255,212,0,.8)); }
  .bnode.visit text { fill: #120e00; }
  .bnode.back circle { fill: rgba(255,122,69,0.22); stroke: #ff7a45; filter: drop-shadow(0 0 12px rgba(255,122,69,.8)); }
  .bnode.back text { fill: #fff; }
  .bnode.done circle { fill: rgba(0,255,156,0.18); stroke: var(--green); }
  /* 右栏 */
  .plabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; }
  .seqlabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 8px; }
  .sequence { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; }
  .chip {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--green); border-radius: 6px; background: rgba(0,255,156,0.12);
    color: var(--green); font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 14px;
    box-shadow: 0 0 8px rgba(0,255,156,.3);
  }
  .stats { display: flex; gap: 24px; font-size: 14px; align-items: baseline; margin-bottom: 6px; }
  .stats b { font-size: 20px; color: var(--yellow); font-family: "SF Mono", Menlo, monospace; text-shadow: 0 0 12px rgba(255,212,0,.6); }
  .status { margin-top: 10px; font-size: 15px; min-height: 22px; color: var(--text); font-family: "SF Mono", Menlo, monospace; }
  .tlegend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .tlegend span { display: inline-flex; align-items: center; gap: 6px; }
  .tlegend .dot { width: 12px; height: 12px; border-radius: 50%; }
  .note { padding: 6px 30px 30px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .note code { color: var(--cyan); }
</style>
</head>
<body>
<header>
  <h1>二叉搜索树 (BST) 演示</h1>
  <p>左子树都比根小、右子树都比根大。插入/查找从根出发按大小走；中序遍历得升序序列。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="controls">
  <div class="field">
    <label for="valInput">数值</label>
    <input id="valInput" type="number" placeholder="值">
  </div>
  <button class="btn cy" id="insertBtn">插入</button>
  <button class="btn cy" id="findBtn">查找</button>
  <button class="btn" id="deleteBtn">删除</button>
  <button class="btn ghost" id="inorderBtn">中序遍历</button>
  <button class="btn ghost" id="randBtn">随机生成</button>
  <button class="btn ghost" id="clearBtn">清空</button>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<div class="controls" style="padding-top:0">
  <button class="btn" id="playBtn" disabled>自动播放</button>
  <button class="btn secondary" id="stepBtn" disabled>单步 ▶</button>
  <div class="speed">
    <label for="speedInput">速度</label>
    <input id="speedInput" type="range" min="150" max="1200" value="600" step="50">
  </div>
</div>

<main>
  <section class="card">
    <svg id="tree" viewBox="0 0 680 420" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tlegend">
      <span><i class="dot" style="background:#ff2bd6"></i>当前比较/进入</span>
      <span><i class="dot" style="background:#ffd400"></i>访问节点</span>
      <span><i class="dot" style="background:#ff7a45"></i>回溯返回</span>
      <span><i class="dot" style="background:#00ff9c"></i>命中/新插入/已访问</span>
      <span><i class="dot" style="background:#a06bff"></i>后继(删除用)</span>
    </div>
  </section>
  <section class="card">
    <div class="stats">
      节点数：<b id="sizeCount">0</b>
      <span>树高：<b id="heightCount">0</b></span>
    </div>
    <div class="seqlabel">中序遍历（升序）</div>
    <div class="sequence" id="sequence"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note">
  删除有三种情况：<code>叶子</code>直接删；<code>只有一个孩子</code>用孩子顶替；<code>有两个孩子</code>用右子树最小值（中序后继）替换后，再删那个后继。
</div>

<script>
const $ = id => document.getElementById(id);

// 树结点
let root = null;   // {val, left, right, x, y, id}
let nextId = 1;

// 单步引擎：steps[i] = { marks, desc, mutate, seq }
//   marks: id->class；mutate(): 执行本步对树的实际改动（在绘制前调用）；seq: 中序序列快照
let steps = [], idx = 0, timer = null, running = false;

function makeNode(val) { return { val, left: null, right: null, x: 0, y: 0, id: nextId++ }; }

// ---- 布局：中序遍历分配 x（列号），深度分配 y ----
function layout() {
  const W = 680, H = 420;
  let order = 0;
  const nodes = [];
  (function assign(nd, depth) {
    if (!nd) return;
    assign(nd.left, depth + 1);
    nd._col = order++;
    nd._depth = depth;
    nodes.push(nd);
    assign(nd.right, depth + 1);
  })(root, 0);
  const n = nodes.length;
  let maxDepth = 0; nodes.forEach(nd => maxDepth = Math.max(maxDepth, nd._depth));
  nodes.forEach(nd => {
    nd.x = n <= 1 ? W / 2 : 40 + (W - 80) * nd._col / (n - 1);
    nd.y = 40 + (maxDepth === 0 ? 0 : (H - 90) * nd._depth / Math.max(maxDepth, 3));
  });
  return { nodes, maxDepth };
}

function treeSize(nd) { return nd ? 1 + treeSize(nd.left) + treeSize(nd.right) : 0; }
function treeHeight(nd) { return nd ? 1 + Math.max(treeHeight(nd.left), treeHeight(nd.right)) : 0; }

// ---- 渲染 ----
// marks: 节点 id -> class；edgeMarks: 子节点 id -> "down"/"up"（边高亮）
function render(marks = {}, edgeMarks = {}) {
  const svg = $("tree");
  const { nodes } = layout();
  let edges = "", circles = "";
  nodes.forEach(nd => {
    ["left", "right"].forEach(side => {
      const c = nd[side];
      if (c) { const ec = edgeMarks[c.id] ? " " + edgeMarks[c.id] : ""; edges += `<line class="edge${ec}" x1="${nd.x}" y1="${nd.y}" x2="${c.x}" y2="${c.y}"/>`; }
    });
  });
  nodes.forEach(nd => {
    const cls = "bnode" + (marks[nd.id] ? " " + marks[nd.id] : "");
    circles += `<g class="${cls}"><circle cx="${nd.x}" cy="${nd.y}" r="20"/><text x="${nd.x}" y="${nd.y+5}" text-anchor="middle">${nd.val}</text></g>`;
  });
  svg.innerHTML = edges + circles;
  $("sizeCount").textContent = treeSize(root);
  $("heightCount").textContent = treeHeight(root);
}

function setStatus(t) { $("status").textContent = t; }

// ======== 单步引擎 ========
// 每个操作构建 steps[]，然后交给引擎播放（单步 / 自动）
function loadSteps(list, auto = false) {
  steps = list; idx = 0; running = true;
  lockOps(true);           // 演算期间禁用操作按钮
  applyStep(0);
  if (auto) {
    // 自动模式：不启用单步/播放按钮，直接连续播放到底
    $("stepBtn").disabled = true; $("playBtn").disabled = true;
    if (steps.length <= 1) { endRun(); return; }
    playAll();
  } else {
    // 单步模式：启用单步与自动播放按钮
    $("stepBtn").disabled = false; $("playBtn").disabled = false;
    if (steps.length <= 1) endRun();
  }
}
// 应用第 idx 步：执行其 mutate（改树），再按 marks 渲染
function applyStep(i) {
  const s = steps[i];
  if (s.mutate) s.mutate();
  render(s.marks || {}, s.edgeMarks || {});
  if (s.seq !== undefined) $("sequence").innerHTML = s.seq.map(v => `<div class="chip">${v}</div>`).join("");
  setStatus(s.desc);
}
function stepForward() {
  if (!running) return false;
  if (idx < steps.length - 1) { idx++; applyStep(idx); }
  if (idx >= steps.length - 1) endRun();
  return true;
}
function endRun() {
  running = false; stopTimer();
  $("stepBtn").disabled = true; $("playBtn").disabled = true;
  lockOps(false);
}
function playAll() {
  if (!running) return;
  stopTimer();
  const spd = 1300 - parseInt($("speedInput").value, 10);
  timer = setInterval(() => {
    if (idx < steps.length - 1) { idx++; applyStep(idx); }
    else { endRun(); }
  }, spd);
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function lockOps(v) { ["insertBtn", "findBtn", "deleteBtn", "inorderBtn", "randBtn", "clearBtn"].forEach(id => $(id).disabled = v); }

// ======== 各操作：构建 steps ========

// 插入：从根逐层比较下探，到空位创建新节点
function buildInsert(val) {
  const list = [];
  if (root === null) {
    list.push({ marksSnap: {}, desc: `空树，插入 ${val} 作为根节点。`,
      mutate: () => { root = makeNode(val); }, markNew: () => root && root.id });
    return buildFromSnaps(list);
  }
  let cur = root, path = [];
  while (true) {
    const node = cur, curPath = [...path, cur.id];
    list.push({
      marksSnap: { path: [...curPath.slice(0, -1)], cur: cur.id },
      desc: `比较 ${val} 与 ${cur.val}：` + (val === cur.val ? "相等，已存在" : val < cur.val ? "更小 → 往左子树" : "更大 → 往右子树"),
    });
    if (val === cur.val) {
      list.push({ marksSnap: { path: curPath, found: cur.id }, desc: `${val} 已存在，BST 不插入重复值。` });
      return buildFromSnaps(list);
    }
    path.push(cur.id);
    if (val < cur.val) {
      if (cur.left === null) {
        list.push({ marksSnap: { path: [...path], newFrom: node.id, side: "left", val }, desc: `${node.val} 的左孩子为空，把 ${val} 插入这里。`,
          mutate: () => { node.left = makeNode(val); }, markNew: () => node.left && node.left.id });
        return buildFromSnaps(list);
      }
      cur = cur.left;
    } else {
      if (cur.right === null) {
        list.push({ marksSnap: { path: [...path], newFrom: node.id, side: "right", val }, desc: `${node.val} 的右孩子为空，把 ${val} 插入这里。`,
          mutate: () => { node.right = makeNode(val); }, markNew: () => node.right && node.right.id });
        return buildFromSnaps(list);
      }
      cur = cur.right;
    }
  }
}

// 查找
function buildFind(val) {
  const list = [];
  let cur = root, path = [];
  while (cur) {
    const node = cur, curPath = [...path, cur.id];
    const hit = val === cur.val;
    list.push({
      marksSnap: hit ? { path: path, found: cur.id } : { path: path, cur: cur.id },
      desc: `比较 ${val} 与 ${cur.val}` + (hit ? " → ✓ 命中！" : val < cur.val ? "：更小，向左找" : "：更大，向右找"),
    });
    if (hit) return buildFromSnaps(list);
    path.push(cur.id);
    cur = val < cur.val ? cur.left : cur.right;
  }
  list.push({ marksSnap: { path }, desc: `✗ 未找到 ${val}（走到空位）。` });
  return buildFromSnaps(list);
}

// 删除（含三种情况）
function buildDelete(val) {
  const list = [];
  let cur = root, parent = null, path = [];
  while (cur && cur.val !== val) {
    const node = cur;
    list.push({ marksSnap: { path: [...path], cur: cur.id }, desc: `查找待删节点 ${val}：比较 ${cur.val}，往${val < cur.val ? "左" : "右"}。` });
    path.push(cur.id); parent = cur; cur = val < cur.val ? cur.left : cur.right;
  }
  if (!cur) { list.push({ marksSnap: { path }, desc: `✗ ${val} 不存在，无法删除。` }); return buildFromSnaps(list); }
  const target = cur, tParent = parent, tPath = [...path];
  list.push({ marksSnap: { path: tPath, cur: target.id }, desc: `找到待删节点 ${val}。` });

  if (target.left && target.right) {
    // 情况3：找右子树最小值（中序后继）
    let sp = target, s = target.right, spath = [target.right.id];
    list.push({ marksSnap: { path: tPath, cur: target.id, succ: target.right.id }, desc: `节点 ${val} 有两个孩子。到右子树找最小值（中序后继）。` });
    while (s.left) { sp = s; s = s.left; spath.push(s.id); list.push({ marksSnap: { path: tPath, cur: target.id, succ: s.id }, desc: `一路向左找最小：当前 ${s.val}。` }); }
    const succ = s, succParent = sp;
    list.push({ marksSnap: { path: tPath, found: target.id, succ: succ.id }, desc: `后继是 ${succ.val}，把它的值复制到待删位置。`,
      mutate: () => { target.val = succ.val; } });
    list.push({ marksSnap: { path: tPath, succ: succ.id }, desc: `删除原后继节点 ${succ.val}（它至多有右孩子）。`,
      mutate: () => { if (succParent.left === succ) succParent.left = succ.right; else succParent.right = succ.right; } });
    list.push({ marksSnap: {}, desc: `删除完成。` });
    return buildFromSnaps(list);
  }
  // 情况1/2：至多一个孩子
  const child = target.left || target.right;
  list.push({
    marksSnap: { cur: target.id }, desc: child ? `节点 ${val} 只有一个孩子，用孩子 ${child.val} 顶替。` : `节点 ${val} 是叶子，直接删除。`,
    mutate: () => { if (!tParent) root = child; else if (tParent.left === target) tParent.left = child; else tParent.right = child; },
  });
  list.push({ marksSnap: {}, desc: `删除完成。` });
  return buildFromSnaps(list);
}

// 中序遍历：与「二叉树遍历」演示一致 —— 进入(enter)→访问(visit)→回溯(leave) 三态，
// 下探边品红、回溯边橙色，已访问节点保持绿色，右侧同步追加访问序列。
function buildInorder() {
  if (root === null) return [{ marks: {}, desc: "空树，无可遍历节点。" }];
  // 父节点映射，用于高亮“进入/回溯”对应的边（边按子节点 id 标识）
  const parent = {};
  (function mp(nd) { if (!nd) return; if (nd.left) { parent[nd.left.id] = nd; mp(nd.left); } if (nd.right) { parent[nd.right.id] = nd; mp(nd.right); } })(root);

  // 先生成 enter/visit/leave 事件序列
  const ev = [];
  (function go(nd) {
    if (!nd) return;
    ev.push({ kind: "enter", nd });
    go(nd.left);
    ev.push({ kind: "visit", nd });
    go(nd.right);
    ev.push({ kind: "leave", nd });
  })(root);

  // 逐事件构建步骤：已 visit 过的节点标 done，当前节点按 kind 着色
  const list = [];
  const visited = [];      // 已访问节点 id
  const seq = [];          // 访问值序列
  ev.forEach(e => {
    const marks = {};
    visited.forEach(id => marks[id] = "done");
    const edgeMarks = {};
    const p = parent[e.nd.id];
    if (e.kind === "enter") {
      marks[e.nd.id] = "active";
      if (p) edgeMarks[e.nd.id] = "down";
      list.push({ marks, edgeMarks, seq: [...seq], desc: p ? `从 ${p.val} 递归进入节点 ${e.nd.val}` : `进入根节点 ${e.nd.val}` });
    } else if (e.kind === "visit") {
      marks[e.nd.id] = "visit";
      seq.push(e.nd.val);
      list.push({ marks, seq: [...seq], desc: `访问节点 ${e.nd.val}（左子树已处理完）` });
      visited.push(e.nd.id);
    } else {  // leave
      marks[e.nd.id] = "back";
      if (p) edgeMarks[e.nd.id] = "up";
      list.push({ marks, seq: [...seq], desc: p ? `节点 ${e.nd.val} 处理完毕，回溯到 ${p.val}` : `根节点 ${e.nd.val} 处理完毕，遍历结束` });
    }
  });
  // 收尾：全部标为已访问
  const finalMarks = {};
  visited.forEach(id => finalMarks[id] = "done");
  list.push({ marks: finalMarks, seq: [...seq], desc: `中序遍历完成，升序序列：${seq.join(" ")}` });
  return list;
}

// 把 marksSnap（{path:[ids], cur, found, succ, ...}）转成 render 需要的 id->class
function buildFromSnaps(list) {
  return list.map(s => {
    if (s.marks) return s;
    const snap = s.marksSnap || {};
    const marks = {};
    (snap.path || []).forEach(id => marks[id] = "path");
    if (snap.cur != null) marks[snap.cur] = "cur";
    if (snap.found != null) marks[snap.found] = "found";
    if (snap.succ != null) marks[snap.succ] = "succ";
    const out = { marks, desc: s.desc };
    if (s.mutate) {
      // 新插入节点在 mutate 后才存在，用 markNew 延迟取 id
      out.mutate = () => { s.mutate(); if (s.markNew) { const nid = s.markNew(); if (nid != null) marks[nid] = "newn"; } };
    }
    return out;
  });
}
// ======== 交互 ========
function readVal() { const v = parseInt($("valInput").value, 10); if (isNaN(v)) { setStatus("请输入一个整数值。"); return null; } return v; }
function opGuard() { return running ? false : true; }   // 演算进行中不接受新操作

$("insertBtn").onclick = () => { if (!opGuard()) return; const v = readVal(); if (v === null) return; loadSteps(buildInsert(v), true); $("valInput").value = ""; };
$("findBtn").onclick = () => { if (!opGuard()) return; const v = readVal(); if (v === null) return; if (root === null) { setStatus("空树，无可查找节点。"); return; } loadSteps(buildFind(v)); };
$("deleteBtn").onclick = () => { if (!opGuard()) return; const v = readVal(); if (v === null) return; if (root === null) { setStatus("空树，无可删除节点。"); return; } loadSteps(buildDelete(v)); $("valInput").value = ""; };
$("inorderBtn").onclick = () => { if (!opGuard()) return; loadSteps(buildInorder()); };
$("clearBtn").onclick = () => { if (running) return; root = null; $("sequence").innerHTML = ""; render(); setStatus("已清空。"); };
$("randBtn").onclick = () => {
  if (running) return;
  root = null; $("sequence").innerHTML = "";
  const n = 6 + Math.floor(Math.random() * 4);
  const vals = new Set();
  while (vals.size < n) vals.add(1 + Math.floor(Math.random() * 99));
  vals.forEach(v => insertSilently(v));
  render(); setStatus(`随机生成了含 ${vals.size} 个节点的 BST。可对它做插入/查找/删除。`);
};
$("stepBtn").onclick = () => { stopTimer(); stepForward(); };
$("playBtn").onclick = () => playAll();
$("valInput").addEventListener("keydown", e => { if (e.key === "Enter") $("insertBtn").click(); });

// 无动画插入（随机生成用）
function insertSilently(val) {
  if (root === null) { root = makeNode(val); return; }
  let cur = root;
  while (true) {
    if (val === cur.val) return;
    if (val < cur.val) { if (!cur.left) { cur.left = makeNode(val); return; } cur = cur.left; }
    else { if (!cur.right) { cur.right = makeNode(val); return; } cur = cur.right; }
  }
}

render();
setStatus("空树。输入数值后点“插入”，或点“随机生成”。用「单步 ▶」逐步、或「自动播放」连续演示。");
</script>

<script>
CppView.register({
  bst: { title: "二叉搜索树 (BST)：插入 / 查找 / 删除 / 中序遍历 — C++", code:
`// 功能：二叉搜索树（BST）的完整实现，支持插入、查找、删除、中序遍历。
//   BST 性质：任意节点左子树的值都比它小、右子树的值都比它大；中序遍历即得升序序列。
// 输入：第一行整数 m（操作条数）；接下来 m 行，每行一个操作：
//       I x  -> 插入值 x（重复值忽略）
//       F x  -> 查找值 x，输出 found / not found
//       D x  -> 删除值 x
//       P    -> 中序遍历，按升序输出当前所有值
// 输出：F、P 操作各输出一行对应结果。
#include <iostream>
using namespace std;

struct Node {
    int val;
    Node *left, *right;
    Node(int v) : val(v), left(nullptr), right(nullptr) {}
};

// 插入：小往左、大往右，走到空位处新建节点；重复值不插入
Node* insert(Node* root, int x) {
    if (root == nullptr) return new Node(x);   // 找到空位，建新节点
    if (x < root->val) root->left = insert(root->left, x);
    else if (x > root->val) root->right = insert(root->right, x);
    // x == root->val：已存在，忽略
    return root;
}

// 查找：从根出发，按大小关系一路向左/向右
bool find(Node* root, int x) {
    while (root != nullptr) {
        if (x == root->val) return true;       // 命中
        root = (x < root->val) ? root->left : root->right;
    }
    return false;                              // 走到空位仍未找到
}

// 删除：分三种情况处理
Node* removeNode(Node* root, int x) {
    if (root == nullptr) return nullptr;       // 没找到，树不变
    if (x < root->val) root->left = removeNode(root->left, x);
    else if (x > root->val) root->right = removeNode(root->right, x);
    else {
        // 找到待删节点 root
        if (root->left == nullptr) {           // 情况1/2：无左孩子，用右孩子顶替（右孩子可能为空=叶子）
            Node* r = root->right;
            delete root;
            return r;
        }
        if (root->right == nullptr) {          // 情况2：只有左孩子，用左孩子顶替
            Node* l = root->left;
            delete root;
            return l;
        }
        // 情况3：有两个孩子。找右子树最小值（中序后继）替换当前值，再删掉那个后继
        Node* succ = root->right;
        while (succ->left != nullptr) succ = succ->left;
        root->val = succ->val;                 // 用后继值覆盖
        root->right = removeNode(root->right, succ->val);   // 删掉右子树里的后继
    }
    return root;
}

// 中序遍历：左 -> 根 -> 右，输出升序序列
void inorder(Node* root) {
    if (root == nullptr) return;
    inorder(root->left);
    cout << root->val << " ";
    inorder(root->right);
}

int main() {
    int m;
    cin >> m;
    Node* root = nullptr;
    while (m--) {
        char op;
        cin >> op;
        if (op == 'I') { int x; cin >> x; root = insert(root, x); }
        else if (op == 'F') { int x; cin >> x; cout << (find(root, x) ? "found" : "not found") << endl; }
        else if (op == 'D') { int x; cin >> x; root = removeNode(root, x); }
        else if (op == 'P') { inorder(root); cout << endl; }
    }
    return 0;
}` },
});
document.getElementById("cppBtn").onclick = () => CppView.open("bst");
</script>
