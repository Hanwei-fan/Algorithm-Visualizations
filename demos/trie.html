  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }

  .card {

  /* 单词表 */

<body>
<header>
  <h1>字典树 Trie</h1>
  <p>字典树（前缀树）：把多个单词按<b>字符逐层</b>存进一棵树，<b>公共前缀共享同一条路径</b>。插入、查找、前缀统计都是 O(单词长度)。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="controls">
  <div class="field">
    <label for="wordInput">单词（小写字母）</label>
    <input id="wordInput" type="text" placeholder="如 cat" value="cat">
  </div>
  <button class="btn cy" id="insertBtn">插入</button>
  <button class="btn gn" id="searchBtn">查找整词</button>
  <button class="btn" id="prefixBtn">前缀统计</button>
  <button class="btn ghost" id="clearBtn">清空</button>
  <button class="btn ghost" id="demoBtn">示例集</button>
  <div class="speed"><label for="speedInput">速度</label><input id="speedInput" type="range" min="80" max="900" value="480" step="40"></div>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<main>
  <section class="card">
    <div class="rowlabel">Trie 树（紫=根，绿圈=单词结尾 ●，黄=当前访问）</div>
    <svg id="trie" viewBox="0 0 720 360" preserveAspectRatio="xMidYMin meet"></svg>
    <div class="legend">
      <span><i class="dot" style="background:#a06bff"></i>根节点</span>
      <span><i class="dot" style="background:#00ff9c"></i>单词结尾</span>
      <span><i class="dot" style="background:#ffd400"></i>当前访问</span>
    </div>
  </section>
  <section class="card">
    <div class="plabel">算法说明</div>
    <div class="formula" id="formula"></div>
    <div class="plabel">已插入的单词</div>
    <div class="wordlist" id="wordlist"></div>
    <div class="stats" style="margin-top:12px">节点数：<b id="nodeCount">1</b>　单词数：<b id="wordCount">0</b></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note" id="note">Trie 每个节点代表“从根到此的字符串前缀”，每条边标一个字符。插入单词时沿路径走，缺哪个字符就<code>新建子节点</code>，走到末尾把该节点标记为<code>单词结尾</code>。查找同理沿路径走，看能否走到且结尾有标记。<b>公共前缀天然共享</b>，所以能高效做前缀查询、自动补全、字典序遍历等。</div>

<script src="../assets/cppview.js"></script>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ======== Trie 数据结构 ========
let nodeSeq = 0;
function newNode() { return { id: nodeSeq++, ch: "", children: {}, isEnd: false, _x: 0, _y: 0 }; }
let root = newNode();
let words = [];
let busy = false;

function setStatus(t) { $("status").innerHTML = t; }
function speed() { return 980 - parseInt($("speedInput").value, 10); }

// ======== 布局：按叶子中序分配 x，深度分配 y ========
function layout() {
  let leafX = 0;
  let maxDepth = 0;
  (function assign(u, depth) {
    maxDepth = Math.max(maxDepth, depth);
    const kids = Object.keys(u.children).sort();
    if (kids.length === 0) { u._leafx = leafX++; }
    else {
      kids.forEach(k => assign(u.children[k], depth + 1));
      const xs = kids.map(k => u.children[k]._leafx);
      u._leafx = (Math.min(...xs) + Math.max(...xs)) / 2;
    }
    u._depth = depth;
  })(root, 0);
  return { nLeaf: leafX, maxDepth };
}

// ======== 渲染 Trie ========
// marks: { [nodeId]: "cur"|"hit" }, pathEdges: Set("parentId>childId")
function render(marks = {}, pathEdges = new Set()) {
  const svg = $("trie");
  const { nLeaf, maxDepth } = layout();
  const W = 720, padX = 34, padY = 34;
  const usableW = W - 2 * padX;
  const dx = nLeaf > 1 ? usableW / (nLeaf - 1) : 0;
  const dy = Math.min(72, (330 - padY) / Math.max(maxDepth, 1));
  const H = padY * 2 + maxDepth * dy + 20;
  svg.setAttribute("viewBox", `0 0 ${W} ${Math.max(H, 200)}`);
  const X = u => nLeaf <= 1 ? W / 2 : padX + u._leafx * dx;
  const Y = u => padY + u._depth * dy;
  let edges = "", nodes = "";
  (function walk(u) {
    const kids = Object.keys(u.children).sort();
    kids.forEach(k => {
      const c = u.children[k];
      const x1 = X(u), y1 = Y(u), x2 = X(c), y2 = Y(c);
      const isPath = pathEdges.has(u.id + ">" + c.id);
      edges += `<line class="edge${isPath ? " path" : ""}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
      edges += `<text class="elabel" x="${(x1 + x2) / 2 + (x2 >= x1 ? 8 : -8)}" y="${(y1 + y2) / 2 + 4}">${k}</text>`;
      walk(c);
    });
    let cls = "tnode";
    if (u === root) cls += " root";
    else if (u.isEnd) cls += " word";
    if (marks[u.id]) cls += " " + marks[u.id];
    const x = X(u), y = Y(u);
    nodes += `<g class="${cls}"><circle cx="${x}" cy="${y}" r="16"/>`;
    if (u === root) nodes += `<text class="ch" x="${x}" y="${y + 5}">◆</text>`;
    else nodes += `<text class="ch" x="${x}" y="${y + 5}">${u.ch}</text>`;
    if (u.isEnd) nodes += `<text class="end" x="${x}" y="${y - 22}">●词尾</text>`;
    nodes += `</g>`;
  })(root);
  svg.innerHTML = edges + nodes;
  $("nodeCount").textContent = nodeSeq;   // 近似：分配过的节点数（含 root）
  countNodes();
  $("wordCount").textContent = words.length;
  renderWordList();
}
function countNodes() {
  let c = 0;
  (function w(u) { c++; Object.values(u.children).forEach(w); })(root);
  $("nodeCount").textContent = c;
}
function renderWordList(hot) {
  $("wordlist").innerHTML = words.length
    ? words.map(w => `<span class="wchip${w === hot ? " hot" : ""}">${w}</span>`).join("")
    : '<span style="color:var(--muted);font-family:monospace">（空）</span>';
}
function lock(v) { busy = v; document.querySelectorAll(".btn").forEach(b => b.disabled = v); }

function readWord() {
  const w = ($("wordInput").value || "").toLowerCase().replace(/[^a-z]/g, "");
  return w;
}

// ======== 插入（分步）========
async function doInsert() {
  if (busy) return;
  const w = readWord();
  if (!w) { setStatus("请输入由小写字母组成的单词。"); return; }
  lock(true);
  let cur = root;
  const pathEdges = new Set();
  render({ [cur.id]: "cur" }, pathEdges);
  setStatus(`插入 "<b>${w}</b>"：从根出发，逐个字符往下走。`);
  await sleep(speed());
  for (let i = 0; i < w.length; i++) {
    const ch = w[i];
    if (cur.children[ch]) {
      setStatus(`第 ${i + 1} 个字符 '${ch}'：已有该分支，<b>复用</b>（公共前缀共享）。`);
    } else {
      const nn = newNode(); nn.ch = ch; cur.children[ch] = nn;
      setStatus(`第 ${i + 1} 个字符 '${ch}'：没有该分支，<b>新建</b>节点。`);
    }
    pathEdges.add(cur.id + ">" + cur.children[ch].id);
    cur = cur.children[ch];
    render({ [cur.id]: "cur" }, pathEdges);
    await sleep(speed());
  }
  const already = cur.isEnd;
  cur.isEnd = true;
  if (!words.includes(w)) words.push(w);
  render({ [cur.id]: "hit" }, pathEdges);
  setStatus(already ? `"${w}" 已存在，末尾节点已是词尾。` : `<span class="hl">插入完成！</span>把末尾节点标记为「单词结尾 ●」。`);
  $("wordInput").value = "";
  lock(false);
}

// ======== 查找整词（分步）========
async function doSearch() {
  if (busy) return;
  const w = readWord();
  if (!w) { setStatus("请输入要查找的单词。"); return; }
  lock(true);
  let cur = root;
  const pathEdges = new Set();
  render({ [cur.id]: "cur" }, pathEdges);
  setStatus(`查找 "<b>${w}</b>"：沿路径逐字符走。`);
  await sleep(speed());
  for (let i = 0; i < w.length; i++) {
    const ch = w[i];
    if (!cur.children[ch]) {
      render({ [cur.id]: "cur" }, pathEdges);
      setStatus(`第 ${i + 1} 个字符 '${ch}'：<span class="bad">没有该分支 → 单词不存在。</span>`);
      lock(false); return;
    }
    pathEdges.add(cur.id + ">" + cur.children[ch].id);
    cur = cur.children[ch];
    render({ [cur.id]: "cur" }, pathEdges);
    setStatus(`匹配到 '${ch}'，继续。`);
    await sleep(speed());
  }
  render({ [cur.id]: cur.isEnd ? "hit" : "cur" }, pathEdges);
  setStatus(cur.isEnd
    ? `<span class="hl">找到了！</span>路径走到末尾且该节点是「单词结尾」，"${w}" 存在。`
    : `<span class="bad">路径能走通，但末尾不是词尾 → "${w}" 只是某个词的前缀，不是完整单词。</span>`);
  renderWordList(cur.isEnd ? w : undefined);
  lock(false);
}

// ======== 前缀统计（分步）========
async function doPrefix() {
  if (busy) return;
  const w = readWord();
  if (!w) { setStatus("请输入前缀。"); return; }
  lock(true);
  let cur = root;
  const pathEdges = new Set();
  render({ [cur.id]: "cur" }, pathEdges);
  setStatus(`统计前缀 "<b>${w}</b>"：先沿路径走到前缀末端。`);
  await sleep(speed());
  for (let i = 0; i < w.length; i++) {
    const ch = w[i];
    if (!cur.children[ch]) {
      render({ [cur.id]: "cur" }, pathEdges);
      setStatus(`'${ch}' 分支不存在 → 没有任何单词以 "<b>${w}</b>" 为前缀（0 个）。`);
      lock(false); return;
    }
    pathEdges.add(cur.id + ">" + cur.children[ch].id);
    cur = cur.children[ch];
    render({ [cur.id]: "cur" }, pathEdges);
    await sleep(speed());
  }
  // 统计以 cur 为根的子树里的词尾数
  let cnt = 0; const sub = [];
  (function w2(u) { if (u.isEnd) cnt++; Object.values(u.children).forEach(w2); })(cur);
  const marks = {}; const subEdges = new Set(pathEdges);
  (function markSub(u) { marks[u.id] = "hit"; Object.keys(u.children).sort().forEach(k => { subEdges.add(u.id + ">" + u.children[k].id); markSub(u.children[k]); }); })(cur);
  render(marks, subEdges);
  const matched = words.filter(x => x.startsWith(w));
  setStatus(`到达前缀末端。以它为根的<b>整棵子树</b>都以 "<b>${w}</b>" 为前缀，其中词尾共 <span class="hl">${cnt}</span> 个：${matched.join(", ") || "无"}。`);
  lock(false);
}

function reset(seed) {
  nodeSeq = 0; root = newNode(); words = [];
  if (seed) ["cat", "car", "card", "dog", "do", "dot"].forEach(w => {
    let cur = root;
    for (const ch of w) { if (!cur.children[ch]) { const nn = newNode(); nn.ch = ch; cur.children[ch] = nn; } cur = cur.children[ch]; }
    cur.isEnd = true; words.push(w);
  });
  render();
  setStatus(seed ? "已载入示例单词集：cat car card dog do dot。注意 cat/car/card 共享前缀 c-a。" : "已清空。输入单词后点「插入」。");
}

$("insertBtn").onclick = doInsert;
$("searchBtn").onclick = doSearch;
$("prefixBtn").onclick = doPrefix;
$("clearBtn").onclick = () => { if (!busy) reset(false); };
$("demoBtn").onclick = () => { if (!busy) reset(true); };
$("wordInput").addEventListener("keydown", e => { if (e.key === "Enter") doInsert(); });

$("formula").innerHTML = `节点 = 一个前缀；边 = 一个字符。<br><b>插入</b>：沿路径走，缺字符就建节点，末尾标「词尾」。<br><b>查找整词</b>：走到末尾 <b>且</b> 该节点是词尾。<br><b>前缀统计</b>：走到前缀末端，其子树内的词尾数即答案。<br>每步复杂度 O(单词长度)。`;

CppView.register({
  trie: { title: "字典树 Trie（插入 / 查找 / 前缀）— C++", code:
`// 字典树 Trie：把单词按字符逐层存入一棵树，公共前缀共享路径。
// 支持 insert(插入)、search(查完整单词)、startsWith(前缀是否存在)。
#include <iostream>
#include <string>
using namespace std;

const int MAXN = 100005;   // 最多节点数
int nxt[MAXN][26];         // nxt[u][c] = 节点 u 沿字符 c 的子节点(0 表示不存在)
bool isEnd[MAXN];          // 该节点是否是某单词的结尾
int cnt = 0;               // 已用节点数，0 号为根

void insert(const string& s) {
    int u = 0;
    for (char c : s) {
        int c2 = c - 'a';
        if (!nxt[u][c2]) nxt[u][c2] = ++cnt;   // 缺则新建
        u = nxt[u][c2];
    }
    isEnd[u] = true;                           // 标记词尾
}
bool search(const string& s) {                 // 是否存在完整单词 s
    int u = 0;
    for (char c : s) {
        int c2 = c - 'a';
        if (!nxt[u][c2]) return false;
        u = nxt[u][c2];
    }
    return isEnd[u];                           // 必须走到词尾
}
bool startsWith(const string& s) {             // 是否存在以 s 为前缀的单词
    int u = 0;
    for (char c : s) {
        int c2 = c - 'a';
