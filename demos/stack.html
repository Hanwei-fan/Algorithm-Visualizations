<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栈 Stack 演示 // CYBER</title>
<style>
  :root {
    --bg: #07060f; --panel: rgba(18, 15, 38, 0.72); --border: #2a2350;
    --text: #e6e1ff; --muted: #7d76a8; --cyan: #00f0ff; --magenta: #ff2bd6;
    --yellow: #ffd400; --green: #00ff9c; --grid: rgba(0, 240, 255, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); line-height: 1.55;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.14), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(0,240,255,0.14), transparent 45%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  header h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px rgba(0,240,255,.5), 3px 0 var(--magenta);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .back {
    display: inline-block; margin: 14px 30px 0; padding: 6px 16px;
    border: 1px solid var(--border); border-radius: 4px; text-decoration: none;
    color: var(--cyan); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .back:hover { border-color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 30px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; background: rgba(5,4,15,0.8); color: var(--text);
    font-family: "SF Mono", Menlo, monospace; width: 90px;
  }
  .field input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  .btn {
    padding: 9px 16px; border: 1px solid var(--magenta); border-radius: 4px;
    background: rgba(255,43,214,0.12); color: var(--magenta); font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--magenta); color: #05060f; box-shadow: 0 0 16px rgba(255,43,214,.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.cy { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,.08); }
  .btn.cy:hover:not(:disabled) { background: var(--cyan); color: #05060f; box-shadow: 0 0 16px rgba(0,240,255,.6); }
  .btn.ghost { border-color: var(--border); color: var(--muted); background: rgba(255,255,255,0.02); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
    backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(0,240,255,.05), 0 8px 40px rgba(0,0,0,.5);
  }
  /* 容器可视化区 */
  .viz { min-height: 400px; display: flex; align-items: flex-end; justify-content: center; position: relative; padding: 30px 0 20px; }
  /* 栈：底端封口的 U 形玻璃容器 —— 左墙、右墙、底墙，顶部开口 */
  .glass {
    position: relative; width: 200px; min-height: 340px;
    display: flex; flex-direction: column-reverse; align-items: stretch; justify-content: flex-start;
    gap: 6px; padding: 10px 12px 14px;
    border-left: 4px solid var(--cyan); border-right: 4px solid var(--cyan); border-bottom: 4px solid var(--cyan);
    border-radius: 0 0 16px 16px;
    background: linear-gradient(180deg, rgba(0,240,255,0.02), rgba(0,240,255,0.06));
    box-shadow: 0 0 18px rgba(0,240,255,.18), inset 0 0 24px rgba(0,240,255,.05);
  }
  /* 顶部开口标记：两个小豁口 */
  .glass::before, .glass::after {
    content: ""; position: absolute; top: -4px; width: 20px; height: 4px; background: var(--cyan);
    box-shadow: 0 0 8px rgba(0,240,255,.6);
  }
  .glass::before { left: -4px; }
  .glass::after { right: -4px; }
  .opening {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    font-family: "SF Mono", Menlo, monospace; font-size: 12px; color: var(--cyan); white-space: nowrap;
    letter-spacing: .5px;
  }
  .cell {
    height: 42px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--cyan); border-radius: 6px; background: rgba(0,240,255,0.12);
    color: var(--cyan); font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 17px;
    box-shadow: 0 0 10px rgba(0,240,255,.2); transition: all .2s; position: relative;
  }
  .cell.enter { animation: drop .4s ease; border-color: var(--green); background: rgba(0,255,156,0.2); box-shadow: 0 0 16px rgba(0,255,156,.6); }
  .cell.leave { animation: lift .45s ease forwards; border-color: var(--magenta); background: rgba(255,43,214,0.22); box-shadow: 0 0 16px rgba(255,43,214,.7); }
  .cell.peek { border-color: var(--yellow); background: rgba(255,212,0,0.22); box-shadow: 0 0 16px rgba(255,212,0,.6); }
  @keyframes drop { 0% { transform: translateY(-70px); opacity: 0; } 60% { transform: translateY(6px); } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes lift { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  .tagptr {
    position: absolute; right: -76px; top: 50%; transform: translateY(-50%);
    font-family: "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 700;
    color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,.7); white-space: nowrap;
  }
  .tagptr.base { color: var(--muted); text-shadow: none; }
  .empty-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-family: "SF Mono", Menlo, monospace; font-size: 14px; }
  /* 右栏 */
  .plabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; }
  .pseudocode {
    background: rgba(3,2,12,0.85); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; color: #8fb8c9; margin: 0 0 16px;
  }
  .pseudocode .line { padding: 2px 8px; border-radius: 3px; white-space: pre-wrap; }
  .pseudocode .line.active { background: linear-gradient(90deg, rgba(255,43,214,.9), rgba(0,240,255,.6)); color: #fff; box-shadow: 0 0 14px rgba(255,43,214,.5); }
  .stats { display: flex; gap: 24px; font-size: 14px; align-items: baseline; margin-bottom: 12px; }
  .stats b { font-size: 20px; color: var(--yellow); font-family: "SF Mono", Menlo, monospace; text-shadow: 0 0 12px rgba(255,212,0,.6); }
  .status { margin-top: 6px; font-size: 15px; min-height: 22px; color: var(--text); font-family: "SF Mono", Menlo, monospace; }
  .note { padding: 6px 30px 30px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .note code { color: var(--cyan); }
  /* 演示切换 tab */
  .tabs { display: flex; gap: 8px; padding: 12px 30px 0; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(0,240,255,0.04); color: var(--cyan); font-size: 13px;
    cursor: pointer; font-family: "SF Mono", Menlo, monospace; transition: all .16s; white-space: nowrap;
  }
  .tab:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.3); }
  .tab.active { background: var(--cyan); color: #05060f; border-color: var(--cyan); font-weight: 700; box-shadow: 0 0 12px rgba(0,240,255,.5); }
  /* 模式显隐：默认显示基本操作控件 */
  .app-only { display: none; }
  body.app .app-only { display: flex; }
  body.app .basic-only { display: none !important; }
  .field input.wide { width: 300px; }
  /* token 序列 / 输出序列 */
  .seqrow { margin-bottom: 14px; }
  .seqlabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-family: "SF Mono", Menlo, monospace; }
  .tokens { display: flex; gap: 6px; flex-wrap: wrap; }
  .tok {
    min-width: 34px; height: 38px; padding: 0 8px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 6px; background: rgba(0,240,255,0.04);
    color: var(--text); font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 16px; transition: all .18s;
  }
  .tok.done { opacity: .4; border-color: #1a163a; }
  .tok.cur { border-color: var(--yellow); background: rgba(255,212,0,0.22); color: #120e00; box-shadow: 0 0 14px rgba(255,212,0,.6); transform: translateY(-4px); }
  .tok.op { color: var(--magenta); }
  .tok.out { border-color: var(--green); background: rgba(0,255,156,0.14); color: var(--green); }
  .verdict { font-size: 16px; font-family: "SF Mono", Menlo, monospace; font-weight: 700; margin-top: 8px; padding: 10px 14px; border-radius: 6px; }
  .verdict.ok { color: var(--green); border: 1px solid var(--green); background: rgba(0,255,156,.1); }
  .verdict.bad { color: var(--magenta); border: 1px solid var(--magenta); background: rgba(255,43,214,.1); }
  /* 应用模式的栈：稍矮，容纳右栏并排 */
  body.app .glass { min-height: 260px; }
  body.app .viz { min-height: 300px; }
</style>
</head>
<body>
<header>
  <h1>栈 Stack 演示</h1>
  <p id="subtitle">栈 Stack：后进先出 (LIFO)。底端封口的容器，只在顶部开口处压入(push)和弹出(pop)。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="tabs" id="tabs">
  <button class="tab active" data-mode="basic">基本操作</button>
  <button class="tab" data-mode="popseq">合法出栈序列</button>
  <button class="tab" data-mode="prefix">前缀表达式求值</button>
  <button class="tab" data-mode="postfix">后缀表达式求值</button>
  <button class="tab" data-mode="in2post">中缀转后缀</button>
  <button class="tab" data-mode="in2pre">中缀转前缀</button>
</div>

<div class="controls">
  <!-- 基本操作控件 -->
  <div class="field basic-only">
    <label for="valInput">入栈值</label>
    <input id="valInput" type="number" placeholder="值">
  </div>
  <button class="btn cy basic-only" id="pushBtn">入栈 push</button>
  <button class="btn basic-only" id="popBtn">出栈 pop</button>
  <button class="btn ghost basic-only" id="peekBtn">查看栈顶</button>
  <button class="btn ghost basic-only" id="clearBtn">清空</button>
  <!-- 应用演示控件 -->
  <div class="field app-only">
    <label for="exprInput" id="exprLabel">输入</label>
    <input id="exprInput" type="text" class="wide" placeholder="">
  </div>
  <div class="field app-only" id="popseqField" style="display:none">
    <label for="popInput">出栈序列（判断是否合法）</label>
    <input id="popInput" type="text" class="wide" placeholder="如 3 2 5 4 1">
  </div>
  <button class="btn cy app-only" id="runBtn">开始演示</button>
  <button class="btn app-only" id="playBtn" disabled>自动播放</button>
  <button class="btn ghost app-only" id="stepBtn" disabled>单步 ▶</button>
  <div class="speed app-only" style="display:flex;flex-direction:column;gap:5px">
    <label style="font-size:12px;color:var(--cyan);letter-spacing:1px">速度</label>
    <input id="speedInput" type="range" min="150" max="1400" value="750" step="50" style="width:120px;accent-color:var(--magenta)">
  </div>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<main>
  <section class="card">
    <div class="seqrow app-only" id="seqRow" style="display:none">
      <div class="seqlabel" id="inSeqLabel">输入序列</div>
      <div class="tokens" id="inTokens"></div>
    </div>
    <div class="seqrow app-only" id="outRow" style="display:none">
      <div class="seqlabel" id="outSeqLabel">输出</div>
      <div class="tokens" id="outTokens"></div>
    </div>
    <div class="seqrow app-only" id="finalRow" style="display:none">
      <div class="seqlabel" id="finalSeqLabel">最终结果</div>
      <div class="tokens" id="finalTokens"></div>
    </div>
    <div class="viz" id="viz"></div>
  </section>
  <section class="card">
    <div class="plabel">操作代码</div>
    <div class="pseudocode" id="code"></div>
    <div class="stats basic-only">
      元素个数：<b id="sizeCount">0</b>
      <span>容量上限：<b id="capCount">8</b></span>
    </div>
    <div class="verdict" id="verdict" style="display:none"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note" id="note">栈的一端封闭（<code>栈底</code>），只在<code>栈顶</code>操作：push 从顶部开口压入，pop 从顶部开口弹出。像一个底端封口的容器/一摞盘子，最后放上的最先取走（LIFO）。</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const CAP = 8;
let items = [];   // 栈底 → 栈顶
let busy = false;

const CODE = {
  push: ["push(x):", "    if 满: 溢出(overflow)", "    top++", "    s[top] = x"],
  pop: ["pop():", "    if 空: 下溢(underflow)", "    x = s[top]", "    top--; return x"],
  peek: ["top():", "    if 空: return null", "    return s[top]  // 不删除"],
};

function renderCode(lines, activeLines) {
  $("code").innerHTML = lines.map((l, i) =>
    `<div class="line${activeLines && activeLines.includes(i) ? " active" : ""}">${escHtml(l)}</div>`).join("");
}
function escHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// mark: {idx, cls}
function render(mark) {
  const viz = $("viz");
  // 始终画出容器（虚拟结构），元素在容器内堆叠
  let inner = "";
  items.forEach((v, i) => {
    let cls = "cell";
    if (mark && mark.idx === i) cls += " " + mark.cls;
    let ptr = "";
    if (i === items.length - 1) ptr = `<span class="tagptr">← 栈顶 top</span>`;
    else if (i === 0) ptr = `<span class="tagptr base">← 栈底</span>`;
    inner += `<div class="${cls}">${v}${ptr}</div>`;
  });
  const emptyHint = items.length === 0 ? `<div class="empty-hint">（栈为空，从顶部开口压入）</div>` : "";
  viz.innerHTML = `<div class="glass"><div class="opening">↑ 顶部开口 (push / pop)</div>${inner}${emptyHint}</div>`;
  $("sizeCount").textContent = items.length;
}

function setStatus(t) { $("status").textContent = t; }
function lock(v) { busy = v; document.querySelectorAll(".btn").forEach(b => b.disabled = v); }

async function doPush() {
  if (busy) return;
  const v = parseInt($("valInput").value, 10);
  if (isNaN(v)) { setStatus("请输入一个整数值。"); return; }
  if (items.length >= CAP) { renderCode(CODE.push, [1]); setStatus(`⚠ 已达容量上限 ${CAP}，溢出(overflow)！无法继续入栈。`); return; }
  lock(true);
  renderCode(CODE.push, [2, 3]);
  items.push(v);
  render({ idx: items.length - 1, cls: "enter" });
  setStatus(`push(${v})：从顶部开口压入栈顶。`);
  $("valInput").value = "";
  await sleep(420);
  render();
  lock(false);
}

async function doPop() {
  if (busy) return;
  if (items.length === 0) { renderCode(CODE.pop, [1]); setStatus(`⚠ 栈为空，下溢(underflow)！无可删除元素。`); return; }
  lock(true);
  const idx = items.length - 1;
  renderCode(CODE.pop, [2, 3]);
  render({ idx, cls: "leave" });
  const v = items[idx];
  setStatus(`pop()：从顶部开口弹出栈顶 ${v}。`);
  await sleep(460);
  items.pop();
  render();
  lock(false);
}

async function doPeek() {
  if (busy) return;
  if (items.length === 0) { renderCode(CODE.peek, [1]); setStatus(`栈为空。`); return; }
  lock(true);
  const idx = items.length - 1;
  renderCode(CODE.peek, [2]);
  render({ idx, cls: "peek" });
  setStatus(`top()：栈顶元素是 ${items[idx]}（不删除）。`);
  await sleep(650);
  render();
  lock(false);
}

$("pushBtn").onclick = doPush;
$("popBtn").onclick = doPop;
$("peekBtn").onclick = doPeek;
$("clearBtn").onclick = () => { if (busy) return; items = []; render(); setStatus("已清空。"); };
$("valInput").addEventListener("keydown", e => { if (e.key === "Enter") doPush(); });

$("capCount").textContent = CAP;
renderCode(CODE.push);
render();
setStatus("试试入栈 / 出栈。");

// ================= 应用演示 =================
let mode = "basic";
let appSteps = [], appIdx = 0, appTimer = null;

function isOp(t) { return t === "+" || t === "-" || t === "*" || t === "/"; }
function prec(op) { return (op === "+" || op === "-") ? 1 : 2; }
function applyOp(a, b, op) { return op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : Math.trunc(a / b); }
function tokenize(s) { return s.trim().split(/\s+/).filter(Boolean); }

// 渲染应用模式：栈(数组 stk) + 输入 token 高亮 + 输出序列
function renderApp(s) {
  // 栈可视化
  const viz = $("viz");
  let inner = "";
  (s.stk || []).forEach((v, i) => {
    let cls = "cell";
    if (s.stkMark && s.stkMark.idx === i) cls += " " + s.stkMark.cls;
    let ptr = "";
    if (i === s.stk.length - 1) ptr = `<span class="tagptr">← 栈顶</span>`;
    inner += `<div class="${cls}">${v}${ptr}</div>`;
  });
  const emptyHint = (s.stk && s.stk.length === 0) ? `<div class="empty-hint">（栈为空）</div>` : "";
  viz.innerHTML = `<div class="glass"><div class="opening">↑ 栈顶</div>${inner}${emptyHint}</div>`;
  // 输入 token
  if (s.tokens) {
    $("inTokens").innerHTML = s.tokens.map((t, i) => {
      let cls = "tok" + (isOp(t) ? " op" : "");
      if (i === s.cur) cls += " cur";
      else if (s.doneMask && s.doneMask[i]) cls += " done";
      return `<div class="${cls}">${t}</div>`;
    }).join("");
  }
  // 输出序列。grayMask 存在时：完整显示 outFull，已出栈的元素置灰(done 样式)
  if (s.outFull !== undefined) {
    $("outTokens").innerHTML = s.outFull.map((t, i) => {
      let cls = "tok" + (isOp(t) ? " op" : "");
      if (s.grayMask && s.grayMask[i]) cls += " done";      // 已出栈 -> 置灰
      if (s.curOut === i) cls += " cur";                     // 正在出栈的目标
      return `<div class="${cls}">${t}</div>`;
    }).join("");
  } else if (s.out !== undefined) {
    $("outTokens").innerHTML = (s.out.length ? s.out : [""]).map(t =>
      t === "" ? `<div class="tok" style="opacity:.3">·</div>` : `<div class="tok out ${isOp(t) ? "op" : ""}">${t}</div>`).join("");
  }
  // 额外一行（如中缀转前缀的“反转后的输出”）
  if (s.extraTokens !== undefined) {
    $("finalRow").style.display = "block";
    $("finalSeqLabel").textContent = s.extraLabel || "";
    $("finalTokens").innerHTML = (s.extraTokens.length ? s.extraTokens : [""]).map(t =>
      t === "" ? `<div class="tok" style="opacity:.3">·</div>` : `<div class="tok out ${isOp(t) ? "op" : ""}">${t}</div>`).join("");
  } else {
    $("finalRow").style.display = "none";
  }
  if (s.codeLines) renderCode(s.code || appCode, s.codeLines);
  if (s.verdict) { const vd = $("verdict"); vd.style.display = "block"; vd.className = "verdict " + (s.verdict.ok ? "ok" : "bad"); vd.innerHTML = s.verdict.text; }
  setStatus(s.status || "");
}

let appCode = [];

// ---- 生成分步 ----
// 1. 合法出栈序列
function genPopSeq(pushArr, outArr) {
  appCode = [
    "j = 0",
    "for x in pushSeq:      // 依次入栈",
    "    push(x)",
    "    while 栈非空 且 栈顶 == out[j]:",
    "        pop(); j++     // 能出就出",
    "return 栈空 ? 合法 : 不合法",
  ];
  const steps = [];
  const stk = []; let j = 0; const done = new Array(outArr.length).fill(false);
  // 出栈序列完整显示；gray[k]=true 表示 out[k] 已出栈(置灰)
  const gray = () => done.slice();
  steps.push({ tokens: pushArr, outFull: outArr, grayMask: gray(), curOut: j < outArr.length ? j : -1, stk: [], cur: -1, doneMask: [], code: appCode, codeLines: [0], status: `入栈序列 [${pushArr.join(" ")}]（上），目标出栈序列 [${outArr.join(" ")}]（下）。每出栈一个就把它置灰。` });
  for (let i = 0; i < pushArr.length; i++) {
    stk.push(pushArr[i]);
    steps.push({ tokens: pushArr, outFull: outArr, grayMask: gray(), curOut: j < outArr.length ? j : -1, stk: [...stk], cur: i, doneMask: pushArr.map((_,k)=>k<i), code: appCode, codeLines: [2], status: `push(${pushArr[i]})，栈顶=${pushArr[i]}。`, stkMark: { idx: stk.length-1, cls: "enter" } });
    while (stk.length && j < outArr.length && stk[stk.length-1] === outArr[j]) {
      const popped = stk[stk.length-1];
      steps.push({ tokens: pushArr, outFull: outArr, grayMask: gray(), curOut: j, stk: [...stk], cur: i, doneMask: pushArr.map((_,k)=>k<=i), code: appCode, codeLines: [3,4], status: `栈顶 ${popped} == 目标 out[${j}]=${outArr[j]}，pop 出栈。`, stkMark: { idx: stk.length-1, cls: "leave" } });
      stk.pop(); done[j] = true; j++;
      steps.push({ tokens: pushArr, outFull: outArr, grayMask: gray(), curOut: j < outArr.length ? j : -1, stk: [...stk], cur: i, doneMask: pushArr.map((_,k)=>k<=i), code: appCode, codeLines: [3,4], status: `${popped} 已出栈，置灰。下一个目标：${j < outArr.length ? outArr[j] : "(无)"}。` });
    }
  }
  const ok = stk.length === 0 && j === outArr.length;
  steps.push({ tokens: pushArr, outFull: outArr, grayMask: gray(), curOut: -1, stk: [...stk], cur: -1, doneMask: pushArr.map(()=>true), code: appCode, codeLines: [5],
    status: ok ? "全部匹配，栈已清空。" : "无法继续匹配，栈中仍有元素。",
    verdict: { ok, text: ok ? `✓ 合法出栈序列` : `✗ 不是合法出栈序列（栈中残留 [${stk.join(" ")}]，或顺序不符）` } });
  return steps;
}

// 2/3. 前缀 / 后缀 求值。prefix=true 从右向左；否则从左向右
function genEval(tokens, prefix) {
  appCode = prefix ? [
    "for i = n-1 downto 0:   // 前缀：从右向左",
    "    if 是数字: push(数字)",
    "    else 运算符:",
    "        a = pop(); b = pop()   // ①出栈两个数",
    "        r = a op b             // ②计算",
    "        push(r)                // ③结果入栈",
    "结果 = 栈顶",
  ] : [
    "for i = 0 to n-1:       // 后缀：从左向右",
    "    if 是数字: push(数字)",
    "    else 运算符:",
    "        b = pop(); a = pop()   // ①出栈两个数",
    "        r = a op b             // ②计算",
    "        push(r)                // ③结果入栈",
    "结果 = 栈顶",
  ];
  const steps = [];
  const stk = [];
  const order = prefix ? [...tokens.keys()].reverse() : [...tokens.keys()];
  const doneOf = (upTo) => tokens.map((_, k) => prefix ? k > upTo : k < upTo);
  steps.push({ tokens, out: undefined, stk: [], cur: -1, doneMask: tokens.map(()=>false), code: appCode, codeLines: [0],
    status: `${prefix ? "前缀表达式：从右向左" : "后缀表达式：从左向右"} 扫描 [${tokens.join(" ")}]。` });
  for (const i of order) {
    const t = tokens[i];
    if (!isOp(t)) {
      stk.push(Number(t));
      steps.push({ tokens, stk: [...stk], cur: i, doneMask: doneOf(i), code: appCode, codeLines: [1],
        status: `遇数字 ${t}，压入栈。`, stkMark: { idx: stk.length-1, cls: "enter" } });
    } else {
      const x = stk[stk.length-1], y = stk[stk.length-2];
      const a = prefix ? x : y, b = prefix ? y : x;   // 前缀:先弹出的是左操作数
      // ① 出栈两个数
      steps.push({ tokens, stk: [...stk], cur: i, doneMask: doneOf(i), code: appCode, codeLines: [3],
        status: `遇运算符 ${t} → ①出栈栈顶两个数：${prefix ? `先弹 ${a}(左)，再弹 ${b}(右)` : `先弹 ${b}(右)，再弹 ${a}(左)`}。`, stkMark: { idx: stk.length-1, cls: "leave" } });
      stk.pop(); stk.pop();
      // ② 计算结果（此时栈里已无这两个数）
      steps.push({ tokens, stk: [...stk], cur: i, doneMask: doneOf(i), code: appCode, codeLines: [4],
        status: `②计算 ${a} ${t} ${b} = ${applyOp(a, b, t)}。` });
      // ③ 结果入栈
      const r = applyOp(a, b, t);
      stk.push(r);
      steps.push({ tokens, stk: [...stk], cur: i, doneMask: doneOf(i), code: appCode, codeLines: [5],
        status: `③把结果 ${r} 压回栈。`, stkMark: { idx: stk.length-1, cls: "enter" } });
    }
  }
  steps.push({ tokens, stk: [...stk], cur: -1, doneMask: tokens.map(()=>true), code: appCode, codeLines: [prefix ? 6 : 6],
    status: `扫描结束，栈顶即结果。`,
    verdict: { ok: true, text: `= ${stk[stk.length-1]}` } });
  return steps;
}

// 4. 中缀转后缀（Shunting-yard）。这里栈存运算符。
function genIn2Post(tokens) {
  appCode = [
    "for t in 中缀:",
    "    数字 -> 直接输出",
    "    '(' -> 入栈",
    "    ')' -> 弹栈输出直到 '('",
    "    运算符 -> 弹出栈顶优先级>=它的，再入栈",
    "扫描完，栈中剩余运算符依次输出",
  ];
  const steps = []; const out = []; const ops = [];
  const dm = (i) => tokens.map((_, k) => k < i);
  steps.push({ tokens, out: [], stk: [], cur: -1, doneMask: tokens.map(()=>false), code: appCode, codeLines: [0], status: `中缀 [${tokens.join(" ")}] 转后缀。栈存运算符，数字直接进输出。` });
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === "(") {
      ops.push(t);
      steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [2], status: `'(' 入栈。`, stkMark: { idx: ops.length-1, cls: "enter" } });
    } else if (t === ")") {
      steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [3], status: `')'：弹出运算符输出，直到遇 '('。` });
      while (ops.length && ops[ops.length-1] !== "(") { out.push(ops.pop()); steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [3], status: `弹出 ${out[out.length-1]} 输出。`, stkMark: { idx: ops.length, cls: "leave" } }); }
      ops.pop();
      steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [3], status: `丢弃匹配的 '('。` });
    } else if (isOp(t)) {
      while (ops.length && ops[ops.length-1] !== "(" && prec(ops[ops.length-1]) >= prec(t)) {
        out.push(ops.pop());
        steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [4], status: `栈顶优先级≥${t}，弹出 ${out[out.length-1]} 输出。`, stkMark: { idx: ops.length, cls: "leave" } });
      }
      ops.push(t);
      steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [4], status: `运算符 ${t} 入栈。`, stkMark: { idx: ops.length-1, cls: "enter" } });
    } else {
      out.push(t);
      steps.push({ tokens, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [1], status: `数字 ${t} 直接输出。` });
    }
  }
  while (ops.length) { out.push(ops.pop()); steps.push({ tokens, out: [...out], stk: [...ops], cur: -1, doneMask: tokens.map(()=>true), code: appCode, codeLines: [5], status: `扫描完，弹出剩余运算符 ${out[out.length-1]}。`, stkMark: { idx: ops.length, cls: "leave" } }); }
  steps.push({ tokens, out: [...out], stk: [], cur: -1, doneMask: tokens.map(()=>true), code: appCode, codeLines: [5], status: `完成。`, verdict: { ok: true, text: `后缀 = ${out.join(" ")}` } });
  return steps;
}

// 5. 中缀转前缀：反转(括号互换)后按“优先级严格大于才弹”做转换，最后再反转输出。
function genIn2Pre(tokens) {
  appCode = [
    "① 反转中缀，'(' 与 ')' 互换",
    "② 对反转串扫描（同优先级不弹，用 > 判断）：",
    "    数字->输出  '('->入栈  ')'->弹到'('",
    "    运算符->弹出栈顶优先级严格大于它的，再入栈",
    "③ 剩余运算符输出，最后把整个输出反转",
  ];
  const rev = [...tokens].reverse().map(t => t === "(" ? ")" : t === ")" ? "(" : t);
  const steps = []; const out = []; const ops = [];
  const dm = (i) => rev.map((_, k) => k < i);
  steps.push({ tokens: rev, out: [], stk: [], cur: -1, doneMask: rev.map(()=>false), code: appCode, codeLines: [0,1], status: `第①步：反转并互换括号 -> [${rev.join(" ")}]。下面对它扫描（同优先级用 > 不弹）。` });
  for (let i = 0; i < rev.length; i++) {
    const t = rev[i];
    if (t === "(") {
      ops.push(t);
      steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [2], status: `'(' 入栈。`, stkMark: { idx: ops.length-1, cls: "enter" } });
    } else if (t === ")") {
      steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [2], status: `')'：弹出运算符输出直到 '('。` });
      while (ops.length && ops[ops.length-1] !== "(") { out.push(ops.pop()); steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [2], status: `弹出 ${out[out.length-1]}。`, stkMark: { idx: ops.length, cls: "leave" } }); }
      ops.pop();
      steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [2], status: `丢弃 '('。` });
    } else if (isOp(t)) {
      while (ops.length && ops[ops.length-1] !== "(" && prec(ops[ops.length-1]) > prec(t)) {
        out.push(ops.pop());
        steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i), code: appCode, codeLines: [3], status: `栈顶优先级 > ${t}，弹出 ${out[out.length-1]}。`, stkMark: { idx: ops.length, cls: "leave" } });
      }
      ops.push(t);
      steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [3], status: `运算符 ${t} 入栈。`, stkMark: { idx: ops.length-1, cls: "enter" } });
    } else {
      out.push(t);
      steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: i, doneMask: dm(i+1), code: appCode, codeLines: [2], status: `数字 ${t} 输出。` });
    }
  }
  while (ops.length) { out.push(ops.pop()); steps.push({ tokens: rev, out: [...out], stk: [...ops], cur: -1, doneMask: rev.map(()=>true), code: appCode, codeLines: [4], status: `弹出剩余 ${out[out.length-1]}。`, stkMark: { idx: ops.length, cls: "leave" } }); }
  const pre = [...out].reverse();
  // 保留“转换得到的输出(逆序)”在原输出行，把反转后的前缀单独显示在第三行
  steps.push({ tokens: rev, out: [...out], stk: [], cur: -1, doneMask: rev.map(()=>true), code: appCode, codeLines: [4],
    extraTokens: pre, extraLabel: "③ 反转输出 → 前缀表达式",
    status: `第③步：把上面的输出 [${out.join(" ")}] 整体反转，得到下方的前缀表达式。`,
    verdict: { ok: true, text: `前缀 = ${pre.join(" ")}` } });
  return steps;
}

// ---- 应用引擎 ----
const APP_CFG = {
  popseq: { title: "合法出栈序列判断", placeholder: "", inLabel: "入栈序列", outLabel: "已出栈",
    note: "给定入栈顺序，判断一个序列能否由栈的 push/pop 得到。贪心：按入栈序依次压栈，每次能弹出匹配目标就弹，最后栈空即合法。" },
  prefix: { title: "前缀表达式求值", placeholder: "如 + 3 * 4 2", inLabel: "前缀表达式", outLabel: "—",
    note: "前缀(波兰式)：运算符在操作数前。从右向左扫描，数字入栈，遇运算符弹两个数(先弹的是左操作数)计算后压回。" },
  postfix: { title: "后缀表达式求值", placeholder: "如 3 4 2 * +", inLabel: "后缀表达式", outLabel: "—",
    note: "后缀(逆波兰式)：运算符在操作数后。从左向右扫描，数字入栈，遇运算符弹两个数(先弹的是右操作数)计算后压回。" },
  in2post: { title: "中缀转后缀", placeholder: "如 3 + 4 * 2", inLabel: "中缀表达式", outLabel: "后缀输出",
    note: "Shunting-yard：栈存运算符。数字直接输出；'(' 入栈；')' 弹到 '('；运算符先弹出栈顶优先级 ≥ 它的，再入栈。" },
  in2pre: { title: "中缀转前缀", placeholder: "如 3 + 4 * 2", inLabel: "① 反转并互换括号后的中缀", outLabel: "② 转换输出（逆序，未反转）",
    note: "反转中缀(括号互换)→按“同优先级不弹(用 >)”转换→再反转输出。栈存运算符，规则与转后缀类似但优先级判断用严格大于。" },
};

function drawApp(k) {
  const s = appSteps[k];
  renderApp(s);
}

function buildApp() {
  const cfg = APP_CFG[mode];
  $("verdict").style.display = "none";
  if (mode === "popseq") {
    const pushArr = tokenize($("exprInput").value);
    const outArr = tokenize($("popInput").value);
    if (!pushArr.length || !outArr.length) { setStatus("请输入入栈序列和出栈序列。"); return null; }
    return genPopSeq(pushArr, outArr);
  }
  const toks = tokenize($("exprInput").value);
  if (!toks.length) { setStatus("请输入表达式（各 token 用空格分隔）。"); return null; }
  if (mode === "prefix") return genEval(toks, true);
  if (mode === "postfix") return genEval(toks, false);
  if (mode === "in2post") return genIn2Post(toks);
  if (mode === "in2pre") return genIn2Pre(toks);
  return null;
}

function appStop() { if (appTimer) { clearInterval(appTimer); appTimer = null; } }
function runApp() {
  appStop();
  const st = buildApp();
  if (!st) return;
  appSteps = st; appIdx = 0;
  $("stepBtn").disabled = false; $("playBtn").disabled = false;
  drawApp(0);
}
function appStepOnce() { if (appIdx < appSteps.length - 1) { appIdx++; drawApp(appIdx); return true; } return false; }
function appPlay() {
  appStop();
  if (appIdx >= appSteps.length - 1) runApp();
  const spd = 1550 - parseInt($("speedInput").value, 10);
  appTimer = setInterval(() => { if (!appStepOnce()) appStop(); }, spd);
}

function applyMode(m) {
  mode = m; appStop(); busy = false;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.mode === m));
  document.body.classList.toggle("app", m !== "basic");
  $("verdict").style.display = "none";
  $("seqRow").style.display = m === "basic" ? "none" : "block";
  $("outRow").style.display = "none";
  $("finalRow").style.display = "none";
  if (m === "basic") {
    $("subtitle").textContent = "栈 Stack：后进先出 (LIFO)。底端封口的容器，只在顶部开口处压入(push)和弹出(pop)。";
    $("note").innerHTML = "栈的一端封闭（<code>栈底</code>），只在<code>栈顶</code>操作：push 从顶部开口压入，pop 从顶部开口弹出。像一个底端封口的容器/一摞盘子，最后放上的最先取走（LIFO）。";
    items = []; renderCode(CODE.push); render(); setStatus("试试入栈 / 出栈。");
    return;
  }
  const cfg = APP_CFG[m];
  $("subtitle").textContent = cfg.title + "　·　基于栈的经典应用";
  $("note").textContent = cfg.note;
  $("inSeqLabel").textContent = cfg.inLabel;
  $("outSeqLabel").textContent = cfg.outLabel;
  $("outRow").style.display = (m === "popseq" || m === "in2post" || m === "in2pre") ? "block" : "none";
  // 出栈序列模式：显示第二个输入框；输入框标签改
  $("popseqField").style.display = m === "popseq" ? "flex" : "none";
  $("exprLabel").textContent = m === "popseq" ? "入栈序列" : "表达式（token 空格分隔）";
  // 预填示例
  const demo = { popseq: "1 2 3 4 5", prefix: "+ 3 * 4 2", postfix: "3 4 2 * +", in2post: "3 + 4 * 2", in2pre: "3 + 4 * 2" };
  $("exprInput").value = demo[m] || "";
  $("exprInput").placeholder = cfg.placeholder;
  if (m === "popseq") $("popInput").value = "3 2 5 4 1";
  $("stepBtn").disabled = true; $("playBtn").disabled = true;
  appSteps = []; appIdx = 0;
  $("inTokens").innerHTML = ""; $("outTokens").innerHTML = "";
  renderCode([]); render_appEmpty();
  setStatus(`点「开始演示」运行。`);
}
function render_appEmpty() {
  $("viz").innerHTML = `<div class="glass"><div class="opening">↑ 栈顶</div><div class="empty-hint">（点开始演示）</div></div>`;
}

// tab / 应用按钮绑定
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { if (!busy) applyMode(t.dataset.mode); });
$("runBtn").onclick = runApp;
$("playBtn").onclick = appPlay;
$("stepBtn").onclick = () => { appStop(); appStepOnce(); };
$("exprInput").addEventListener("keydown", e => { if (e.key === "Enter") runApp(); });
$("popInput").addEventListener("keydown", e => { if (e.key === "Enter") runApp(); });
</script>
<script src="../assets/cppview.js"></script>
<script>
CppView.register({
  stack: { title: "栈 Stack (LIFO) — 数组模拟 C++", code:
`// 功能：用数组模拟栈(后进先出 LIFO)，演示 push(入栈) / pop(出栈) / top(查看栈顶)。
// 输入：第一行 m（操作次数）；
//       接下来 m 行，每行一个操作：
//         push x   压入值 x
//         pop      弹出栈顶并输出
//         top      查看栈顶(不删除)并输出
// 输出：每个 pop / top 操作输出一行结果；栈空时 pop/top 输出 "empty"。
#include <iostream>
#include <string>
using namespace std;

const int CAP = 1005;   // 容量上限
int s[CAP];
int top = -1;           // 栈顶下标，-1 表示空栈

void push(int x) {
    if (top >= CAP - 1) return;   // 已满则溢出(此处忽略)
    s[++top] = x;                 // 先移动栈顶指针，再存值
}
int pop() {                        // 调用前需保证非空
    return s[top--];               // 取栈顶值，再下移指针
}
int peek() {                       // 查看栈顶，不删除
    return s[top];
}
bool empty() { return top < 0; }

int main() {
    int m;
    cin >> m;
    string op;
    while (m--) {
        cin >> op;
        if (op == "push") {
            int x; cin >> x;
            push(x);
        } else if (op == "pop") {
            if (empty()) cout << "empty" << endl;
            else cout << pop() << endl;
        } else if (op == "top") {
            if (empty()) cout << "empty" << endl;
            else cout << peek() << endl;
        }
    }
    return 0;
}` },
  stack_popseq: { title: "合法出栈序列判断 — C++", code:
`// 功能：给定入栈序列 pushSeq 与目标出栈序列 outSeq，判断 outSeq 是否合法。
// 方法：按入栈序依次压栈，每压一个就尽量把栈顶与 out[j] 匹配的弹出。最后栈空即合法。
#include <iostream>
#include <stack>
#include <vector>
using namespace std;

bool check(vector<int>& pushSeq, vector<int>& outSeq) {
    if (pushSeq.size() != outSeq.size()) return false;
    stack<int> st;
    int j = 0;
    for (int x : pushSeq) {
        st.push(x);                          // 依次入栈
        while (!st.empty() && st.top() == outSeq[j]) {
            st.pop(); j++;                   // 能出就出
        }
    }
    return st.empty();                        // 栈空 => 合法
}

int main() {
    int n; cin >> n;
    vector<int> a(n), b(n);
    for (int i = 0; i < n; i++) cin >> a[i];  // 入栈序列
    for (int i = 0; i < n; i++) cin >> b[i];  // 待判断的出栈序列
    cout << (check(a, b) ? "YES" : "NO") << endl;
    return 0;
}` },
  stack_prefix: { title: "前缀表达式求值（波兰式）— C++", code:
`// 功能：求前缀表达式的值。运算符在操作数前，从【右向左】扫描。
// 数字入栈；遇运算符弹两个数，先弹出的是左操作数，计算后压回。
#include <iostream>
#include <stack>
#include <vector>
#include <string>
#include <cctype>
using namespace std;

int apply(int a, int b, char op) {
    if (op == '+') return a + b;
    if (op == '-') return a - b;
    if (op == '*') return a * b;
    return a / b;
}
bool isOp(const string& s) { return s.size()==1 && string("+-*/").find(s)!=string::npos; }

int main() {
    vector<string> t;                 // 读入所有 token（空格分隔）
    string s;
    while (cin >> s) t.push_back(s);

    stack<int> st;
    for (int i = t.size() - 1; i >= 0; i--) {   // 从右向左
        if (isOp(t[i])) {
            int a = st.top(); st.pop();          // 先弹=左操作数
            int b = st.top(); st.pop();
            st.push(apply(a, b, t[i][0]));
        } else st.push(stoi(t[i]));
    }
    cout << st.top() << endl;
    return 0;
}` },
  stack_postfix: { title: "后缀表达式求值（逆波兰式）— C++", code:
`// 功能：求后缀表达式的值。运算符在操作数后，从【左向右】扫描。
// 数字入栈；遇运算符弹两个数，先弹出的是右操作数，计算后压回。
#include <iostream>
#include <stack>
#include <string>
#include <cctype>
using namespace std;

int apply(int a, int b, char op) {
    if (op == '+') return a + b;
    if (op == '-') return a - b;
    if (op == '*') return a * b;
    return a / b;
}
bool isOp(const string& s) { return s.size()==1 && string("+-*/").find(s)!=string::npos; }

int main() {
    stack<int> st;
    string t;
    while (cin >> t) {                 // 从左向右逐个 token
        if (isOp(t)) {
            int b = st.top(); st.pop();  // 先弹=右操作数
            int a = st.top(); st.pop();
            st.push(apply(a, b, t[0]));
        } else st.push(stoi(t));

}` },
  stack_in2post: { title: "中缀转后缀（Shunting-yard）— C++", code:
`// 功能：中缀表达式转后缀。栈存运算符：数字直接输出；'(' 入栈；
//       ')' 弹到 '('；运算符先弹出栈顶优先级 >= 它的，再入栈。
#include <iostream>
#include <stack>
#include <vector>
#include <string>
using namespace std;

int prec(char op) { return (op=='+'||op=='-') ? 1 : 2; }
bool isOp(const string& s){ return s.size()==1 && string("+-*/").find(s)!=string::npos; }

int main() {
    vector<string> out;
    stack<string> ops;
    string t;
    while (cin >> t) {
        if (t == "(") ops.push(t);
        else if (t == ")") {
            while (!ops.empty() && ops.top() != "(") { out.push_back(ops.top()); ops.pop(); }
            ops.pop();                       // 丢弃 '('
        } else if (isOp(t)) {
            while (!ops.empty() && ops.top() != "(" && prec(ops.top()[0]) >= prec(t[0])) {
                out.push_back(ops.top()); ops.pop();
            }
            ops.push(t);
        } else out.push_back(t);              // 数字直接输出
    }
    while (!ops.empty()) { out.push_back(ops.top()); ops.pop(); }
    for (int i = 0; i < (int)out.size(); i++) cout << out[i] << " \\n"[i+1==(int)out.size()];
    return 0;
}` },
  stack_in2pre: { title: "中缀转前缀 — C++", code:
`// 功能：中缀转前缀。① 反转中缀并互换括号；② 对反转串转换(同优先级用 > 不弹)；
//       ③ 把输出反转即前缀表达式。
#include <iostream>
#include <stack>
#include <vector>
#include <string>
#include <algorithm>
using namespace std;

int prec(char op) { return (op=='+'||op=='-') ? 1 : 2; }
bool isOp(const string& s){ return s.size()==1 && string("+-*/").find(s)!=string::npos; }

int main() {
    vector<string> t;
    string s;
    while (cin >> s) t.push_back(s);

    reverse(t.begin(), t.end());              // ① 反转
    for (auto& x : t) { if (x=="(") x=")"; else if (x==")") x="("; }  // 括号互换

    vector<string> out;
    stack<string> ops;
    for (auto& x : t) {                       // ② 转换（用严格大于）
        if (x == "(") ops.push(x);
        else if (x == ")") {
            while (!ops.empty() && ops.top() != "(") { out.push_back(ops.top()); ops.pop(); }
            ops.pop();
        } else if (isOp(x)) {
            while (!ops.empty() && ops.top() != "(" && prec(ops.top()[0]) > prec(x[0])) {
                out.push_back(ops.top()); ops.pop();
            }
            ops.push(x);
        } else out.push_back(x);
    }
    while (!ops.empty()) { out.push_back(ops.top()); ops.pop(); }

    reverse(out.begin(), out.end());          // ③ 反转输出
    for (int i = 0; i < (int)out.size(); i++) cout << out[i] << " \\n"[i+1==(int)out.size()];
    return 0;
}` },
