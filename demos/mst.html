<body>
<header>
  <h1>最小生成树演示 (MST)</h1>
  <p id="subtitle">在带权连通无向图中选一棵总权值最小的生成树（n 个点、n-1 条边、连通无环）。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="subtabs">
  <span class="sublabel">算法：</span>
  <button class="subtab active" data-algo="prim">Prim（加点）</button>
  <button class="subtab" data-algo="kruskal">Kruskal（加边+并查集）</button>
</div>

<div class="controls">
  <div class="speed">
    <label for="speedInput">速度</label>
    <input id="speedInput" type="range" min="150" max="1400" value="700" step="50">
  </div>
  <button class="btn" id="playBtn">自动播放</button>
  <button class="btn secondary" id="stepBtn">单步 ▶</button>
  <button class="btn secondary" id="resetBtn">重置</button>
  <button class="btn secondary" id="randBtn">随机生成</button>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<main>
  <section class="card">
    <svg id="graph" viewBox="0 0 640 440" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="tlegend">
      <span><i class="dot" style="background:#00ff9c"></i>已在生成树中</span>
      <span><i class="dot" style="background:#ff2bd6"></i>当前处理</span>
      <span style="color:var(--yellow)">点旁数字 = key(树到该点最短边权)</span>
      <span><i class="bar" style="background:#4ea3ff"></i>正在松弛的边</span>
      <span><i class="bar" style="background:#00ff9c"></i>已选入树的边</span>
      <span><i class="bar" style="background:#ff5555"></i>被丢弃的边(成环)</span>
    </div>
  </section>
  <section class="card">
    <div class="stats">
      已选边：<b id="edgeCount">0</b>
      <span>总权值：<b id="weightSum">0</b></span>
    </div>
    <div class="plabel" id="listLabel">已选入树的边</div>
    <div class="elist" id="treeEdges"></div>
    <div class="plabel" id="auxLabel">候选边（按权排序）</div>
    <div class="elist" id="auxBox"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note" id="note"></div>

<script>
const $ = id => document.getElementById(id);

let algo = "prim";
let NODES = {}, EDGES = [];       // EDGES: {u,v,w,id}
let steps = [], idx = 0, timer = null, running = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function circleLayout(n) {
  const nodes = {}, cx = 320, cy = 210, R = 165;
  for (let i = 0; i < n; i++) { const ang = -Math.PI / 2 + 2 * Math.PI * i / n; nodes[i] = { x: Math.round(cx + R * Math.cos(ang)), y: Math.round(cy + R * Math.sin(ang)) }; }
  return nodes;
}

// 随机连通带权无向图
function randomGraph() {
  const n = 5 + Math.floor(Math.random() * 3);   // 5~7
  const nodes = circleLayout(n);
  const edges = [], seen = new Set();
  const addE = (u, v) => {
    const key = Math.min(u, v) + "-" + Math.max(u, v);
    if (u === v || seen.has(key)) return;
    seen.add(key); edges.push({ u, v, w: 1 + Math.floor(Math.random() * 9) });
  };
  const order = shuffle([...Array(n).keys()]);
  for (let k = 1; k < n; k++) addE(order[k], order[Math.floor(Math.random() * k)]);  // 生成树保证连通
  const extra = n + Math.floor(Math.random() * n);
  for (let e = 0; e < extra; e++) addE(Math.floor(Math.random() * n), Math.floor(Math.random() * n));
  edges.forEach((e, i) => e.id = i);
  return { nodes, edges };
}

function edgeLabel(e) { return `${e.u}-${e.v}(${e.w})`; }

// ---------- Prim（key 数组版）：每个树外顶点维护 key = 树到它的最小边权 ----------
// 每轮：选 key 最小的树外顶点入树，再用它松弛邻居的 key。
function genPrim() {
  const n = Object.keys(NODES).length;
  const INF = Infinity;
  const inTree = Array(n).fill(false);
  const key = Array(n).fill(INF);     // 树到各顶点的当前最短边权
  const keyEdge = Array(n).fill(-1);  // 达成该 key 的边 id
  const treeEdges = [];
  let total = 0;
  const out = [];
  // 每步都带上 key 快照，供节点旁标注
  const snap = (o) => out.push(Object.assign({
    inTree: [...inTree], key: [...key], treeEdges: [...treeEdges],
    candEid: -1, rejectEid: -1, relaxEid: -1, cur: -1, total, aux: [], algo: "prim"
  }, o));
  // 邻接
  const adj = {}; for (let i = 0; i < n; i++) adj[i] = [];
  EDGES.forEach(({ u, v, w, id }) => { adj[u].push({ to: v, w, id }); adj[v].push({ to: u, w, id }); });

  key[0] = 0;
  snap({ desc: `Prim：初始化 key[]（树到各点的最短边权），起点 0 的 key=0，其余为 ∞。` });

  for (let cnt = 0; cnt < n; cnt++) {
    // 选 key 最小的树外顶点
    let u = -1, best = INF;
    for (let i = 0; i < n; i++) if (!inTree[i] && key[i] < best) { best = key[i]; u = i; }
    if (u === -1) break;
    inTree[u] = true;
    if (keyEdge[u] >= 0) { treeEdges.push(keyEdge[u]); total += key[u]; }
    snap({ cur: u, candEid: keyEdge[u], desc: keyEdge[u] >= 0
      ? `在树外顶点里选 key 最小的 ${u}（key=${key[u]}），经边 ${edgeLabel(EDGES[keyEdge[u]])} 并入树。树权值和=${total}。`
      : `选起点 ${u} 加入生成树。` });
    // 用 u 松弛树外邻居
    for (const { to: v, w, id } of adj[u]) {
      if (inTree[v]) continue;
      const before = key[v] === INF ? "∞" : key[v];
      if (w < key[v]) {
        key[v] = w; keyEdge[v] = id;
        snap({ cur: u, relaxEid: id, desc: `松弛顶点 ${v}：经 ${u} 只需权 ${w} < 原 key(${before})，更新 key[${v}]=${w}。` });
      } else {
        snap({ cur: u, relaxEid: id, desc: `检查顶点 ${v}：经 ${u} 的边权 ${w} ≥ 原 key(${before})，key[${v}] 不变。` });
      }
    }
  }
  snap({ desc: `完成！最小生成树含 ${treeEdges.length} 条边，总权值 = ${total}。` });
  return out;
}

// ---------- Kruskal：所有边按权升序，用并查集判环，不成环则选 ----------
function genKruskal() {
  const n = Object.keys(NODES).length;
  const parent = [...Array(n).keys()];
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const groups = () => {
    const g = {};
    for (let i = 0; i < n; i++) { const r = find(i); (g[r] = g[r] || []).push(i); }
    return Object.values(g).map(a => "{" + a.join(",") + "}");
  };
  const treeEdges = [], rejected = [];
  let total = 0;
  const sorted = [...EDGES].sort((a, b) => a.w - b.w);
  const out = [];
  const snap = (o) => out.push(Object.assign({
    inTree: Array(n).fill(true), treeEdges: [...treeEdges], candEid: -1, rejectEid: -1, cur: -1, total,
    dsu: groups(), aux: [], algo: "kruskal"
  }, o));
  // 辅助：候选边列表带状态
  const auxList = (curId, curCls) => sorted.map(e => {
    let cls = treeEdges.includes(e.id) ? "tree" : rejected.includes(e.id) ? "reject" : "";
    if (e.id === curId) cls = curCls;
    return { label: edgeLabel(e), cls };
  });

  snap({ desc: `Kruskal：把所有 ${EDGES.length} 条边按权值升序排列，初始每个顶点自成一个集合。`, aux: auxList(-1, "") });

  for (const e of sorted) {
    const ru = find(e.u), rv = find(e.v);
    if (ru !== rv) {
      snap({ candEid: e.id, desc: `考察 ${edgeLabel(e)}：端点 ${e.u}、${e.v} 属于不同集合，不成环 → 选入。`, aux: auxList(e.id, "cand") });
      parent[ru] = rv; treeEdges.push(e.id); total += e.w;
      snap({ desc: `合并两个集合，当前树权值和 = ${total}。`, aux: auxList(e.id, "tree") });
    } else {
      snap({ rejectEid: e.id, desc: `考察 ${edgeLabel(e)}：端点 ${e.u}、${e.v} 已在同一集合，选它会成环 → 丢弃。`, aux: auxList(e.id, "reject") });
      rejected.push(e.id);
    }
    if (treeEdges.length === n - 1) break;   // 已够 n-1 条
  }
  snap({ desc: `完成！最小生成树含 ${treeEdges.length} 条边，总权值 = ${total}。`, aux: auxList(-1, "") });
  return out;
}

// ---------- SVG ----------
function buildSVG() {
  const svg = $("graph"), R = 22;
  const pairCount = {}, pairSeen = {};
  EDGES.forEach(({ u, v }) => { const k = Math.min(u, v) + "-" + Math.max(u, v); pairCount[k] = (pairCount[k] || 0) + 1; });
  let edgesSvg = "", labels = "";
  EDGES.forEach(({ u, v, w, id }) => {
    const a = NODES[u], b = NODES[v];
    const lo = Math.min(u, v), hi = Math.max(u, v), key = lo + "-" + hi;
    const total = pairCount[key], seen = (pairSeen[key] = (pairSeen[key] || 0) + 1);
    const offIdx = seen - 1 - (total - 1) / 2, curve = offIdx * 36;
    const pa = NODES[lo], pb = NODES[hi], ndx = pb.x - pa.x, ndy = pb.y - pa.y, nlen = Math.hypot(ndx, ndy) || 1;
    const nx = -ndy / nlen, ny = ndx / nlen, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const cxp = mx + nx * curve, cyp = my + ny * curve;
    const da = Math.hypot(cxp - a.x, cyp - a.y) || 1, db = Math.hypot(cxp - b.x, cyp - b.y) || 1;
    const ax = a.x + (cxp - a.x) / da * R, ay = a.y + (cyp - a.y) / da * R;
    const bx = b.x + (cxp - b.x) / db * R, by = b.y + (cyp - b.y) / db * R;
    edgesSvg += `<path class="edge" id="e-${id}" d="M ${ax} ${ay} Q ${cxp} ${cyp} ${bx} ${by}"/>`;
    const lx = 0.25 * ax + 0.5 * cxp + 0.25 * bx, ly = 0.25 * ay + 0.5 * cyp + 0.25 * by;
    labels += `<rect class="ew-bg" x="${lx - 9}" y="${ly - 9}" width="18" height="16" rx="3"/><text class="ew" x="${lx}" y="${ly + 3}" text-anchor="middle">${w}</text>`;
  });
  let nodesSvg = "";
  for (const k in NODES) { const nd = NODES[k]; nodesSvg += `<g class="gnode" id="node-${k}"><circle cx="${nd.x}" cy="${nd.y}" r="${R}"/><text class="lbl" x="${nd.x}" y="${nd.y+5}" text-anchor="middle">${k}</text><text class="keylbl" id="key-${k}" x="${nd.x}" y="${nd.y-27}" text-anchor="middle"></text></g>`; }
  svg.innerHTML = edgesSvg + labels + nodesSvg;
}

// ---------- 绘制某步 ----------
function draw(k) {
  const s = steps[k];
  const n = Object.keys(NODES).length;
  document.querySelectorAll(".edge").forEach(e => e.classList.remove("cand", "tree", "reject", "relax"));
  s.treeEdges.forEach(eid => { const e = $("e-" + eid); if (e) e.classList.add("tree"); });
  if (s.candEid >= 0) { const e = $("e-" + s.candEid); if (e) { e.classList.remove("tree"); e.classList.add("cand"); } }
  if (s.rejectEid >= 0) { const e = $("e-" + s.rejectEid); if (e) e.classList.add("reject"); }
  if (s.relaxEid >= 0) { const e = $("e-" + s.relaxEid); if (e && !e.classList.contains("tree")) e.classList.add("relax"); }
  // Prim：在每个顶点旁标注 key（树到它的最短边权）
  for (let i = 0; i < n; i++) {
    const kl = $("key-" + i);
    if (!kl) continue;
    if (s.algo === "prim" && s.key) {
      const kv = s.key[i];
      kl.textContent = s.inTree[i] ? "" : (kv === Infinity ? "∞" : kv);
    } else kl.textContent = "";
  }
  // 节点
  document.querySelectorAll(".gnode").forEach(g => g.className.baseVal = "gnode");
  if (algo === "prim") {
    for (let i = 0; i < n; i++) if (s.inTree[i]) $("node-" + i).classList.add("intree");
    if (s.cur >= 0) { const c = $("node-" + s.cur); c.classList.remove("intree"); c.classList.add("cur"); }
  } else {
    // Kruskal：树边端点视为已连接（着绿），当前候选边端点高亮
    const inSel = new Set();
    s.treeEdges.forEach(eid => { const e = EDGES.find(x => x.id === eid); inSel.add(e.u); inSel.add(e.v); });
    inSel.forEach(i => $("node-" + i).classList.add("intree"));
    [s.candEid, s.rejectEid].forEach(eid => { if (eid >= 0) { const e = EDGES.find(x => x.id === eid); [e.u, e.v].forEach(v => { const c = $("node-" + v); c.classList.remove("intree"); c.classList.add("cur"); }); } });
  }
  // 已选边列表
  $("treeEdges").innerHTML = s.treeEdges.length
    ? s.treeEdges.map(eid => { const e = EDGES.find(x => x.id === eid); return `<span class="echip tree">${edgeLabel(e)}</span>`; }).join("")
    : '<span style="color:var(--muted);font-family:monospace">（暂无）</span>';
  // 辅助区：Prim=候选横跨边；Kruskal=排序后的边 + 并查集
  if (algo === "prim") {
    $("auxLabel").textContent = "候选横跨边（一端在树内一端在外）";
    $("auxBox").innerHTML = s.aux.length ? s.aux.map(a => `<span class="echip ${a.cls}">${a.label}</span>`).join("") : '<span style="color:var(--muted);font-family:monospace">（无）</span>';
  } else {
    $("auxLabel").textContent = "所有边（按权升序）+ 并查集集合";
    const edgesHtml = s.aux.map(a => `<span class="echip ${a.cls}">${a.label}</span>`).join("");
    const dsuHtml = `<div class="dsu" style="margin-top:8px">${(s.dsu || []).map(g => `<span class="grp">${g}</span>`).join("")}</div>`;
    $("auxBox").innerHTML = edgesHtml + dsuHtml;
  }
  $("edgeCount").textContent = s.treeEdges.length;
  $("weightSum").textContent = s.total;
  $("status").textContent = s.desc;
}

// ---------- 单步引擎 ----------
function applyStep(i) { draw(i); }
function stepOnce() { if (idx < steps.length - 1) { idx++; applyStep(idx); if (idx >= steps.length - 1) endRun(); return true; } return false; }
function endRun() { stopTimer(); }
function play() { stopTimer(); const spd = 1550 - parseInt($("speedInput").value, 10); timer = setInterval(() => { if (!stepOnce()) stopTimer(); }, spd); }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function prepare() { steps = algo === "prim" ? genPrim() : genKruskal(); idx = 0; draw(0); }

function applyAlgo(a) {
  algo = a; stopTimer();
  document.querySelectorAll(".subtab").forEach(s => s.classList.toggle("active", s.dataset.algo === a));
  $("subtitle").textContent = a === "prim"
    ? "Prim（加点）：从一个点出发，每次把“连接树与树外、权值最小”的边及其顶点并入树，直到覆盖所有点。"
    : "Kruskal（加边）：把所有边按权升序，用并查集判断是否成环，不成环就选入，直到凑齐 n-1 条边。";
  $("note").innerHTML = a === "prim"
    ? "Prim 适合稠密图。核心：维护“树内顶点集合”，反复挑选一条<code>横跨边</code>（恰好一端在集合内）中权最小的，把新顶点纳入。"
    : "Kruskal 适合稀疏图。核心：边按权<code>从小到大</code>依次考虑，用<code>并查集</code>判断两端是否已连通——连通则跳过(避免成环)，否则选入并合并集合。";
  $("listLabel").textContent = "已选入树的边";
  prepare();
}

document.querySelectorAll(".subtab").forEach(s => s.onclick = () => applyAlgo(s.dataset.algo));
$("playBtn").onclick = () => { if (idx >= steps.length - 1) prepare(); play(); };
$("stepBtn").onclick = () => { stopTimer(); stepOnce(); };
$("resetBtn").onclick = () => { stopTimer(); prepare(); };
$("randBtn").onclick = () => { stopTimer(); const g = randomGraph(); NODES = g.nodes; EDGES = g.edges; buildSVG(); prepare(); };

// 初始化：先生成图再渲染
(function init() { const g = randomGraph(); NODES = g.nodes; EDGES = g.edges; buildSVG(); applyAlgo("prim"); })();
</script>

CppView.register({
  prim: { title: "最小生成树 Prim 算法（加点，key 数组）— C++", code:
`// 功能：带权连通无向图的最小生成树(MST) —— Prim 算法。
//       从顶点 0 出发，维护 key[v]=树到 v 的最小边权；每轮选出树外
//       key 最小的顶点并入树，再用它松弛邻居的 key，直到所有点入树。
// 输入：第一行 n m —— n 个点(编号 0~n-1)、m 条无向边；
//       接下来 m 行，每行 u v w 表示 u—v 间有一条权值 w 的无向边。
// 输出：一个整数，最小生成树的总权值(图连通时)。
#include <iostream>
#include <vector>
#include <queue>
using namespace std;

const int INF = 1e9;
int n, m;
vector<pair<int,int>> adj[100005];   // adj[u] = {邻居 v, 边权 w}

int main() {
    cin >> n >> m;
    for (int i = 0; i < m; i++) {
        int u, v, w; cin >> u >> v >> w;
        adj[u].push_back({v, w});    // 无向边两个方向都加
        adj[v].push_back({u, w});
    }

    vector<int> key(n, INF);         // 树到各点的当前最短边权
    vector<bool> inTree(n, false);   // 该点是否已并入生成树
    // 小根堆存 {key 值, 顶点}，每次取 key 最小的树外顶点
    priority_queue<pair<int,int>, vector<pair<int,int>>,
                   greater<pair<int,int>>> pq;
    key[0] = 0;
    pq.push({0, 0});                 // 从顶点 0 开始
    long long total = 0;             // MST 总权值
    int cnt = 0;                     // 已并入的顶点数

    while (!pq.empty()) {
        auto [d, u] = pq.top(); pq.pop();
        if (inTree[u]) continue;     // 已在树中(懒删除)
        inTree[u] = true;            // 并入生成树
        total += d;                  // 累加接入它的那条边权
        cnt++;
        for (auto [v, w] : adj[u]) { // 用 u 松弛树外邻居的 key
            if (!inTree[v] && w < key[v]) {
                key[v] = w;          // 找到更小的接入边权
                pq.push({w, v});
            }
        }
    }

    if (cnt < n) cout << "图不连通" << endl;   // 未能覆盖所有点
    else cout << total << endl;
    return 0;
}` },
  kruskal: { title: "最小生成树 Kruskal 算法（加边 + 并查集）— C++", code:
`// 功能：带权连通无向图的最小生成树(MST) —— Kruskal 算法。
//       把所有边按权升序排序，依次考虑：用并查集判断两端是否已连通，
//       未连通则选入并合并集合(否则会成环)，直到选够 n-1 条边。
// 输入：第一行 n m —— n 个点(编号 0~n-1)、m 条无向边；
//       接下来 m 行，每行 u v w 表示 u—v 间有一条权值 w 的无向边。
// 输出：一个整数，最小生成树的总权值(图连通时)。
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

int n, m;
int parent[100005];   // 并查集：parent[x] 为 x 的父节点

int find(int x) {                    // 查(带路径压缩)
    while (parent[x] != x) x = parent[x] = parent[parent[x]];
    return x;
}

struct Edge { int u, v, w; };

int main() {
    cin >> n >> m;
    vector<Edge> edges(m);
    for (int i = 0; i < m; i++)
        cin >> edges[i].u >> edges[i].v >> edges[i].w;

    // 所有边按权值从小到大排序
    sort(edges.begin(), edges.end(),
         [](const Edge& a, const Edge& b) { return a.w < b.w; });

    for (int i = 0; i < n; i++) parent[i] = i;   // 初始每点自成一个集合
    long long total = 0;             // MST 总权值
    int cnt = 0;                     // 已选边数

    for (const auto& e : edges) {
        int ru = find(e.u), rv = find(e.v);
        if (ru != rv) {              // 两端不连通 → 选这条边不会成环
            parent[ru] = rv;         // 合并两个集合
            total += e.w;
            cnt++;
            if (cnt == n - 1) break; // 已选够 n-1 条边，MST 完成
        }
        // 否则两端已连通，选它会成环，丢弃
    }

    if (cnt < n - 1) cout << "图不连通" << endl;   // 边不够 → 不连通
    else cout << total << endl;
    return 0;
}` },
});
document.getElementById("cppBtn").onclick = () => CppView.open(algo);
