<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维数点 // CYBER</title>
<style>
  :root {
    --bg: #07060f; --panel: rgba(18, 15, 38, 0.72); --border: #2a2350;
    --text: #e6e1ff; --muted: #7d76a8; --cyan: #00f0ff; --magenta: #ff2bd6;
    --yellow: #ffd400; --green: #00ff9c; --grid: rgba(0, 240, 255, 0.06);
    --node-fill: #16213e;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); line-height: 1.55;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.14), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(0,240,255,0.14), transparent 45%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 34px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 34px 100%,
      var(--bg);
    min-height: 100vh;
  }
  header { padding: 26px 30px 6px; }
  header h1 {
    margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--cyan), 0 0 20px rgba(0,240,255,.5), 3px 0 var(--magenta);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .5px; }
  .back {
    display: inline-block; margin: 14px 30px 0; padding: 6px 16px;
    border: 1px solid var(--border); border-radius: 4px; text-decoration: none;
    color: var(--cyan); font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .back:hover { border-color: var(--cyan); background: rgba(0,240,255,.08); box-shadow: 0 0 12px rgba(0,240,255,.3); }
  .tabs { display: flex; gap: 10px; padding: 14px 30px 0; flex-wrap: wrap; }
  .tabs.sub { padding-top: 8px; }
  .tab {
    padding: 9px 18px; border: 1px solid var(--border); border-radius: 999px;
    background: rgba(0,240,255,0.05); color: var(--cyan); font-size: 13.5px;
    cursor: pointer; font-family: "SF Mono", Menlo, monospace; transition: all .18s;
  }
  .tab.sub { padding: 6px 14px; font-size: 12.5px; background: rgba(160,107,255,0.06); color: #c9b3ff; }
  .tab:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.35); }
  .tab.active { background: var(--cyan); color: #05060f; border-color: var(--cyan); font-weight: 700; box-shadow: 0 0 12px rgba(0,240,255,.5); }
  .tab.sub.active { background: #a06bff; color: #05060f; border-color: #a06bff; box-shadow: 0 0 10px rgba(160,107,255,.5); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px 30px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .field input {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 13px; background: rgba(5,4,15,0.8); color: var(--text); font-family: "SF Mono", Menlo, monospace;
  }
  .field input.wide { width: 300px; }
  .field input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.4); }
  .speed { display: flex; flex-direction: column; gap: 5px; }
  .speed label { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; }
  .speed input { width: 110px; accent-color: var(--magenta); }
  .btn {
    padding: 9px 15px; border: 1px solid var(--magenta); border-radius: 4px;
    background: rgba(255,43,214,0.12); color: var(--magenta); font-size: 13px;
    letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
    font-family: "SF Mono", Menlo, monospace; transition: all .18s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--magenta); color: #05060f; box-shadow: 0 0 16px rgba(255,43,214,.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.cy { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,.08); }
  .btn.cy:hover:not(:disabled) { background: var(--cyan); color: #05060f; box-shadow: 0 0 16px rgba(0,240,255,.6); }
  .btn.secondary { border-color: var(--border); color: var(--muted); background: rgba(255,255,255,0.02); }
  .btn.secondary:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  main { padding: 10px 30px 20px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 22px;
    backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(0,240,255,.05), 0 8px 40px rgba(0,0,0,.5);
    overflow-x: auto;
  }
  .rowlabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 8px; }
  .rowlabel.mt { margin-top: 16px; }
  svg.plane { width: 100%; height: auto; display: block; }
  .axis { stroke: var(--border); stroke-width: 1.5; }
  .alabel { fill: var(--muted); font-family: "SF Mono", Menlo, monospace; font-size: 10px; }
  /* 待统计的点：一律青色系（空心→已插入实心→计入当前 S 高亮），与查询顶点区分开 */
  .pt { fill: var(--node-fill); stroke: var(--cyan); stroke-width: 1.5; transition: all .2s; }
  .pt.inserted { fill: rgba(0,240,255,0.35); stroke: var(--cyan); }
  .pt.counted { fill: var(--cyan); stroke: var(--cyan); filter: drop-shadow(0 0 6px rgba(0,240,255,.85)); }
  .pt.cur { fill: var(--yellow); stroke: var(--yellow); filter: drop-shadow(0 0 7px rgba(255,212,0,.8)); }
  .qbox { fill: rgba(255,43,214,0.10); stroke: var(--magenta); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .qbox.dim { fill: rgba(255,43,214,0.03); stroke: rgba(255,43,214,0.4); stroke-width: 1; }
  .qdot { fill: var(--magenta); }
  /* 前缀原语 S(a,b) 覆盖的 (0,0)→(a,b) 区域 */
  .prefbox.plus { fill: rgba(0,255,156,0.14); stroke: var(--green); stroke-width: 1.5; }
  .prefbox.minus { fill: rgba(255,43,214,0.14); stroke: var(--magenta); stroke-width: 1.5; }
  /* 查询矩形的四个角（查询顶点）*/
  .corner.plus { fill: var(--green); }
  .corner.minus { fill: var(--magenta); }
  .corner.cur { stroke: var(--yellow); stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(255,212,0,.9)); }
  .corner.fresh { stroke: #fff; stroke-width: 2; }
  .cornlbl { font-family: "SF Mono", Menlo, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
  .cornlbl.plus { fill: var(--green); }
  .cornlbl.minus { fill: var(--magenta); }
  .sweep { stroke: var(--yellow); stroke-width: 2; stroke-dasharray: 5 4; opacity: .85; }
  .sweepcur { fill: var(--yellow); stroke: #120e00; stroke-width: 1; filter: drop-shadow(0 0 6px rgba(255,212,0,.9)); }
  .ptxt { fill: var(--text); font-family: "SF Mono", Menlo, monospace; font-size: 9px; text-anchor: middle; }
  /* 平面图例：区分「待统计的点」与「查询顶点」两类 */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 10px; font-family: "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--muted); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 13px; height: 13px; flex: 0 0 auto; }
  .legend .swatch.pt { border-radius: 50%; background: rgba(0,240,255,0.35); border: 1.5px solid var(--cyan); }
  .legend .swatch.plus { background: var(--green); transform: rotate(45deg); }
  .legend .swatch.minus { background: var(--magenta); transform: rotate(45deg); }
  svg.ds { width: 100%; height: auto; display: block; }
  .dsedge { stroke: var(--border); stroke-width: 1.2; }
  .dsedge.path { stroke: var(--magenta); stroke-width: 2.4; }
  .dsbg { fill: var(--bg); }
  .dsbox { fill: var(--node-fill); stroke: var(--border); stroke-width: 1.2; transition: all .18s; }
  g.cur .dsbox { fill: var(--yellow); stroke: var(--yellow); }
  g.path .dsbox { fill: rgba(255,43,214,0.25); stroke: var(--magenta); }
  g.acc .dsbox { fill: rgba(0,255,156,0.25); stroke: var(--green); }
  .dsv { fill: var(--text); font-family: "SF Mono", Menlo, monospace; font-weight: 700; font-size: 13px; text-anchor: middle; }
  g.cur .dsv { fill: #120e00; }
  g.acc .dsv { fill: var(--green); }
  .dslbl { fill: var(--muted); font-family: "SF Mono", Menlo, monospace; font-size: 9px; text-anchor: middle; }
  /* ans[] 累计答案数组 */
  .ansarr { display: flex; gap: 9px; flex-wrap: wrap; margin: 6px 0 4px; font-family: "SF Mono", Menlo, monospace; }
  .anscell { min-width: 48px; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px 6px; text-align: center; background: var(--node-fill); position: relative; transition: all .18s; }
  .anscell .idx { font-size: 9px; color: var(--muted); display: block; letter-spacing: .5px; }
  .anscell .val { font-size: 16px; font-weight: 700; color: var(--text); }
  .anscell.cur { background: var(--yellow); box-shadow: 0 0 12px rgba(255,212,0,.55); border-color: var(--yellow); }
  .anscell.cur .val, .anscell.cur .idx { color: #120e00; }
  .anscell.done .val { color: var(--green); }
  .anscell .delta { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .anscell .delta.plus { color: var(--green); text-shadow: 0 0 6px rgba(0,255,156,.5); }
  .anscell .delta.minus { color: var(--magenta); text-shadow: 0 0 6px rgba(255,43,214,.5); }
  /* 二维前缀和矩阵 */
  table.psmat { border-collapse: collapse; font-family: "SF Mono", Menlo, monospace; font-size: 12px; margin: 0 auto; }
  table.psmat td, table.psmat th { border: 1px solid var(--border); width: 34px; height: 30px; text-align: center; }
  table.psmat th { color: var(--cyan); background: rgba(0,240,255,0.05); font-size: 10px; }
  table.psmat td.cell { background: var(--node-fill); transition: all .15s; }
  table.psmat td.cur { background: var(--yellow); color: #120e00; box-shadow: 0 0 8px rgba(255,212,0,.6) inset; }
  table.psmat td.plus { background: rgba(0,255,156,0.25); color: var(--green); }   /* 容斥 +项 */
  table.psmat td.minus { background: rgba(255,43,214,0.22); color: #ff8ad0; }        /* 容斥 −项 */
  .plabel { font-size: 12px; color: var(--cyan); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 8px; }
  .formula {
    background: rgba(3,2,12,0.85); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: #8fb8c9; margin: 0 0 12px; line-height: 1.7;
  }
  .formula b { color: var(--yellow); }
  .vars { display: flex; gap: 14px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; margin-bottom: 6px; flex-wrap: wrap; }
  .vars b { color: var(--green); }
  .status { margin-top: 6px; font-size: 13.5px; min-height: 60px; color: var(--text); font-family: "SF Mono", Menlo, monospace; line-height: 1.6; }
  .hl { color: var(--green); font-weight: 700; }
  .qtable { font-family: "SF Mono", Menlo, monospace; font-size: 12px; margin-top: 8px; border-collapse: collapse; }
  .qtable td, .qtable th { border: 1px solid var(--border); padding: 3px 9px; text-align: center; }
  .qtable th { color: var(--cyan); }
  .qtable tr.done td { color: var(--green); }
  .note { padding: 6px 30px 30px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }
  .note code { color: var(--cyan); }
</style>
</head>
<body>
<header>
  <h1>二维数点 · 二维偏序</h1>
  <p id="subtitle">统一核心原语 S(a,b)=满足 x≤a,y≤b 的点数。任意矩形 = S(x₂,y₂)−S(x₁−1,y₂)−S(x₂,y₁−1)+S(x₁−1,y₁−1)（系数 +1,−1,−1,+1）。三种解法算的都是 S(a,b)。</p>
</header>
<a class="back" href="../index.html">← 返回门户</a>

<div class="tabs" id="methodTabs">
  <div class="tab active" data-m="prefix">① 二维前缀和：预处理 S(a,b) 表</div>
  <div class="tab" data-m="scanPref">② 扫描线 · 单次 S(X,Y)</div>
  <div class="tab" data-m="scanRect">③ 扫描线 · 4 次 S(a,b) 容斥</div>
</div>
<div class="tabs sub" id="dsTabs" style="display:none">
  <span style="color:var(--muted);font-size:12px;font-family:monospace;align-self:center">数据结构：</span>
  <div class="tab sub active" data-ds="bit">树状数组</div>
  <div class="tab sub" data-ds="seg">线段树</div>
</div>

<div class="controls">
  <div class="field"><label>点集 (x,y; 分号分隔)</label><input id="ptInput" class="wide" type="text" value="1,3; 2,1; 3,4; 4,2; 5,5; 6,3"></div>
  <div class="field" id="qField"><label id="qLabel">查询矩形 (x1,y1,x2,y2; 分号分隔)</label><input id="qInput" class="wide" type="text" value="1,1,3,4; 2,2,6,5"></div>
  <button class="btn cy" id="runBtn">开始</button>
  <button class="btn" id="playBtn" disabled>自动播放</button>
  <button class="btn secondary" id="stepBtn" disabled>单步 ▶</button>
  <button class="btn secondary" id="randBtn">随机</button>
  <div class="speed"><label for="speedInput">速度</label><input id="speedInput" type="range" min="80" max="900" value="480" step="40"></div>
  <button class="cppview-btn" id="cppBtn">查看 C++ 代码</button>
</div>

<main>
  <section class="card">
    <div class="rowlabel" id="planeLabel">平面</div>
    <div class="legend" id="legend" style="display:none"></div>
    <svg id="plane" class="plane" viewBox="0 0 420 420" preserveAspectRatio="xMidYMid meet"></svg>
  </section>
  <section class="card">
    <div class="rowlabel" id="rightLabel">数据结构</div>
    <div id="rightView"></div>
    <div class="rowlabel mt" id="ansLabel" style="display:none">累计答案 ans[]</div>
    <div id="ansView"></div>
    <div class="plabel">算法</div>
    <div class="formula" id="formula"></div>
    <div class="vars" id="vars"></div>
    <div id="qtableWrap"></div>
    <div class="status" id="status"></div>
  </section>
</main>
<div class="note" id="note"></div>

<script src="../assets/cppview.js"></script>
<script>
const $ = id => document.getElementById(id);
let method = "prefix";    // prefix / scanPref / scanRect
let dsKind = "bit";
let steps = [], idx = 0, timer = null, running = false;
let PTS = [], QS = [], MX = 1, MY = 1;   // QS 元素：prefix=[X,Y]；scanRect=[x1,y1,x2,y2]
function setStatus(t) { $("status").innerHTML = t; }
function lowbit(x) { return x & (-x); }

// ===================== 分步生成 =====================
// 通用 step 字段：desc, vars, ansIdx(当前查询下标), sweepX,
//   plane 高亮：insertedPts[], countedPts[], curPt, qRect:[x1,y1,x2,y2], qRectSub(容斥子矩形数组)
//   ds 状态：bit[] / seg[]，dsPath[], dsAcc[]
//   前缀和：ps(矩阵), psMark(单元格高亮 {r,c,cls})

// —— 解法① 二维前缀和 ——
function genPrefix() {
  const list = [];
  // 网格计数 g[x][y]（1..MX × 1..MY）
  const g = Array.from({ length: MX + 1 }, () => new Array(MY + 1).fill(0));
  PTS.forEach(([x, y]) => { g[x][y]++; });
  const ps = Array.from({ length: MX + 1 }, () => new Array(MY + 1).fill(0));
  const clonePS = () => ps.map(r => [...r]);
  list.push({ mode: "prefix", ps: clonePS(), psMark: {}, ans: QS.map(() => null),
    desc: `核心原语 <b>S(a,b)=</b> 满足 <b>x≤a 且 y≤b</b> 的点数。先在网格里数每格点数 g[x][y]，再递推 <b>S(i,j)=g[i][j]+S(i−1,j)+S(i,j−1)−S(i−1,j−1)</b>，一次预处理整张 S 表。`, vars: {} });
  // 逐格递推
  for (let i = 1; i <= MX; i++) for (let j = 1; j <= MY; j++) {
    ps[i][j] = g[i][j] + ps[i - 1][j] + ps[i][j - 1] - ps[i - 1][j - 1];
    list.push({ mode: "prefix", ps: clonePS(), psMark: { cur: [i, j] }, ans: QS.map(() => null),
      desc: `S(${i},${j}) = g[${i}][${j}](${g[i][j]}) + S(${i - 1},${j}) + S(${i},${j - 1}) − S(${i - 1},${j - 1}) = <b>${ps[i][j]}</b>。`, vars: { i, j } });
  }
  // 逐个查询：一次矩形 = 4 次 S(a,b) 查表，系数 +1,−1,−1,+1
  const ans = QS.map(() => 0);
  QS.forEach(([x1, y1, x2, y2], qi) => {
    const val = ps[x2][y2] - ps[x1 - 1][y2] - ps[x2][y1 - 1] + ps[x1 - 1][y1 - 1];
    ans[qi] = val;
    list.push({ mode: "prefix", ps: clonePS(), ans: [...ans], curQ: qi,
      qRect: [x1, y1, x2, y2],
      psMark: { plus: [[x2, y2], [x1 - 1, y1 - 1]], minus: [[x1 - 1, y2], [x2, y1 - 1]] },
      desc: `矩形 [${x1},${x2}]×[${y1},${y2}] 拆成 4 次 S(a,b) 查表（表中 <span style="color:var(--green)">绿=＋</span>、<span style="color:#ff8ad0">粉=−</span>）：<br><b>＋S(${x2},${y2}) − S(${x1 - 1},${y2}) − S(${x2},${y1 - 1}) ＋ S(${x1 - 1},${y1 - 1})</b><br>= ${ps[x2][y2]} − ${ps[x1 - 1][y2]} − ${ps[x2][y1 - 1]} + ${ps[x1 - 1][y1 - 1]} = <span class="hl">${val}</span>。`,
      vars: { 答案: val } });
  });
  list.push({ mode: "prefix", ps: clonePS(), ans: [...ans], psMark: {}, done: true, desc: `<span class="hl">完成！</span>各查询答案见下表。整张 S 表 O(MX·MY) 预处理，每次矩形查询只需 4 次查表 O(1)，适合小值域。`, vars: {} });
  return list;
}

// —— 解法②③ 共用：扫描线 + BIT/线段树，统一原语 S(a,b)=#{x≤a 且 y≤b} ——
// 扫到点 (x,y) 时把 y 插入结构（计数 +1）；扫到查询事件 x=a 时对结构做前缀查询 query(b)，
// 此刻结构里正好是 x≤a 的点，query(b) 即 S(a,b)。
// mode: scanPref（每查询就是一次 S(X,Y)）/ scanRect（每矩形拆 4 次 S(a,b)，系数 +1,−1,−1,+1）
function genScan(mode) {
  const list = [];
  const M = MY;
  const ev = [];
  PTS.forEach((p, pi) => ev.push({ x: p[0], type: 0, y: p[1], pi }));
  if (mode === "scanPref") {
    // 前缀矩形 (0,0)→(X,Y)：答案就是单个 S(X,Y)
    QS.forEach(([X, Y], qi) => ev.push({ x: X, type: 1, b: Y, qi, sign: 1, term: 0 }));
  } else {
    // 任意矩形 [x1,x2]×[y1,y2] = S(x2,y2) − S(x1−1,y2) − S(x2,y1−1) + S(x1−1,y1−1)
    QS.forEach(([x1, y1, x2, y2], qi) => {
      ev.push({ x: x2,     type: 1, b: y2,     qi, sign: +1, term: 0 }); // +S(x2, y2)
      ev.push({ x: x1 - 1, type: 1, b: y2,     qi, sign: -1, term: 1 }); // −S(x1−1, y2)
      ev.push({ x: x2,     type: 1, b: y1 - 1, qi, sign: -1, term: 2 }); // −S(x2, y1−1)
      ev.push({ x: x1 - 1, type: 1, b: y1 - 1, qi, sign: +1, term: 3 }); // +S(x1−1, y1−1)
    });
  }
  const ky = e => e.type === 0 ? e.y : e.b;    // 排序副键：点用 y，查询顶点用 b
  ev.sort((a, b) => a.x - b.x || ky(a) - ky(b) || a.type - b.type);  // x 升序 → y 升序 → 同位置点先于查询
  const ans = new Array(QS.length).fill(mode === "scanRect" ? 0 : null);
  const inserted = new Set();
  let bit = new Array(M + 1).fill(0);
  let seg = new Array(4 * M).fill(0);
  const snapDS = () => dsKind === "bit" ? { bit: [...bit] } : { seg: [...seg] };
  // 累积已在平面上显示的角（分解阶段逐步揭示，扫描阶段全程保留）
  const shownCorners = [];
  const base = (extra) => Object.assign({ mode, insertedPts: [...inserted], ans: [...ans], corners: shownCorners.map(c => [...c]) }, snapDS(), extra);

  // ===== 阶段一：分解（仅 scanRect）——每个矩形容斥拆成 4 个角，标注 ±S，随后隐去矩形 =====
  const TERMSTR = ["+S(x₂,y₂)", "−S(x₁−1,y₂)", "−S(x₂,y₁−1)", "+S(x₁−1,y₁−1)"];
  if (mode === "scanRect") {
    list.push(base({ sweepX: -1, dsPath: [], dsAcc: [], desc: `<b>阶段一：容斥分解。</b>逐个把待查询矩形 [x₁,x₂]×[y₁,y₂] 拆成 4 个角：<br><b>ans = ＋S(x₂,y₂) − S(x₁−1,y₂) − S(x₂,y₁−1) ＋ S(x₁−1,y₁−1)</b>，<br>标注每个角是 +S 还是 −S，随后把矩形隐去，只保留 4 个角（菱形◆，与青色圆点区分）。`, vars: {} }));
    QS.forEach(([x1, y1, x2, y2], qi) => {
      const four = [[x2, y2, 1, qi, 0], [x1 - 1, y2, -1, qi, 1], [x2, y1 - 1, -1, qi, 2], [x1 - 1, y1 - 1, 1, qi, 3]];
      four.forEach((c, ci) => {
        shownCorners.push(c);
        list.push(base({ sweepX: -1, dsPath: [], dsAcc: [], showRect: qi, newCorner: { qi, term: c[4] },
          desc: `矩形 #${qi + 1} [${x1},${x2}]×[${y1},${y2}] 拆出第 ${ci + 1}/4 个角 <b>${TERMSTR[c[4]]}</b> → 位置 (${c[0]}, ${c[1]})。`, vars: {} }));
      });
      list.push(base({ sweepX: -1, dsPath: [], dsAcc: [], desc: `矩形 #${qi + 1} 分解完成：4 个角 <b>＋S(${x2},${y2}) − S(${x1 - 1},${y2}) − S(${x2},${y1 - 1}) ＋ S(${x1 - 1},${y1 - 1})</b>。矩形隐去，保留这 4 个角。`, vars: {} }));
    });
    list.push(base({ sweepX: -1, dsPath: [], dsAcc: [], desc: `全部矩形分解完毕，平面上是所有矩形的角（共 ${shownCorners.length} 个）。<b>阶段二：扫描线</b>从左到右推进，同一竖线自下而上依次处理点与角。`, vars: {} }));
  } else {
    list.push(base({ sweepX: -1, dsPath: [], dsAcc: [], desc: `扫描线<b>从左到右</b>推进；同一竖线<b>按 y 升序（自下而上）</b>依次处理。<b>待统计的点</b> → 树状数组单点 +1；<b>查询顶点 (X,Y)</b> → query(Y) 统计 (0,0)→(X,Y) 内点数，即 <b>S(X,Y)</b> 写入 ans[]。`, vars: {} }));
  }

  // BIT/线段树 前缀查询 query(b)= 计数 y≤b（即 S(a,b)，a 由扫描线位置隐含）
  const bitAdd = y => { const path = []; for (let i = y; i <= M; i += lowbit(i)) { bit[i]++; path.push(i); } return path; };
  const bitQ = (b, accArr) => { let s = 0; for (let i = b; i > 0; i -= lowbit(i)) { s += bit[i]; accArr.push(i); } return s; };
  const segAdd = y => { const path = []; (function rec(node, lo, hi) { path.push(node); if (lo === hi) return; const mid = (lo + hi) >> 1; if (y <= mid) rec(node * 2, lo, mid); else rec(node * 2 + 1, mid + 1, hi); })(1, 1, M); (function upd(node, lo, hi) { seg[node]++; if (lo === hi) return; const mid = (lo + hi) >> 1; if (y <= mid) upd(node * 2, lo, mid); else upd(node * 2 + 1, mid + 1, hi); })(1, 1, M); return path; };
  const segQ = (ql, qr, accArr) => { let s = 0; if (qr < ql) return 0; (function rec(node, lo, hi) { if (qr < ql || ql > hi || qr < lo) return; if (ql <= lo && hi <= qr) { accArr.push(node); s += seg[node]; return; } const mid = (lo + hi) >> 1; rec(node * 2, lo, mid); rec(node * 2 + 1, mid + 1, hi); })(1, 1, M); return s; };
  // 统一前缀原语：a<0 或 b<1 时 S(a,b)=0（空区域），不查结构
  const prefixS = (a, b, accArr) => (a < 0 || b < 1) ? 0 : (dsKind === "bit" ? bitQ(b, accArr) : segQ(1, b, accArr));

  for (const e of ev) {
    if (e.type === 0) {
      const y = e.y;
      list.push(base({ sweepX: e.x, sweepY: y, curPt: e.pi, dsPath: [], dsAcc: [], desc: `扫描到点 (${e.x}, ${y})（当前列自下而上处理到 y=${y}）：这是待统计的点，把 y=${y} 插入树状数组（计数 +1）。`, vars: { x: e.x, y } }));
      const path = dsKind === "bit" ? bitAdd(y) : segAdd(y);
      inserted.add(e.pi);
      list.push(base({ sweepX: e.x, sweepY: y, curPt: e.pi, dsPath: path, dsAcc: [], desc: `插入 y=${y} 完成（${dsKind === "bit" ? "沿 i+=lowbit 向上跳更新" : "根到叶路径各区间 +1"}）。`, vars: { y } }));
    } else {
      const acc = [];
      const a = e.x, b = e.b;
      const cnt = prefixS(a, b, acc);
      if (mode === "scanPref") {
        ans[e.qi] = cnt;
        // scanPref 无分解阶段：查询顶点在遇到时揭示
        if (!shownCorners.some(c => c[3] === e.qi && c[4] === 0)) shownCorners.push([a, b, 1, e.qi, 0]);
        const countedPts = []; PTS.forEach((p, pi) => { if (inserted.has(pi) && p[1] <= b) countedPts.push(pi); });
        list.push(base({ sweepX: e.x, sweepY: b, curQ: e.qi, prefRect: [a, b], prefSign: 1, corner: { qi: e.qi, term: 0 }, countedPts, dsAcc: acc, dsPath: [], ansMark: { qi: e.qi, sign: 1, delta: cnt, set: true }, desc: `查询顶点 (${a}, ${b})：结构里是 x≤${a} 的点，求 <b>y ≤ ${b}</b> 的个数，即 <b>S(${a},${b})</b> = <span class="hl">${cnt}</span>。写入 <b>ans[${e.qi}]</b>。`, vars: { a, b, "S(a,b)": cnt } }));
      } else {
        ans[e.qi] += e.sign * cnt;
        const empty = (a < 0 || b < 1);
        const countedPts = []; if (!empty) PTS.forEach((p, pi) => { if (p[0] <= a && p[1] <= b) countedPts.push(pi); });
        list.push(base({ sweepX: e.x < 0 ? -1 : e.x, sweepY: b, curQ: e.qi, prefRect: empty ? null : [a, b], prefSign: e.sign, corner: { qi: e.qi, term: e.term }, countedPts, dsAcc: acc, dsPath: [], ansMark: { qi: e.qi, sign: e.sign, delta: empty ? 0 : cnt },
          desc: `扫描线 x=${a}、当前列处理到 y=${b}：遇到矩形 #${e.qi + 1} 的角 <b>${TERMSTR[e.term]}</b>（第 ${e.term + 1}/4 项）。统计 (0,0)→(${a},${b}) 内待统计点数 ${empty ? `（a&lt;0 或 b&lt;1，空区域）= <b>0</b>` : `query(${b})=<b>${cnt}</b>`}，按 <b>${e.sign > 0 ? "＋" : "−"}</b> 更新 ans[${e.qi}]。当前累计 = <span class="hl">${ans[e.qi]}</span>。`,
          vars: { 项: TERMSTR[e.term], "S(a,b)": empty ? 0 : cnt, 本次: (e.sign > 0 ? "+" : "−") + (empty ? 0 : cnt), 累计: ans[e.qi] } }));
      }
    }
  }
  list.push(base({ sweepX: 999, dsPath: [], dsAcc: [], done: true, desc: `<span class="hl">全部处理完毕！</span>各查询答案见下表。${mode === "scanRect" ? "每个矩形都由 4 次前缀 S(a,b) 容斥而来。" : ""}`, vars: {} }));
  return list;
}

// ===================== 渲染 =====================
function drawPlane(s) {
  const W = 420, pad = 34;
  const mx = Math.max(MX, 1), my = Math.max(MY, 1);
  const sx = x => pad + (x / (mx + 1)) * (W - 2 * pad);
  const sy = y => (W - pad) - (y / (my + 1)) * (W - 2 * pad);
  let g = "";
  g += `<line class="axis" x1="${pad}" y1="${W - pad}" x2="${W - 12}" y2="${W - pad}"/>`;
  g += `<line class="axis" x1="${pad}" y1="${W - pad}" x2="${pad}" y2="12"/>`;
  g += `<text class="alabel" x="${W - 16}" y="${W - pad + 14}">x</text><text class="alabel" x="${pad - 16}" y="18">y</text>`;
  // 把某个查询映射成矩形 [x1,y1,x2,y2]（前缀模式 [X,Y] → [1,1,X,Y]）
  const toRect = q => method === "scanPref" ? [1, 1, q[0], q[1]] : [q[0], q[1], q[2], q[3]];
  const rectSvg = (r, cls) => {
    const [x1, y1, x2, y2] = r;
    const X1 = sx(x1 <= 0 ? 0 : x1), X2 = sx(x2), Y1 = sy(y1 <= 0 ? 0 : y1), Y2 = sy(y2);
    return `<rect class="${cls}" x="${Math.min(X1, X2)}" y="${Math.min(Y1, Y2)}" width="${Math.abs(X2 - X1)}" height="${Math.abs(Y1 - Y2)}"/>`;
  };
  // 先画前缀原语 S(a,b) 覆盖区 (0,0)→(a,b)，衬在最底层
  if (s.prefRect) {
    const [a, b] = s.prefRect;
    g += rectSvg([0, 0, a, b], "prefbox " + (s.prefSign > 0 ? "plus" : "minus"));
  }
  if (method === "scanRect") {
    // scanRect：仅「分解阶段」显示正在拆分的矩形；扫描阶段矩形隐去，只留四个角
    if (s.showRect != null && QS[s.showRect]) g += rectSvg(QS[s.showRect], "qbox");
  } else {
    // prefix / scanPref：画出所有查询矩形（淡框），当前查询用高亮框
    QS.forEach((q, qi) => { if (qi !== s.curQ) g += rectSvg(toRect(q), "qbox dim"); });
    if (s.curQ != null && QS[s.curQ]) g += rectSvg(toRect(QS[s.curQ]), "qbox");
  }
  if (s.sweepX >= 0 && s.sweepX <= mx) {
    g += `<line class="sweep" x1="${sx(s.sweepX)}" y1="12" x2="${sx(s.sweepX)}" y2="${W - pad}"/>`;
    // 列内 y 升序处理的游标：沿扫描线上下移动
    if (s.sweepY != null) {
      const cy = sy(s.sweepY <= 0 ? 0 : s.sweepY);
      g += `<circle class="sweepcur" cx="${sx(s.sweepX)}" cy="${cy}" r="4.5"/>`;
    }
  }
  PTS.forEach((p, pi) => {
    let cls = "pt";
    if (s.insertedPts && s.insertedPts.includes(pi)) cls += " inserted";
    if (s.countedPts && s.countedPts.includes(pi)) cls += " counted";
    if (s.curPt === pi) cls += " cur";
    g += `<circle class="${cls}" cx="${sx(p[0])}" cy="${sy(p[1])}" r="6"/>`;
    g += `<text class="ptxt" x="${sx(p[0])}" y="${sy(p[1]) - 9}">${p[0]},${p[1]}</text>`;
  });
  // 查询顶点(角)：菱形，正项绿/负项粉；当前处理的角描黄边，刚拆出的角脉冲高亮
  if (s.corners) {
    s.corners.forEach(([a, b, sign, qi, term]) => {
      const cx = sx(a <= 0 ? 0 : a), cy = sy(b <= 0 ? 0 : b), r = 5.5;
      const sc = sign > 0 ? "plus" : "minus";
      const isCur = s.corner && s.corner.qi === qi && s.corner.term === term;
      const isNew = s.newCorner && s.newCorner.qi === qi && s.newCorner.term === term;
      g += `<polygon class="corner ${sc}${isCur ? " cur" : ""}${isNew ? " fresh" : ""}" points="${cx},${cy - r} ${cx + r},${cy} ${cx},${cy + r} ${cx - r},${cy}"/>`;
      g += `<text class="cornlbl ${sc}" x="${cx}" y="${cy + r + 12}">${sign > 0 ? "+" : "−"}S(${a},${b})</text>`;
    });
  }
  $("plane").innerHTML = g;
}

// 前缀和矩阵（含 0 行 0 列）
function drawPSMat(s) {
  const ps = s.ps;
  let h = `<table class="psmat"><tr><th>S(a,b)</th>`;
  for (let j = 0; j <= MY; j++) h += `<th>${j}</th>`;
  h += `</tr>`;
  for (let i = 0; i <= MX; i++) {
    h += `<tr><th>${i}</th>`;
    for (let j = 0; j <= MY; j++) {
      let cls = "cell";
      const m = s.psMark || {};
      if (m.cur && m.cur[0] === i && m.cur[1] === j) cls += " cur";
      if (m.plus && m.plus.some(([a, b]) => a === i && b === j)) cls += " plus";
      if (m.minus && m.minus.some(([a, b]) => a === i && b === j)) cls += " minus";
      h += `<td class="${cls}">${ps[i][j]}</td>`;
    }
    h += `</tr>`;
  }
  h += `</table>`;
  $("rightView").innerHTML = h;
}

// 数据结构（BIT 数组 / 线段树），复用 fenwick/线段树风格
function drawDS(s) {
  const M = MY;
  if (dsKind === "bit") {
    const bit = s.bit || [];
    const colW = Math.max(38, Math.min(56, 440 / M)), pad = 14, boxH = 38, y = 38;
    const W = pad * 2 + M * colW, H = y + boxH + 28;
    let g = "";
    for (let i = 1; i <= M; i++) {
      const x = pad + (i - 0.5) * colW;
      let cls = "";
      if (s.dsAcc && s.dsAcc.includes(i)) cls = "acc";
      if (s.dsPath && s.dsPath.includes(i)) cls = "path";
      const cov = [i - lowbit(i) + 1, i];
      g += `<g class="${cls}"><rect class="dsbg" x="${x - colW / 2 + 4}" y="${y}" width="${colW - 8}" height="${boxH}" rx="5"/><rect class="dsbox" x="${x - colW / 2 + 4}" y="${y}" width="${colW - 8}" height="${boxH}" rx="5"/><text class="dsv" x="${x}" y="${y + boxH / 2 + 4}">${bit[i]}</text><text class="dslbl" x="${x}" y="${y - 6}">c${i}</text><text class="dslbl" x="${x}" y="${y + boxH + 12}">[${cov[0]},${cov[1]}]</text></g>`;
    }
    $("rightView").innerHTML = `<svg class="ds" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">${g}</svg>`;
  } else {
    const seg = s.seg || [];
    const depth = Math.ceil(Math.log2(M)) + 1;
    const W = Math.max(460, (1 << (depth - 1)) * 46), pad = 20, rowH = 50, H = pad * 2 + depth * rowH;
    const nodes = [], xOf = {}, yOf = {}; let leafX = 0;
    (function assign(node, lo, hi, lvl) { yOf[node] = pad + lvl * rowH + 14; nodes.push({ node, lo, hi }); if (lo === hi) { xOf[node] = pad + (leafX + 0.5) * ((W - 2 * pad) / M); leafX++; return; } const mid = (lo + hi) >> 1; assign(node * 2, lo, mid, lvl + 1); assign(node * 2 + 1, mid + 1, hi, lvl + 1); xOf[node] = (xOf[node * 2] + xOf[node * 2 + 1]) / 2; })(1, 1, M, 0);
    let edges = "", boxes = ""; const bw = 40, bh = 28;
    for (const nd of nodes) if (nd.lo !== nd.hi) for (const ch of [nd.node * 2, nd.node * 2 + 1]) {
      const hot = s.dsPath && s.dsPath.includes(nd.node) && s.dsPath.includes(ch);
      edges += `<line class="dsedge${hot ? " path" : ""}" x1="${xOf[nd.node]}" y1="${yOf[nd.node] + bh / 2}" x2="${xOf[ch]}" y2="${yOf[ch] - bh / 2}"/>`;
    }
    for (const nd of nodes) {
      let cls = "";
      if (s.dsAcc && s.dsAcc.includes(nd.node)) cls = "acc";
      if (s.dsPath && s.dsPath.includes(nd.node)) cls = "path";
      const x = xOf[nd.node], yy = yOf[nd.node];
      boxes += `<g class="${cls}"><rect class="dsbg" x="${x - bw / 2}" y="${yy - bh / 2}" width="${bw}" height="${bh}" rx="4"/><rect class="dsbox" x="${x - bw / 2}" y="${yy - bh / 2}" width="${bw}" height="${bh}" rx="4"/><text class="dsv" x="${x}" y="${yy + 4}">${seg[nd.node] || 0}</text><text class="dslbl" x="${x}" y="${yy - bh / 2 - 3}">[${nd.lo},${nd.hi}]</text></g>`;
    }
    $("rightView").innerHTML = `<svg class="ds" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet">${edges + boxes}</svg>`;
  }
}

function drawQTable(s) {
  if (!QS.length) { $("qtableWrap").innerHTML = ""; return; }
  const head = method === "scanPref" ? "查询 (X,Y)" : "查询矩形 (x1,y1,x2,y2)";
  let h = `<table class="qtable"><tr><th>${head}</th><th>答案</th></tr>`;
  QS.forEach((q, qi) => {
    const done = s.ans && s.ans[qi] != null;
    const label = method === "scanPref" ? `(${q[0]}, ${q[1]})` : `(${q[0]},${q[1]})–(${q[2]},${q[3]})`;
    h += `<tr class="${done && (method !== "scanRect" || s.done) ? "done" : ""}"><td>${label}</td><td>${done ? s.ans[qi] : "—"}</td></tr>`;
  });
  h += `</table>`;
  $("qtableWrap").innerHTML = h;
}

// ans[] 累计答案数组（仅扫描线两种解法显示）
function drawAnsArray(s) {
  if (method === "prefix" || !QS.length) { $("ansView").innerHTML = ""; return; }
  const m = s.ansMark;
  let h = `<div class="ansarr">`;
  QS.forEach((q, qi) => {
    const v = s.ans ? s.ans[qi] : null;
    const active = m && m.qi === qi;
    let cls = "anscell";
    if (active) cls += " cur";
    if (s.done && v != null) cls += " done";
    let delta = "";
    if (active) {
      const d = m.delta;
      delta = m.set
        ? `<span class="delta plus">←${d}</span>`
        : `<span class="delta ${m.sign > 0 ? "plus" : "minus"}">${m.sign > 0 ? "+" : "−"}${d}</span>`;
    }
    h += `<div class="${cls}">${delta}<span class="idx">ans[${qi}]</span><span class="val">${v == null ? "—" : v}</span></div>`;
  });
  h += `</div>`;
  $("ansView").innerHTML = h;
}

function draw(k) {
  const s = steps[k];
  if (method === "prefix") { drawPlaneMaybe(s); drawPSMat(s); }
  else { drawPlane(s); drawDS(s); }
  drawAnsArray(s);
  drawQTable(s);
  const v = s.vars || {};
  $("vars").innerHTML = Object.entries(v).map(([kk, vv]) => `${kk} = <b>${vv}</b>`).join("　");
  setStatus(s.desc);
}
// 前缀和模式也画平面（散点 + 查询矩形）
function drawPlaneMaybe(s) { drawPlane(s); }

// ===================== 引擎 =====================
function load(list) {
  steps = list; idx = 0; running = true;
  $("stepBtn").disabled = false; $("playBtn").disabled = false;
  draw(0);
  if (steps.length <= 1) endRun();
}
function stepOnce() { if (!running) return; if (idx < steps.length - 1) { idx++; draw(idx); } if (idx >= steps.length - 1) endRun(); }
function endRun() { running = false; stopTimer(); $("stepBtn").disabled = true; $("playBtn").disabled = true; }
function playAll() { stopTimer(); const spd = 980 - parseInt($("speedInput").value, 10); timer = setInterval(() => { if (idx < steps.length - 1) { idx++; draw(idx); } else endRun(); }, spd); }
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

function parsePts(str) {
  return (str || "").split(/[;；]/).map(s => s.trim()).filter(Boolean).map(s => {
    const p = s.split(/[,，\s]+/).map(x => parseInt(x, 10));
    return (p.length >= 2 && p.every(v => !isNaN(v))) ? p : null;
  }).filter(Boolean);
}
function prepare() {
  stopTimer(); running = false;
  PTS = parsePts($("ptInput").value).map(p => [p[0], p[1]]).slice(0, 12);
  const raw = parsePts($("qInput").value);
  if (method === "scanPref") QS = raw.map(q => [q[0], q[1]]).slice(0, 8);
  else QS = raw.filter(q => q.length >= 4).map(q => {
    let [x1, y1, x2, y2] = q; if (x1 > x2)[x1, x2] = [x2, x1]; if (y1 > y2)[y1, y2] = [y2, y1]; return [x1, y1, x2, y2];
  }).slice(0, 6);
  if (!PTS.length) { setStatus("请输入点集。"); return; }
  MX = Math.max(...PTS.map(p => p[0]), 1);
  MY = Math.max(...PTS.map(p => p[1]), 1);
  if (method === "scanPref") { MX = Math.max(MX, ...QS.map(q => q[0])); MY = Math.max(MY, ...QS.map(q => q[1])); }
  else if (method === "prefix" || method === "scanRect") { QS.forEach(q => { MX = Math.max(MX, q[2]); MY = Math.max(MY, q[3]); }); }
  load(method === "prefix" ? genPrefix() : genScan(method));
}

function applyMethod(m) {
  method = m;
  document.querySelectorAll("#methodTabs .tab").forEach(t => t.classList.toggle("active", t.dataset.m === m));
  $("dsTabs").style.display = (m === "prefix") ? "none" : "flex";
  $("ansLabel").style.display = (m === "prefix") ? "none" : "block";
  // 图例：仅扫描线解法显示，区分两类点
  if (m === "prefix") { $("legend").style.display = "none"; }
  else {
    $("legend").style.display = "flex";
    const ptItem = `<span class="item"><span class="swatch pt"></span>待统计的点（树状数组 +1）</span>`;
    $("legend").innerHTML = m === "scanRect"
      ? ptItem + `<span class="item"><span class="swatch plus"></span>◆ 查询顶点 +S(x₂,y₂)、+S(x₁−1,y₁−1)</span><span class="item"><span class="swatch minus"></span>◆ 查询顶点 −S(x₁−1,y₂)、−S(x₂,y₁−1)</span>`
      : ptItem + `<span class="item"><span class="swatch plus"></span>◆ 查询顶点 S(X,Y)</span>`;
  }
  $("rightLabel").textContent = m === "prefix" ? "二维前缀和表 S(a,b)" : (dsKind === "bit" ? "y 维数据结构：树状数组 c[]" : "y 维数据结构：线段树");
  $("planeLabel").textContent = m === "scanPref" ? "平面（黄线=扫描线，黄点=列内 y 游标，青=已插入，绿=计入 S 区域）" : (m === "scanRect" ? "平面（黄线=扫描线，黄点=列内 y 游标，◆=4 个角/绿加粉减，绿/粉填充=当前 S(a,b) 区域）" : "平面（点集 + 粉框=查询矩形）");
  // 输入提示与默认值
  if (m === "scanPref") { $("qLabel").textContent = "查询前缀 (X,Y; 分号分隔)"; $("qInput").value = "3,3; 5,2; 6,5"; }
  else { $("qLabel").textContent = "查询矩形 (x1,y1,x2,y2; 分号分隔)"; $("qInput").value = "1,1,3,4; 2,2,6,5"; }
  $("formula").innerHTML = FORMULA[m];
  $("note").innerHTML = NOTE[m];
  prepare();
}

document.querySelectorAll("#methodTabs .tab").forEach(t => t.onclick = () => applyMethod(t.dataset.m));
document.querySelectorAll("#dsTabs .tab").forEach(t => t.onclick = () => {
  dsKind = t.dataset.ds;
  document.querySelectorAll("#dsTabs .tab").forEach(x => x.classList.toggle("active", x.dataset.ds === dsKind));
  $("rightLabel").textContent = dsKind === "bit" ? "y 维数据结构：树状数组 c[]" : "y 维数据结构：线段树";
  prepare();
});
$("runBtn").onclick = prepare;
$("playBtn").onclick = () => { if (idx >= steps.length - 1) prepare(); playAll(); };
$("stepBtn").onclick = () => { stopTimer(); stepOnce(); };
$("randBtn").onclick = () => {
  const n = 6 + Math.floor(Math.random() * 3), mx = 6, my = 6;
  PTS = [...Array(n)].map(() => `${1 + Math.floor(Math.random() * mx)},${1 + Math.floor(Math.random() * my)}`);
  $("ptInput").value = PTS.join("; ");
  if (method === "scanPref") $("qInput").value = [...Array(3)].map(() => `${1 + Math.floor(Math.random() * mx)},${1 + Math.floor(Math.random() * my)}`).join("; ");
  else $("qInput").value = [...Array(2)].map(() => { let a = 1 + Math.floor(Math.random() * mx), b = 1 + Math.floor(Math.random() * mx), c = 1 + Math.floor(Math.random() * my), d = 1 + Math.floor(Math.random() * my); if (a > b)[a, b] = [b, a]; if (c > d)[c, d] = [d, c]; return `${a},${c},${b},${d}`; }).join("; ");
  prepare();
};
$("cppBtn").onclick = () => CppView.open(method === "prefix" ? "p2d_prefix" : (method === "scanPref" ? (dsKind === "bit" ? "p2d_bit" : "p2d_seg") : (dsKind === "bit" ? "p2d_rect_bit" : "p2d_rect_seg")));

const FORMULA = {
  prefix: `核心原语 <b>S(a,b)</b> = 满足 <b>x≤a 且 y≤b</b> 的点数。<br>递推：<b>S(i,j)=g[i][j]+S(i−1,j)+S(i,j−1)−S(i−1,j−1)</b><br>任意矩形 [x1,x2]×[y1,y2]（容斥）：<br><b>S(x₂,y₂) − S(x₁−1,y₂) − S(x₂,y₁−1) + S(x₁−1,y₁−1)</b><br>系数 <b>+1,−1,−1,+1</b>。整表预处理 O(MX·MY)，每次查询 4 次查表 O(1)，适合<b>小值域</b>。`,
  scanPref: `同一原语 <b>S(a,b)</b>，改成离线求。事件按 x 升序(点先于查询)。<br>遇点 (x,y)：<b>update(y)</b> 计数 +1。<br>遇查询 (X,Y)：此刻 x≤X，<b>query(Y)</b> 求 y≤Y 前缀计数，即 <b>S(X,Y)</b>。<br>单次 O(log M)，答的正是 (0,0)→(X,Y) 前缀矩形。`,
  scanRect: `任意矩形 = <b>4 次 S(a,b)</b> 容斥：<br><b>ans = S(x₂,y₂) − S(x₁−1,y₂) − S(x₂,y₁−1) + S(x₁−1,y₁−1)</b><br>把每个矩形拆成 4 个查询事件，落在 x=x₂ / x=x₁−1，带系数 <b>+1,−1,−1,+1</b>。<br>数据结构只需支持前缀查询 <b>query(b)</b>，单次 O(log M)。`,
};
const NOTE = {
  prefix: `核心原语 <code>S(a,b)</code>=满足 x≤a,y≤b 的点数。先把点落到网格计数 g[x][y]，递推出整张 S 表（含 0 行 0 列作边界）。任意矩形查询把它拆成 <code>4 次 S(a,b)</code> 查表（系数 +1,−1,−1,+1）——大矩形减去左、下两条，再加回多减的左下角。仅适合<code>值域较小</code>（否则表太大）。`,
  scanPref: `离线求 <code>S(a,b)</code>：点和查询按 <code>x</code> 升序（同 x 点先于查询）。扫到点插入其 y，扫到查询 (X,Y) 时结构里正好是 x≤X 的点，求 <code>y≤Y</code> 前缀计数即 <code>S(X,Y)</code>。树状数组 / 线段树均 O(log n)。这里查询恰好是前缀矩形，一次 S 就够。`,
  scanRect: `任意矩形拆成 <code>4 次前缀 S(a,b)</code>：<code>ans = S(x₂,y₂) − S(x₁−1,y₂) − S(x₂,y₁−1) + S(x₁−1,y₁−1)</code>。每次 S(a,b) 是一个查询事件（落在 x=a，带系数），扫描线扫到时结构里正好是 x≤a 的点，<code>query(b)</code> 即得。数据结构只需前缀查询，不必支持区间查询。`,
};
$("formula").innerHTML = FORMULA.prefix;
$("note").innerHTML = NOTE.prefix;

CppView.register({
  p2d_prefix: { title: "二维数点 · 二维前缀和(小值域) — C++", code:
[
"// 二维前缀和：g[x][y]=该格点数；sum 为二维前缀和。",
"// 矩形 [x1,x2]x[y1,y2] 内点数 = 容斥(下式)。预处理 O(MX*MY)，查询 O(1)。",
"#include <iostream>",
"using namespace std;",
"const int N = 1005;",
"int g[N][N], sum[N][N];",
"int main(){",
"    int MX, MY, n; cin >> MX >> MY >> n;",

"    for(int i=1;i<=MX;i++)",
"        for(int j=1;j<=MY;j++)",
"            sum[i][j]=g[i][j]+sum[i-1][j]+sum[i][j-1]-sum[i-1][j-1];",
"    int q; cin >> q;",

"// 离线扫描 + 树状数组，求 (0,0)->(X,Y) 前缀矩形内点数(x<=X 且 y<=Y)。",
"#include <iostream>",
"#include <algorithm>",
"#include <vector>",
"using namespace std;",
"const int MAXM=100005; int c[MAXM], M;",
"int lowbit(int x){return x&(-x);}",

"// 离线扫描 + 线段树(单点+1、区间[1,Y]求和)，求前缀矩形点数。",
"#include <iostream>",
"#include <algorithm>",
"#include <vector>",
"using namespace std;",
"const int MAXM=100005; int t[MAXM*4], M;",
"void upd(int nd,int lo,int hi,int p){ t[nd]++; if(lo==hi)return; int m=(lo+hi)/2; p<=m?upd(nd*2,lo,m,p):upd(nd*2+1,m+1,hi,p); }",
"int qry(int nd,int lo,int hi,int l,int r){ if(r<l||l>hi||r<lo)return 0; if(l<=lo&&hi<=r)return t[nd]; int m=(lo+hi)/2; return qry(nd*2,lo,m,l,r)+qry(nd*2+1,m+1,hi,l,r); }",
"struct Ev{int x,type,y,qi;};",
"int main(){",
"    int n,q; cin>>n>>q>>M; vector<Ev> ev;",

"    for(auto&e:ev){ if(e.type==0) upd(1,1,M,e.y); else ans[e.qi]=qry(1,1,M,1,e.y); }",

"    return 0;",
"}",
].join("\n") },
  p2d_rect_bit: { title: "二维数点 · 任意矩形(树状数组, 4次前缀 S(a,b)) — C++", code:
[
"// 核心原语 S(a,b) = 满足 x<=a 且 y<=b 的点数。任意矩形 [x1,x2]x[y1,y2] 内点数 = 容斥：",
"//   ans = S(x2,y2) - S(x1-1,y2) - S(x2,y1-1) + S(x1-1,y1-1)   系数 +1,-1,-1,+1",
"// 把每个矩形拆成 4 个查询事件，离线按 x 升序扫描；扫到 x=a 时结构里正好是 x<=a 的点，",
"// 前缀查询 query(b) 即得 S(a,b)。数据结构只需支持前缀查询，不必支持区间查询。",
"#include <iostream>",
"#include <algorithm>",
"#include <vector>",
"using namespace std;",
"const int MAXM=100005; int c[MAXM], M;   // 树状数组，M = y 值域",
"int lowbit(int x){ return x & (-x); }",
"void update(int i){ for(; i<=M; i+=lowbit(i)) c[i]++; }",
"int query(int b){ int s=0; for(; b>0; b-=lowbit(b)) s+=c[b]; return s; }  // 计数 y<=b",
"",
"struct Ev { int x, type, b, sign, qi; };   // type0=加点(b=y); type1=查询 S(x,b)",
"int main(){",
"    int n, q; cin >> n >> q >> M; vector<Ev> ev;",
"    for(int i=0;i<n;i++){ int x,y; cin>>x>>y; ev.push_back({x, 0, y, 0, 0}); }",
"    for(int i=0;i<q;i++){                       // 一个矩形拆 4 次 S(a,b)",
"        int x1,y1,x2,y2; cin>>x1>>y1>>x2>>y2;",
"        ev.push_back({x2,   1, y2,   +1, i});   // +S(x2, y2)",
"        ev.push_back({x1-1, 1, y2,   -1, i});   // -S(x1-1, y2)",
"        ev.push_back({x2,   1, y1-1, -1, i});   // -S(x2, y1-1)",
"        ev.push_back({x1-1, 1, y1-1, +1, i});   // +S(x1-1, y1-1)",
"    }",
"    // 按 x 升序 -> y(即 b) 升序 -> 同位置加点(type0)先于查询(type1)",
"    sort(ev.begin(),ev.end(),[](const Ev&p,const Ev&r){ return p.x!=r.x?p.x<r.x:(p.b!=r.b?p.b<r.b:p.type<r.type); });",
"    vector<long long> ans(q, 0);",
"    for(auto& e : ev){",
"        if(e.type == 0) update(e.b);",
"        else if(e.x >= 0 && e.b >= 1)          // a<0 或 b<1 时空区域 S=0，跳过",
"            ans[e.qi] += (long long)e.sign * query(e.b);",
"    }",
"    for(int i=0;i<q;i++) cout << ans[i] << endl;",
"    return 0;",
"}",
].join("\n") },
  p2d_rect_seg: { title: "二维数点 · 任意矩形(线段树, 4次前缀 S(a,b)) — C++", code:
[
"// 任意矩形容斥 = 4 次前缀 S(a,b)：ans = S(x2,y2)-S(x1-1,y2)-S(x2,y1-1)+S(x1-1,y1-1)。",
"// 线段树支持单点 +1、前缀 [1,b] 求和(即 query(b))。每矩形拆 4 个查询事件，系数 +1,-1,-1,+1。",
"#include <iostream>",
"#include <algorithm>",
"#include <vector>",
"using namespace std;",
"const int MAXM=100005; int t[MAXM*4], M;",

"int qpre(int nd,int lo,int hi,int r){ if(r<lo)return 0; if(hi<=r)return t[nd]; int m=(lo+hi)/2; return qpre(nd*2,lo,m,r)+qpre(nd*2+1,m+1,hi,r); }",
"int query(int b){ return b>=1 ? qpre(1,1,M,b) : 0; }   // 计数 y<=b, 即 S(a,b)",
"struct Ev{ int x,type,b,sign,qi; };",
"int main(){",
"    int n,q; cin>>n>>q>>M; vector<Ev> ev;",

"        ev.push_back({x1-1, 1, y2,   -1, i});",
"        ev.push_back({x2,   1, y1-1, -1, i});",
"        ev.push_back({x1-1, 1, y1-1, +1, i});",
"    }",
"    // 按 x 升序 -> y(即 b) 升序 -> 同位置加点(type0)先于查询(type1)",
"    sort(ev.begin(),ev.end(),[](const Ev&p,const Ev&r){ return p.x!=r.x?p.x<r.x:(p.b!=r.b?p.b<r.b:p.type<r.type); });",
"    vector<long long> ans(q,0);",
"    for(auto&e:ev){",
"        if(e.type==0) upd(1,1,M,e.b);",
"        else if(e.x>=0) ans[e.qi]+=(long long)e.sign*query(e.b);",
"    }",
"    for(int i=0;i<q;i++) cout<<ans[i]<<endl;",
"    return 0;",
"}",
].join("\n") },
});
