<script>
const $ = id => document.getElementById(id);

/* ── 判定回顾 ──
  无向图（连通）：所有顶点偶度 → 欧拉回路（欧拉图）；恰好 2 个奇度顶点 → 欧拉路径（半欧拉图），起点终点为这两个奇度点。
  有向图（连通）：所有顶点入度=出度 → 欧拉回路；恰好一点出度-入度=1（起点）、一点入度-出度=1（终点），其余相等 → 欧拉路径。
*/

let graphType = "undirected";   // undirected / directed
let NODES = {};                 // id -> {x,y}
let EDGES = [];                 // {u,v,id}  无向: 无序对; 有向: u->v
let steps = [], idx = 0, timer = null;
let curPath = [];               // 顶点序列
let eulerInfo = null;           // { kind, startV, endV, degText }

// ---------- 工具 ----------
function circleLayout(n) {
  const nodes = {}, cx = 320, cy = 210, R = 165;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (2 * Math.PI * i) / n;
    nodes[i] = { x: Math.round(cx + R * Math.cos(ang)), y: Math.round(cy + R * Math.sin(ang)) };
  }
  return nodes;
}
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// ---------- 随机生成（无向） ----------
// 策略：先造连通图（生成树+随机边），再修复奇度顶点：把奇度点两两配对加边。
// wantCircuit=true 目标欧拉回路（全偶度）；false 目标半欧拉（留 2 个奇度点）。
function genUndirected(wantCircuit) {
  const n = 5 + Math.floor(Math.random() * 3);   // 5~7 点
  const nodes = circleLayout(n);
  const edges = [];
  const addE = (u, v) => edges.push({ u, v });
  // 随机生成树保证连通（order[k] 连到前面已加入的某点）
  const order = shuffle([...Array(n).keys()]);
  for (let k = 1; k < n; k++) addE(order[k], order[Math.floor(Math.random() * k)]);
  // 随机加边
  const extra = 1 + Math.floor(Math.random() * n);
  for (let e = 0; e < extra; e++) { const u = Math.floor(Math.random() * n), v = Math.floor(Math.random() * n); if (u !== v) addE(u, v); }
  // 计算度数，找奇度点
  const fixParity = () => {
    const deg = Array(n).fill(0);
    edges.forEach(({ u, v }) => { deg[u]++; deg[v]++; });
    return deg.map((d, i) => [d, i]).filter(([d]) => d % 2 === 1).map(([, i]) => i);
  };
  let odd = fixParity();
  // 把奇度点两两配对加边 → 全部变偶
  for (let i = 0; i + 1 < odd.length; i += 2) addE(odd[i], odd[i + 1]);
  // 此时应为全偶度（欧拉回路）。若要半欧拉，则随机删一条边的“偶性”——加一条边制造正好 2 个奇点
  if (!wantCircuit) {
    let u = Math.floor(Math.random() * n), v = Math.floor(Math.random() * n);
    while (u === v) v = Math.floor(Math.random() * n);
    addE(u, v);   // 使 u,v 变奇度 → 恰好 2 个奇度点
  }
  edges.forEach((e, i) => e.id = i);
  return { nodes, edges };
}

// ---------- 随机生成（有向） ----------
// 先造弱连通有向图，再平衡每个点的 出度-入度：diff>0 的点向 diff<0 的点补边。
function genDirected(wantCircuit) {
  const n = 5 + Math.floor(Math.random() * 3);
  const nodes = circleLayout(n);
  const edges = [];
  const addE = (u, v) => edges.push({ u, v });
  const order = shuffle([...Array(n).keys()]);
  // 有向生成树（父→子），再随机加有向边
  for (let k = 1; k < n; k++) { const p = order[Math.floor(Math.random() * k)]; addE(p, order[k]); }
  const extra = 1 + Math.floor(Math.random() * n);
  for (let e = 0; e < extra; e++) { const u = Math.floor(Math.random() * n), v = Math.floor(Math.random() * n); if (u !== v) addE(u, v); }
  // 平衡入出度：使每点 out==in
  const balance = () => {
    const outd = Array(n).fill(0), ind = Array(n).fill(0);
    edges.forEach(({ u, v }) => { outd[u]++; ind[v]++; });
    return outd.map((o, i) => o - ind[i]);   // diff[i] = out-in
  };
  let diff = balance();
  const pos = [], neg = [];
  diff.forEach((d, i) => { for (let t = 0; t < d; t++) pos.push(i); for (let t = 0; t < -d; t++) neg.push(i); });
  // pos（出多）→ neg（入多）补边，使全部平衡（欧拉回路）
  for (let i = 0; i < pos.length && i < neg.length; i++) addE(neg[i], pos[i]);
  // 半欧拉：额外加一条边制造 start(out-in=+1) 与 end(in-out=+1)
  if (!wantCircuit) {
    let u = Math.floor(Math.random() * n), v = Math.floor(Math.random() * n);
    while (u === v) v = Math.floor(Math.random() * n);
    addE(u, v);
  }
  edges.forEach((e, i) => e.id = i);
  return { nodes, edges };
}

// ---------- 判定欧拉性质 ----------
function analyze() {
  const n = Object.keys(NODES).length;
  if (graphType === "undirected") {
    const deg = Array(n).fill(0);
    EDGES.forEach(({ u, v }) => { deg[u]++; deg[v]++; });
    const odd = deg.map((d, i) => [d, i]).filter(([d]) => d % 2 === 1).map(([, i]) => i);
    const degText = deg.map((d, i) => `${i}:${d}`).join("  ");
    if (odd.length === 0) return { kind: "circuit", startV: firstWithEdge(), odd, degText };
    if (odd.length === 2) return { kind: "path", startV: odd[0], endV: odd[1], odd, degText };
    return { kind: "none", odd, degText };
  } else {
    const outd = Array(n).fill(0), ind = Array(n).fill(0);
    EDGES.forEach(({ u, v }) => { outd[u]++; ind[v]++; });
    const diff = outd.map((o, i) => o - ind[i]);
    const degText = diff.map((d, i) => `${i}:出${outd[i]}入${ind[i]}`).join("  ");
    const plus = diff.map((d, i) => [d, i]).filter(([d]) => d === 1).map(([, i]) => i);
    const minus = diff.map((d, i) => [d, i]).filter(([d]) => d === -1).map(([, i]) => i);
    const others = diff.filter(d => d !== 0 && d !== 1 && d !== -1);
    if (diff.every(d => d === 0)) return { kind: "circuit", startV: firstWithEdge(), degText };
    if (plus.length === 1 && minus.length === 1 && others.length === 0)
      return { kind: "path", startV: plus[0], endV: minus[0], degText };
    return { kind: "none", degText };
  }
}
function firstWithEdge() {
  const used = new Set();
  EDGES.forEach(({ u, v }) => { used.add(u); used.add(v); });
  return used.size ? Math.min(...used) : 0;
}

// ---------- Hierholzer 求欧拉路径/回路，生成分步 ----------
function genEulerSteps(startV) {
  const n = Object.keys(NODES).length;
  const adj = {}; for (let i = 0; i < n; i++) adj[i] = [];
  EDGES.forEach(({ u, v, id }) => {
    if (graphType === "undirected") { adj[u].push({ to: v, eid: id }); adj[v].push({ to: u, eid: id }); }
    else { adj[u].push({ to: v, eid: id }); }
  });
  const usedEdge = new Set();
  const ptr = Array(n).fill(0);
  const stack = [startV];
  const circuit = [];
  while (stack.length) {
    const v = stack[stack.length - 1];
    while (ptr[v] < adj[v].length && usedEdge.has(adj[v][ptr[v]].eid)) ptr[v]++;
    if (ptr[v] < adj[v].length) {
      const e = adj[v][ptr[v]];
      usedEdge.add(e.eid);
      stack.push(e.to);
    } else {
      circuit.push(stack.pop());
    }
  }
  circuit.reverse();

  // 按最终欧拉路径顺序逐边点亮，生成动画步骤
  const steps = [];
  const usedForAnim = new Set();
  const path = [circuit[0]];
  steps.push({ path: [...path], edgeId: -1, cur: circuit[0], desc: `从起点 ${circuit[0]} 出发。` });
  for (let k = 1; k < circuit.length; k++) {
    const a = circuit[k - 1], b = circuit[k];
    let eid = -1;
    for (const e of adj[a]) { if (e.to === b && !usedForAnim.has(e.eid)) { eid = e.eid; break; } }
    usedForAnim.add(eid);
    path.push(b);
    steps.push({ path: [...path], edgeId: eid, cur: b, from: a, to: b,
      desc: `走第 ${k} 条边：${a} ${graphType === "directed" ? "→" : "—"} ${b}，到达顶点 ${b}。` });
  }
  const isCircuit = circuit.length > 1 && circuit[0] === circuit[circuit.length - 1];
  steps.push({ path: [...path], edgeId: -1, cur: circuit[circuit.length - 1], done: true,
    desc: `一笔画完成！共经过 ${EDGES.length} 条边。${isCircuit ? "起点=终点 → 欧拉回路。" : "起点≠终点 → 欧拉路径。"}` });
  return steps;
}

// ---------- SVG 绘制 ----------
// 平行边（同一对顶点多条）用不同弧度区分
function buildSVG() {
  const svg = $("graph");
  const R = 22;
  // 统计每对顶点的边，用于弧度偏移
  const pairCount = {}, pairSeen = {};
  EDGES.forEach(({ u, v }) => { const key = u < v ? u + "-" + v : v + "-" + u; pairCount[key] = (pairCount[key] || 0) + 1; });
  const defs = `<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#6b64a0"/></marker>
    <marker id="arrowUsed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#00ff9c"/></marker>
    <marker id="arrowCur" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#ff2bd6"/></marker>
  </defs>`;
  let edgesSvg = "";
  EDGES.forEach(({ u, v, id }) => {
    const a = NODES[u], b = NODES[v];
    const lo = Math.min(u, v), hi = Math.max(u, v);
    const key = lo + "-" + hi;
    const total = pairCount[key]; const seen = (pairSeen[key] = (pairSeen[key] || 0) + 1);
    // 平行边分散偏移量（同一对顶点的所有边，无论方向，共用一套编号）
    const offIdx = seen - 1 - (total - 1) / 2;
    const curve = offIdx * 36;
    // 规范法向：始终按 lo→hi 计算，与当前边实际方向无关，
    // 这样反向边（u→v 与 v→u）会靠 offIdx 正负分到弧线两侧，而非重叠。
    const pa = NODES[lo], pb = NODES[hi];
    const ndx = pb.x - pa.x, ndy = pb.y - pa.y, nlen = Math.hypot(ndx, ndy) || 1;
    const nx = -ndy / nlen, ny = ndx / nlen;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const cxp = mx + nx * curve, cyp = my + ny * curve;
    // 端点收缩到圆边缘（指向弯曲控制点的方向）
    const da = Math.hypot(cxp - a.x, cyp - a.y) || 1;
    const db = Math.hypot(cxp - b.x, cyp - b.y) || 1;
    const ax = a.x + (cxp - a.x) / da * R, ay = a.y + (cyp - a.y) / da * R;
    const bx = b.x + (cxp - b.x) / db * R, by = b.y + (cyp - b.y) / db * R;
    const d = `M ${ax} ${ay} Q ${cxp} ${cyp} ${bx} ${by}`;
    const marker = graphType === "directed" ? ` marker-end="url(#arrow)"` : "";
    edgesSvg += `<path class="edge" id="e-${id}" d="${d}"${marker}/>`;
  });
  let nodesSvg = "";
  for (const k in NODES) {
    const nd = NODES[k];
    nodesSvg += `<g class="gnode" id="node-${k}"><circle cx="${nd.x}" cy="${nd.y}" r="${R}"/><text class="lbl" x="${nd.x}" y="${nd.y+5}" text-anchor="middle">${k}</text></g>`;
  }
  svg.innerHTML = defs + edgesSvg + nodesSvg;
}

// ---------- 判定面板 ----------
function renderVerdict() {
  const info = eulerInfo;
  const typeName = graphType === "undirected" ? "无向图" : "有向图";
  let html = "";
  if (info.kind === "circuit") {
    html = `<div class="big">欧拉图（存在欧拉回路）</div>` +
      (graphType === "undirected" ? "所有顶点度数均为偶数。" : "所有顶点入度 = 出度。") +
      `<br>可从任意顶点出发，一笔画走遍每条边并回到起点。`;
  } else if (info.kind === "path") {
    html = `<div class="big semi">半欧拉图（存在欧拉路径）</div>` +
      (graphType === "undirected"
        ? `恰好 2 个奇度顶点：<code>${info.startV}</code> 和 <code>${info.endV}</code>，它们是路径起点/终点。`
        : `顶点 <code>${info.startV}</code> 出度-入度=1（起点）、<code>${info.endV}</code> 入度-出度=1（终点）。`) +
      `<br>只能从其中一个奇度点出发一笔画到另一个。`;
  } else {
    html = `<div class="big none">既非欧拉图也非半欧拉图</div>不满足一笔画条件。`;
  }
  html += `<br><span style="color:var(--muted)">${typeName}度数：${info.degText}</span>`;
  $("verdict").innerHTML = html;
}

// ---------- 绘制某一步 ----------
function draw(k) {
  const s = steps[k];
  // 边着色
  document.querySelectorAll(".edge").forEach(e => e.classList.remove("used", "current"));
  const usedEids = new Set();
  for (let t = 1; t <= k; t++) { if (steps[t].edgeId >= 0) usedEids.add(steps[t].edgeId); }
  usedEids.forEach(eid => { const e = $("e-" + eid); if (e) { e.classList.add("used"); if (graphType === "directed") e.setAttribute("marker-end", "url(#arrowUsed)"); } });
  if (s.edgeId >= 0) { const e = $("e-" + s.edgeId); if (e) { e.classList.remove("used"); e.classList.add("current"); if (graphType === "directed") e.setAttribute("marker-end", "url(#arrowCur)"); } }
  // 未走的有向边恢复默认箭头
  EDGES.forEach(({ id }) => { if (!usedEids.has(id) && id !== s.edgeId && graphType === "directed") { const e = $("e-" + id); if (e) e.setAttribute("marker-end", "url(#arrow)"); } });

  // 节点着色
  document.querySelectorAll(".gnode").forEach(g => g.className.baseVal = "gnode");
  if (eulerInfo.kind === "path") {
    const se = $("node-" + eulerInfo.startV); if (se) se.classList.add("start");
    const ee = $("node-" + eulerInfo.endV); if (ee) ee.classList.add("end");
  } else if (eulerInfo.kind === "circuit") {
    const se = $("node-" + steps[0].cur); if (se) se.classList.add("start");
  }
  const cur = $("node-" + s.cur); if (cur) cur.classList.add("cur");

  // 路径序列
  $("path").innerHTML = s.path.map((v, i) =>
    (i ? `<span class="arrow">${graphType === "directed" ? "→" : "—"}</span>` : "") + `<span class="node">${v}</span>`).join("");
  $("usedCount").textContent = usedEids.size;
  $("status").textContent = s.desc;
}

// ---------- 控制 ----------
function prepare() {
  eulerInfo = analyze();
  buildSVG();
  renderVerdict();
  $("totalEdges").textContent = EDGES.length;
  if (eulerInfo.kind === "none") {
    steps = [{ path: [], edgeId: -1, cur: -1, desc: "该图不满足一笔画条件，点击“随机生成”换一个欧拉/半欧拉图。" }];
    idx = 0;
    document.querySelectorAll(".gnode").forEach(g => g.className.baseVal = "gnode");
    $("path").innerHTML = ""; $("usedCount").textContent = 0; $("status").textContent = steps[0].desc;
    return;
  }
  steps = genEulerSteps(eulerInfo.startV);
  idx = 0;
  draw(0);
}
function stepOnce() { if (idx < steps.length - 1) { idx++; draw(idx); return true; } return false; }
function play() { stop(); const spd = parseInt($("speedInput").value, 10); timer = setInterval(() => { if (!stepOnce()) stop(); }, 1550 - spd); }
function stop() { if (timer) { clearInterval(timer); timer = null; } }

let wantKind = "circuit";   // circuit=欧拉图（回路） / path=半欧拉图（路径）

function regenerate() {
  stop();
  const wantCircuit = wantKind === "circuit";
  const g = graphType === "undirected" ? genUndirected(wantCircuit) : genDirected(wantCircuit);
  NODES = g.nodes; EDGES = g.edges;
  $("note").innerHTML = graphType === "undirected"
    ? "无向图一笔画判定：连通且<code>奇度顶点数为 0</code> → 欧拉回路；<code>奇度顶点数为 2</code> → 欧拉路径（从一个奇度点到另一个）。"
    : "有向图一笔画判定：连通且<code>每点入度=出度</code> → 欧拉回路；恰好一点<code>出度-入度=1</code>（起点）、一点<code>入度-出度=1</code>（终点）→ 欧拉路径。";
  prepare();
}

function applyType(t) {
  graphType = t; stop();
  document.querySelectorAll(".subtab[data-type]").forEach(s => s.classList.toggle("active", s.dataset.type === t));
  regenerate();
}

function applyKind(kind) {
  wantKind = kind; stop();
  document.querySelectorAll(".subtab[data-kind]").forEach(s => s.classList.toggle("active", s.dataset.kind === kind));
  regenerate();
}

document.querySelectorAll(".subtab[data-type]").forEach(s => s.onclick = () => applyType(s.dataset.type));
document.querySelectorAll(".subtab[data-kind]").forEach(s => s.onclick = () => applyKind(s.dataset.kind));
$("playBtn").onclick = () => { if (idx >= steps.length - 1 || idx === 0) prepare(); play(); };
$("stepBtn").onclick = () => { stop(); stepOnce(); };
$("resetBtn").onclick = () => { stop(); prepare(); };
$("randBtn").onclick = () => regenerate();

applyType("undirected");
</script>
<script src="../assets/cppview.js"></script>
<script>
CppView.register({
  undirected: { title: "欧拉路径 / 回路（无向图，判定 + Hierholzer）— C++", code:
`// 功能：无向图求欧拉路径 / 欧拉回路(一笔画走遍每条边恰好一次)。
//       先判定，再用 Hierholzer 算法构造路径。
// 判定(在连通前提下)：奇度顶点数为 0 → 欧拉回路(任意点起)；
//                     奇度顶点数为 2 → 欧拉路径(从一个奇度点到另一个)；
//                     其余情况 → 无解。
// 输入：第一行 n m —— n 个点(编号 0~n-1)、m 条无向边；
//       接下来 m 行，每行 u v 表示一条无向边 u—v(允许重边)。
// 输出：若存在，输出一行经过的顶点序列(边数+1 个点)；否则输出 "无解"。
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

int n, m;
// 邻接表存 {邻居, 边编号}；无向边两端都存同一个编号，靠 used[] 标记走过
vector<pair<int,int>> adj[100005];
bool used[200005];         // 每条边是否已走过
int deg[100005];           // 各点的度数
vector<int> path;          // Hierholzer 得到的顶点序列

void hierholzer(int s) {
    // 用显式栈模拟递归，避免边多时递归过深
    vector<int> st, ptr(n, 0);   // ptr[v]：v 下一条待检查的邻接边下标
    st.push_back(s);
    while (!st.empty()) {
        int v = st.back();
        // 跳过已走过的边，找 v 还没走的一条边
        while (ptr[v] < (int)adj[v].size() && used[adj[v][ptr[v]].second]) ptr[v]++;
        if (ptr[v] < (int)adj[v].size()) {
            int to = adj[v][ptr[v]].first, eid = adj[v][ptr[v]].second;
            ptr[v]++;
            used[eid] = true;        // 标记该边已走
            st.push_back(to);        // 前进到邻居
        } else {
            path.push_back(v);       // 无边可走，回退并记录
            st.pop_back();
        }
    }
    reverse(path.begin(), path.end());
}

int main() {
    cin >> n >> m;
    for (int i = 0; i < m; i++) {
        int u, v; cin >> u >> v;
        adj[u].push_back({v, i});    // 同一条边编号 i 在两端各存一次
        adj[v].push_back({u, i});
        deg[u]++; deg[v]++;
    }

    // 统计奇度顶点，并确定起点
    int oddCnt = 0, start = 0;
    for (int i = 0; i < n; i++) if (deg[i] > 0) { start = i; break; }  // 默认起点：第一个有边的点
    for (int i = 0; i < n; i++) {
        if (deg[i] % 2 == 1) { oddCnt++; start = i; }   // 奇度点作为欧拉路径起点
    }

    if (oddCnt != 0 && oddCnt != 2) {   // 只有 0 或 2 个奇度点才可能一笔画
        cout << "无解" << endl;
        return 0;
    }

    hierholzer(start);

    // 走过的边数应为 m，即路径含 m+1 个点，否则图不连通
    if ((int)path.size() != m + 1) {
        cout << "无解" << endl;
        return 0;
    }
    for (int i = 0; i < (int)path.size(); i++)
        cout << path[i] << (i + 1 < (int)path.size() ? " " : "\\n");
    return 0;
}` },
  directed: { title: "欧拉路径 / 回路（有向图，判定 + Hierholzer）— C++", code:
`// 功能：有向图求欧拉路径 / 欧拉回路(沿边方向走遍每条边恰好一次)。
//       先判定，再用 Hierholzer 算法构造路径。
// 判定(在连通前提下)：每点入度=出度 → 欧拉回路；
//   恰好一点 出度-入度=1(起点)、一点 入度-出度=1(终点)、其余入=出 → 欧拉路径；
//   其余情况 → 无解。
// 输入：第一行 n m —— n 个点(编号 0~n-1)、m 条有向边；
//       接下来 m 行，每行 u v 表示一条有向边 u→v(允许重边)。
// 输出：若存在，输出一行经过的顶点序列(边数+1 个点)；否则输出 "无解"。
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

int n, m;
vector<int> adj[100005];   // 有向邻接表，adj[u] 存所有 u→v 的终点 v
int outd[100005], ind[100005];   // 出度、入度
vector<int> path;

void hierholzer(int s) {
    vector<int> st, ptr(n, 0);   // ptr[v]：v 下一条待走的出边下标
    st.push_back(s);
    while (!st.empty()) {
        int v = st.back();
        if (ptr[v] < (int)adj[v].size()) {
            int to = adj[v][ptr[v]];   // 有向图每条出边只属于 v，无需 used[]
            ptr[v]++;
            st.push_back(to);          // 沿出边前进
        } else {
            path.push_back(v);         // 无出边可走，回退记录
            st.pop_back();
        }
    }
    reverse(path.begin(), path.end());
}

int main() {
    cin >> n >> m;
    for (int i = 0; i < m; i++) {
        int u, v; cin >> u >> v;
        adj[u].push_back(v);   // 有向边 u→v
        outd[u]++; ind[v]++;
    }

    // 判定：统计 出度-入度，确定起点
    int start = 0, startCnt = 0, endCnt = 0, ok = 1;
    for (int i = 0; i < n; i++) if (outd[i] > 0) { start = i; break; }  // 默认起点
    for (int i = 0; i < n; i++) {
        int d = outd[i] - ind[i];
        if (d == 1) { startCnt++; start = i; }        // 起点：出度比入度多 1
        else if (d == -1) { endCnt++; }               // 终点：入度比出度多 1
        else if (d != 0) { ok = 0; }                  // 其余必须入=出
    }
    // 合法：全平衡(回路) 或 恰好一个起点一个终点(路径)
    if (!(ok && ((startCnt == 0 && endCnt == 0) || (startCnt == 1 && endCnt == 1)))) {
        cout << "无解" << endl;
        return 0;
    }

    hierholzer(start);

    if ((int)path.size() != m + 1) {   // 边未走全 → 不连通
        cout << "无解" << endl;
        return 0;
    }
    for (int i = 0; i < (int)path.size(); i++)
        cout << path[i] << (i + 1 < (int)path.size() ? " " : "\\n");
    return 0;
}` },
});
document.getElementById("cppBtn").onclick = () => CppView.open(graphType);
</script>
